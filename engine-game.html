<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="بازی شطرنج با موتور استوک‌فیش و بات‌های مختلف"
    />
    <title>ChessHub | بازی با موتور</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
      /* استایل‌های اختصاصی بازی با موتور (Pro Edition - Optimized) */
      .engine-wrapper {
        display: grid;
        grid-template-columns: 280px 1fr 280px;
        gap: 1.5rem;
        margin-bottom: 2rem;
      }
      .side-card {
        background: #ffffff;
        border-radius: var(--radius-lg);
        padding: 1.2rem;
        box-shadow: var(--shadow-sm);
        border: 1px solid #e2e8f0;
        height: fit-content;
      }
      .side-card h3 {
        font-size: 1.1rem;
        color: var(--primary-dark);
        border-right: 4px solid var(--accent);
        padding-right: 10px;
        margin-bottom: 1rem;
        font-weight: 800;
      }
      .bots-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.8rem;
      }
      .bot-item {
        background: #f8fafc;
        border: 2px solid #e2e8f0;
        border-radius: var(--radius-md);
        padding: 0.8rem;
        display: flex;
        align-items: center;
        gap: 0.8rem;
        cursor: pointer;
        transition: var(--transition-smooth);
      }
      .bot-item:hover {
        background: #f1f5f9;
        border-color: #cbd5e0;
      }
      .bot-item.active {
        background: #ebf8ff;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
      }
      .bot-item .mini-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #e2e8f0;
        overflow: hidden;
        flex-shrink: 0;
      }
      .bot-item .mini-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .bot-item .b-info {
        display: flex;
        flex-direction: column;
      }
      .bot-item .bname {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--text-dark);
      }
      .bot-item .brating {
        font-size: 0.75rem;
        color: var(--text-light);
        font-weight: 600;
      }

      .control-group {
        margin-bottom: 1.2rem;
      }
      .control-group:last-child {
        margin-bottom: 0;
      }
      .control-label {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-light);
        margin-bottom: 0.5rem;
        display: block;
      }
      .chips-group {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
      }
      .chip-btn {
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        padding: 0.4rem 0.8rem;
        border-radius: var(--radius-sm);
        font-family: "Vazir";
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition-smooth);
        color: var(--text-light);
      }
      .chip-btn.active {
        background: var(--accent);
        color: white;
        border-color: var(--accent-dark);
        box-shadow: 0 2px 4px rgba(49, 130, 206, 0.3);
      }
      .chip-btn:hover:not(.active) {
        background: #e2e8f0;
        color: var(--primary-dark);
      }

      .game-main {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .player-bar {
        background: #ffffff;
        border-radius: var(--radius-md);
        padding: 0.6rem 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: var(--shadow-sm);
        border: 1px solid #e2e8f0;
      }
      .player-info {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .player-avatar-sm {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #e2e8f0;
        overflow: hidden;
        border: 2px solid #cbd5e0;
      }
      .player-avatar-sm img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .player-name {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--text-dark);
      }
      .player-rating {
        font-size: 0.7rem;
        color: var(--text-light);
      }

      .timer-box {
        background: var(--primary-dark);
        color: #fff;
        padding: 0.3rem 0.8rem;
        border-radius: var(--radius-sm);
        font-family: monospace;
        font-weight: 700;
        font-size: 1rem;
        direction: ltr;
        min-width: 70px;
        text-align: center;
      }
      .timer-box.active-timer {
        background: var(--success);
        box-shadow: 0 0 0 3px rgba(56, 161, 105, 0.2);
      }
      .timer-box.low {
        background: var(--danger);
        animation: pulseUrgent 1s infinite;
      }

      .board-wrapper-engine {
        background: #ffffff;
        padding: 0.5rem;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-md);
        border: 1px solid #e2e8f0;
        touch-action: none;
      }
      #chessboard {
        width: 100%;
        max-width: 100%;
        aspect-ratio: 1/1;
        border-radius: var(--radius-sm);
        overflow: hidden;
        box-shadow: var(--shadow-board);
        border: 1px solid #cbd5e0;
        touch-action: none;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
      }
      .square {
        aspect-ratio: 1/1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: none;
        /* ترنزیشن حذف شد تا درگ کردن بدون لگ باشد */
      }
      .square.light {
        background-color: var(--board-light, #f0d9b5);
      }
      .square.dark {
        background-color: var(--board-dark, #b58863);
      }
      .square.selected {
        background-color: #f6e05e !important;
      }
      .square.computer-from,
      .square.computer-to {
        background-color: #90cdf4 !important;
      }
      .piece-img {
        width: 100%;
        height: 100%;
        pointer-events: none;
        user-select: none;
        will-change: transform;
      }

      .game-controls {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }
      .game-controls .btn {
        flex: 1;
        justify-content: center;
      }
      .btn {
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        padding: 0.5rem 1.2rem;
        border-radius: var(--radius-sm);
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition-smooth);
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-family: "Vazir";
        color: var(--text-dark);
      }
      .btn:hover {
        background: #e2e8f0;
        border-color: #cbd5e0;
        transform: translateY(-1px);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-primary {
        background: var(--accent);
        color: white;
        border: 1px solid var(--accent-dark);
        box-shadow:
          0 4px 0 var(--accent-dark),
          0 4px 12px rgba(49, 130, 206, 0.3);
      }
      .btn-primary:hover {
        background: #4299e1;
        transform: translateY(-1px);
        box-shadow:
          0 5px 0 var(--accent-dark),
          0 6px 15px rgba(49, 130, 206, 0.4);
      }
      .btn-primary:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 var(--accent-dark);
      }

      .history-list {
        max-height: 400px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        padding-left: 4px;
      }
      .history-list::-webkit-scrollbar {
        width: 4px;
      }
      .history-list::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      .history-list::-webkit-scrollbar-thumb {
        background: #cbd5e0;
        border-radius: 4px;
      }
      .move-item {
        background: #f8fafc;
        padding: 0.4rem 0.6rem;
        border-radius: var(--radius-sm);
        font-family: monospace;
        font-size: 0.85rem;
        color: var(--text-dark);
        display: flex;
        gap: 0.5rem;
        border: 1px solid #e2e8f0;
      }
      .move-num {
        color: var(--text-light);
        font-weight: 700;
      }
      .empty-history {
        color: var(--text-light);
        font-size: 0.8rem;
        text-align: center;
        padding: 1rem;
      }

      .result-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        z-index: 2000;
        display: none;
        justify-content: center;
        align-items: center;
        padding: 1rem;
      }
      .result-overlay.open {
        display: flex;
      }
      .result-card {
        background: #ffffff;
        border-radius: var(--radius-lg);
        padding: 2rem;
        max-width: 400px;
        width: 100%;
        text-align: center;
        box-shadow: var(--shadow-lg);
        animation: fadeIn 0.3s ease;
      }
      .result-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      .result-title {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--primary-dark);
        margin-bottom: 0.5rem;
      }
      .result-sub {
        font-size: 0.9rem;
        color: var(--text-light);
        margin-bottom: 1.5rem;
      }
      .result-stats {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
        padding: 1rem;
        background: #f8fafc;
        border-radius: var(--radius-md);
        border: 1px solid #e2e8f0;
      }
      .stat-box {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }
      .stat-label {
        font-size: 0.7rem;
        color: var(--text-light);
      }
      .stat-value {
        font-size: 1.2rem;
        font-weight: 800;
        color: var(--primary-dark);
        font-family: monospace;
      }
      .result-actions {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      @keyframes pulseUrgent {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(229, 62, 62, 0.4);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 0 8px rgba(229, 62, 62, 0);
        }
      }
      @media (max-width: 1024px) {
        .engine-wrapper {
          grid-template-columns: 1fr;
        }
        .side-card {
          width: 100%;
        }
        .bots-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      @media (max-width: 768px) {
        .bots-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .history-list {
          max-height: 200px;
        }
      }
      @media (max-width: 480px) {
        .bots-grid {
          grid-template-columns: 1fr;
        }
        .player-name {
          font-size: 0.8rem;
        }
        .timer-box {
          font-size: 0.85rem;
          min-width: 60px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <section class="app-hero">
        <h1><i class="fas fa-robot"></i> بازی با موتور</h1>
        <p>با بات‌های با سطوح مختلف از مبتدی تا استاد بزرگ بازی کن</p>
      </section>

      <div class="engine-wrapper">
        <div class="side-card">
          <h3><i class="fas fa-users"></i> انتخاب حریف</h3>
          <div class="bots-grid" id="botsGrid"></div>
          <div class="control-group" style="margin-top: 1.5rem">
            <span class="control-label">رنگ شما:</span>
            <div class="chips-group" id="colorGroup">
              <button class="chip-btn active" data-color="white">سفید</button>
              <button class="chip-btn" data-color="black">سیاه</button>
              <button class="chip-btn" data-color="random">تصادفی</button>
            </div>
          </div>
          <div class="control-group">
            <span class="control-label">زمان:</span>
            <div class="chips-group" id="timeGroup">
              <button class="chip-btn active" data-time="10+0">۱۰+۰</button>
              <button class="chip-btn" data-time="5+2">۵+۲</button>
              <button class="chip-btn" data-time="3+2">۳+۲</button>
              <button class="chip-btn" data-time="0">بی‌زمان</button>
            </div>
          </div>
        </div>

        <div class="game-main">
          <div class="player-bar">
            <div class="player-info">
              <div class="player-avatar-sm" id="botAvatarBox">
                <img src="images/bots/1.png" alt="Bot" id="botAvatarImg" />
              </div>
              <div>
                <div class="player-name" id="botName">بات لوئیس</div>
                <div class="player-rating" id="botRating">۲۵۰</div>
              </div>
            </div>
            <div class="timer-box" id="botTimerBox">10:00</div>
          </div>

          <div class="board-wrapper-engine">
            <div id="chessboard"></div>
          </div>

          <div class="player-bar">
            <div class="player-info">
              <div class="player-avatar-sm">
                <i
                  class="fas fa-user"
                  style="
                    color: var(--text-light);
                    width: 100%;
                    text-align: center;
                    margin-top: 8px;
                  "
                ></i>
              </div>
              <div>
                <div class="player-name">شما</div>
                <div class="player-rating" id="userRating">۱۲۰۰</div>
              </div>
            </div>
            <div class="timer-box" id="userTimerBox">10:00</div>
          </div>

          <div class="game-controls">
            <button class="btn btn-primary" id="playBtn">
              <i class="fas fa-play"></i> شروع بازی
            </button>
            <button class="btn" id="resignBtn">
              <i class="fas fa-flag"></i> تسلیم
            </button>
          </div>
        </div>

        <div class="side-card">
          <h3><i class="fas fa-history"></i> حرکات</h3>
          <div class="history-list" id="historyList">
            <div class="empty-history">هنوز حرکتی ثبت نشده</div>
          </div>
          <div style="margin-top: 1rem; display: flex; gap: 0.5rem">
            <button class="btn" style="flex: 1" id="copyPgnBtn">
              <i class="fas fa-copy"></i> کپی PGN
            </button>
            <button class="btn" style="flex: 1" id="downloadPgnBtn">
              <i class="fas fa-download"></i> دانلود
            </button>
          </div>
        </div>
      </div>

      <div id="footer-placeholder"></div>
    </div>

    <div class="result-overlay" id="resultOverlay">
      <div class="result-card">
        <div class="result-icon" id="resultIcon">🏆</div>
        <div class="result-title" id="resultTitle">برد!</div>
        <div class="result-sub" id="resultSub">آفرین! شما برنده شدید.</div>
        <div class="result-stats">
          <div class="stat-box">
            <span class="stat-label">حرکات</span
            ><span class="stat-value" id="resultMoves">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">زمان شما</span
            ><span class="stat-value" id="resultUserTime">0:00</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">زمان بات</span
            ><span class="stat-value" id="resultBotTime">0:00</span>
          </div>
        </div>
        <div class="result-actions">
          <button class="btn btn-primary" id="resultRematch">
            <i class="fas fa-redo"></i> بازی مجدد
          </button>
          <button class="btn" id="resultClose">بستن</button>
        </div>
      </div>
    </div>

    <script src="js/script.js"></script>
    <script>
      (function () {
        "use strict";

        (function applySavedTheme() {
          try {
            const settings = JSON.parse(
              localStorage.getItem("chesshub_settings"),
            );
            if (settings && settings.theme)
              document.body.classList.add(`theme-${settings.theme}`);
          } catch (e) {}
        })();

        const pieceCodes = {
          wk: "wk.png",
          wq: "wq.png",
          wr: "wr.png",
          wb: "wb.png",
          wn: "wn.png",
          wp: "wp.png",
          bk: "bk.png",
          bq: "bq.png",
          br: "br.png",
          bb: "bb.png",
          bn: "bn.png",
          bp: "bp.png",
        };
        let pieceSet = "neo";

        function getCurrentPieceSet() {
          try {
            const s = JSON.parse(localStorage.getItem("chesshub_settings"));
            return s?.pieceSet || "neo";
          } catch {
            return "neo";
          }
        }

        // ===== متغیرهای بازی =====
        let game = new Chess();
        let selectedSquare = null;
        let userColor = "w";
        let selectedBot = null;
        let selectedColorChoice = "white";
        let selectedTimeControl = "10+0";
        let userTime = 0,
          botTime = 0,
          userInc = 0,
          botInc = 0;
        let timerInterval = null;
        let isGameActive = false;
        let gameStarted = false;
        let gameEnded = false;
        let stockfish = null;
        let stockfishReady = false;
        let isWaitingForStockfish = false;
        let computerHighlight = null;
        let moveHistory = [];

        const BOTS = [
          {
            name: "لوئیس",
            rating: "۲۵۰",
            avatar: "images/bots/1.png",
            skillLevel: 0,
            depth: 2,
          },
          {
            name: "ماریا",
            rating: "۱۵۰۰",
            avatar: "images/bots/2.png",
            skillLevel: 8,
            depth: 8,
          },
          {
            name: "مانکی",
            rating: "۲۰۰۰",
            avatar: "images/bots/3.png",
            skillLevel: 15,
            depth: 12,
          },
          {
            name: "مگنوس",
            rating: "۲۸۸۲",
            avatar: "images/bots/Magnus_Carlsen.png",
            skillLevel: 20,
            depth: 20,
          },
        ];

        const boardDiv = document.getElementById("chessboard");
        const botsGrid = document.getElementById("botsGrid");
        const botAvatarImg = document.getElementById("botAvatarImg");
        const botName = document.getElementById("botName");
        const botRating = document.getElementById("botRating");
        const botTimerBox = document.getElementById("botTimerBox");
        const userTimerBox = document.getElementById("userTimerBox");
        const historyList = document.getElementById("historyList");
        const playBtn = document.getElementById("playBtn");
        const resignBtn = document.getElementById("resignBtn");
        const resultOverlay = document.getElementById("resultOverlay");

        // ===== معماری جدید: ذخیره خانه‌ها برای جلوگیری از لگ =====
        let boardSquares = {};

        function initStockfish() {
          try {
            stockfish = new Worker("js/stockfish.js");
            stockfish.onmessage = function (e) {
              const data = e.data;
              if (data.includes("uciok")) {
                stockfishReady = true;
                stockfish.postMessage(
                  "setoption name UCI_Chess960 value false",
                );
                stockfish.postMessage("setoption name Threads value 2");
                stockfish.postMessage("setoption name Hash value 256");
              } else if (data.includes("bestmove") && isWaitingForStockfish) {
                isWaitingForStockfish = false;
                const parts = data.split(" ");
                const bestMove = parts[1];
                if (bestMove && bestMove !== "(none)") {
                  executeMove({
                    from: bestMove.slice(0, 2),
                    to: bestMove.slice(2, 4),
                    promotion: bestMove.length === 5 ? bestMove[4] : null,
                  });
                }
              }
            };
            stockfish.postMessage("uci");
          } catch (e) {
            console.error("Stockfish init error", e);
          }
        }

        function requestComputerMove() {
          if (!isGameActive || gameEnded || game.turn() === userColor) return;
          isWaitingForStockfish = true;
          if (stockfish && stockfishReady) {
            stockfish.postMessage("stop");
            stockfish.postMessage("position fen " + game.fen());
            stockfish.postMessage("go depth " + (selectedBot.depth || 12));
          } else {
            const moves = game.moves({ verbose: true });
            if (moves.length > 0)
              executeMove(moves[Math.floor(Math.random() * moves.length)]);
          }
        }

        // ===== ساخت تخته فقط برای یک بار (بهینه‌سازی فوق‌العاده) =====
        function buildBoardDOM() {
          boardDiv.innerHTML = "";
          boardSquares = {};
          const flipped = userColor === "b";

          for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
              const row = flipped ? 7 - i : i;
              const col = flipped ? 7 - j : j;
              const squareName = String.fromCharCode(97 + col) + (8 - row);

              const sq = document.createElement("div");
              sq.className = `square ${(row + col) % 2 === 0 ? "light" : "dark"}`;
              sq.dataset.square = squareName;

              const img = document.createElement("img");
              img.classList.add("piece-img");
              img.draggable = false;
              img.style.display = "none";
              sq.appendChild(img);

              boardDiv.appendChild(sq);
              boardSquares[squareName] = { div: sq, img: img };
            }
          }
          updateBoardContent();
        }

        // ===== آپدیت سریع تخته بدون بازسازی آن =====
        function updateBoardContent() {
          if (!game) return;
          const board = game.board();
          const flipped = userColor === "b";

          for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
              const row = flipped ? 7 - i : i;
              const col = flipped ? 7 - j : j;
              const piece = board[row][col];
              const squareName = String.fromCharCode(97 + col) + (8 - row);
              const sqData = boardSquares[squareName];
              if (!sqData) continue;

              sqData.div.classList.remove(
                "selected",
                "computer-from",
                "computer-to",
              );

              if (piece) {
                const key =
                  (piece.color === "w" ? "w" : "b") + piece.type.toLowerCase();
                const newSrc = `pieces/${pieceSet}/${pieceCodes[key]}`;
                if (sqData.img.src.indexOf(newSrc) === -1) {
                  sqData.img.src = newSrc;
                }
                sqData.img.style.display = "block";
              } else {
                sqData.img.style.display = "none";
              }
            }
          }

          if (computerHighlight) {
            if (boardSquares[computerHighlight.from])
              boardSquares[computerHighlight.from].div.classList.add(
                "computer-from",
              );
            if (boardSquares[computerHighlight.to])
              boardSquares[computerHighlight.to].div.classList.add(
                "computer-to",
              );
          }
          if (selectedSquare && boardSquares[selectedSquare]) {
            boardSquares[selectedSquare].div.classList.add("selected");
          }
        }

        function updateHistory() {
          const hist = game.history({ verbose: true });
          if (hist.length === 0) {
            historyList.innerHTML =
              '<div class="empty-history">هنوز حرکتی ثبت نشده</div>';
            return;
          }
          let html = "";
          for (let i = 0; i < hist.length; i += 2) {
            const num = Math.floor(i / 2) + 1;
            html += `<div class="move-item"><span class="move-num">${num}.</span> ${hist[i].san} ${hist[i + 1] ? hist[i + 1].san : ""}</div>`;
          }
          historyList.innerHTML = html;
          historyList.scrollTop = historyList.scrollHeight;
        }

        function executeMove(moveData) {
          try {
            const move = game.move({
              from: moveData.from,
              to: moveData.to,
              promotion: moveData.promotion || "q",
            });
            if (move) {
              moveHistory.push(move);
              if (game.turn() === userColor) {
                addIncrement("bot");
                computerHighlight = { from: move.from, to: move.to };
              } else {
                addIncrement("user");
                computerHighlight = null;
              }

              updateBoardContent(); // آپدیت سریع به جای رندر کامل
              updateHistory();

              if (game.game_over()) {
                endGame(game.in_checkmate() ? "checkmate" : "draw");
                return;
              }
              if (game.turn() !== userColor && isGameActive)
                setTimeout(() => requestComputerMove(), 200);
            }
          } catch (e) {
            console.error("Move error:", e);
          }
        }

        function formatTime(s) {
          if (s < 0) s = 0;
          const m = Math.floor(s / 60);
          const sec = Math.floor(s % 60);
          return `${m.toString().padStart(2, "0")}:${sec.toString().padStart(2, "0")}`;
        }
        function updateTimers() {
          userTimerBox.textContent =
            userTime === Infinity ? "∞" : formatTime(userTime);
          botTimerBox.textContent =
            botTime === Infinity ? "∞" : formatTime(botTime);
          userTimerBox.classList.toggle(
            "low",
            userTime < 10 && userTime > 0 && isGameActive,
          );
          botTimerBox.classList.toggle(
            "low",
            botTime < 10 && botTime > 0 && isGameActive,
          );
          if (isGameActive && gameStarted && !gameEnded) {
            userTimerBox.classList.toggle(
              "active-timer",
              game.turn() === userColor,
            );
            botTimerBox.classList.toggle(
              "active-timer",
              game.turn() !== userColor,
            );
          } else {
            userTimerBox.classList.remove("active-timer");
            botTimerBox.classList.remove("active-timer");
          }
          if (userTime <= 0 && isGameActive && gameStarted)
            endGame("timeout", "user");
          if (botTime <= 0 && isGameActive && gameStarted)
            endGame("timeout", "bot");
        }
        function startTimer() {
          if (timerInterval) clearInterval(timerInterval);
          timerInterval = setInterval(() => {
            if (!isGameActive || !gameStarted || gameEnded) return;
            if (game.turn() === userColor) userTime -= 0.1;
            else botTime -= 0.1;
            updateTimers();
          }, 100);
        }
        function addIncrement(who) {
          if (!gameStarted || gameEnded) return;
          if (who === "user") userTime += userInc;
          else botTime += botInc;
          updateTimers();
        }
        function resetTimers() {
          if (timerInterval) clearInterval(timerInterval);
          if (selectedTimeControl === "0") {
            userTime = Infinity;
            botTime = Infinity;
            userInc = 0;
            botInc = 0;
            userTimerBox.textContent = "∞";
            botTimerBox.textContent = "∞";
          } else {
            const parts = selectedTimeControl.split("+");
            userTime = parseInt(parts[0]) * 60;
            botTime = userTime;
            userInc = parseInt(parts[1]) || 0;
            botInc = userInc;
            updateTimers();
          }
        }

        function endGame(reason, loser) {
          if (gameEnded) return;
          gameEnded = true;
          isGameActive = false;
          gameStarted = false;
          if (timerInterval) clearInterval(timerInterval);
          if (stockfish) stockfish.postMessage("stop");
          computerHighlight = null;
          updateBoardContent();

          let icon = "🤝",
            title = "مساوی!",
            sub = "بازی با نتیجه برابر تمام شد.";
          if (reason === "checkmate") {
            const userWon = game.turn() !== userColor;
            icon = userWon ? "🏆" : "😔";
            title = userWon ? "برد!" : "باخت!";
            sub = userWon
              ? `آفرین! شما ${selectedBot.name} را مات کردید.`
              : `${selectedBot.name} شما را مات کرد.`;
          } else if (reason === "timeout") {
            if (loser === "user") {
              icon = "⏰";
              title = "باخت!";
              sub = "زمان شما تمام شد.";
            } else {
              icon = "🏆";
              title = "برد!";
              sub = `زمان ${selectedBot.name} تمام شد.`;
            }
          } else if (reason === "resign") {
            icon = "🏳️";
            title = "باخت!";
            sub = "شما تسلیم شدید.";
          }

          document.getElementById("resultIcon").textContent = icon;
          document.getElementById("resultTitle").textContent = title;
          document.getElementById("resultSub").textContent = sub;
          document.getElementById("resultMoves").textContent = Math.ceil(
            moveHistory.length / 2,
          );
          document.getElementById("resultUserTime").textContent =
            userTime === Infinity ? "∞" : formatTime(userTime);
          document.getElementById("resultBotTime").textContent =
            botTime === Infinity ? "∞" : formatTime(botTime);

          resultOverlay.classList.add("open");
          playBtn.innerHTML = '<i class="fas fa-play"></i> شروع بازی جدید';
        }

        function startGame() {
          if (gameStarted) {
            resetGame();
            return;
          }
          if (selectedColorChoice === "random")
            userColor = Math.random() < 0.5 ? "w" : "b";
          else userColor = selectedColorChoice === "white" ? "w" : "b";

          gameEnded = false;
          gameStarted = true;
          isGameActive = true;
          game = new Chess();
          moveHistory = [];
          selectedSquare = null;
          computerHighlight = null;
          resetTimers();
          buildBoardDOM();
          startTimer(); // ساخت تخته فقط در شروع بازی
          playBtn.innerHTML = '<i class="fas fa-stop"></i> توقف بازی';

          if (game.turn() !== userColor)
            setTimeout(() => requestComputerMove(), 500);
        }

        function resetGame() {
          if (timerInterval) clearInterval(timerInterval);
          gameEnded = false;
          gameStarted = false;
          isGameActive = false;
          game = new Chess();
          moveHistory = [];
          selectedSquare = null;
          computerHighlight = null;
          if (stockfish) stockfish.postMessage("stop");
          resultOverlay.classList.remove("open");
          buildBoardDOM();
          resetTimers(); // ساخت مجدد تخته برای رنگ جدید
          playBtn.innerHTML = '<i class="fas fa-play"></i> شروع بازی';
        }

        function buildBotsGrid() {
          botsGrid.innerHTML = "";
          BOTS.forEach((bot, idx) => {
            const div = document.createElement("div");
            div.className = `bot-item${idx === 0 ? " active" : ""}`;
            div.innerHTML = `
              <div class="mini-avatar"><img src="${bot.avatar}" alt="${bot.name}" onerror="this.src='https://ui-avatars.com/api/?background=2c3e50&color=fff&name=${bot.name}'"></div>
              <div class="b-info"><span class="bname">${bot.name}</span><span class="brating">${bot.rating}</span></div>
            `;
            div.addEventListener("click", () => {
              document
                .querySelectorAll(".bot-item")
                .forEach((e) => e.classList.remove("active"));
              div.classList.add("active");
              selectedBot = BOTS[idx];
              botAvatarImg.src = selectedBot.avatar;
              botName.textContent = selectedBot.name;
              botRating.textContent = selectedBot.rating;
              if (gameStarted) resetGame();
            });
            botsGrid.appendChild(div);
          });
          selectedBot = BOTS[0];
          botAvatarImg.src = selectedBot.avatar;
          botName.textContent = selectedBot.name;
          botRating.textContent = selectedBot.rating;
        }

        // ===== سیستم درگ با شتاب‌دهنده گرافیکی (بدون لگ) =====
        let dragStart = null,
          isDragging = false,
          dragClone = null,
          rafId = null,
          lastX = 0,
          lastY = 0,
          cloneSize = 0;

        function createDragClone(square, cx, cy) {
          const sqData = boardSquares[square];
          if (!sqData) return null;
          const img = sqData.img;
          if (!img || img.style.display === "none") return null;

          const rect = sqData.div.getBoundingClientRect();
          cloneSize = rect.width;

          const clone = img.cloneNode(true);
          // استفاده از translate3d برای فعال سازی GPU گوشی
          clone.style.cssText = `
            position: fixed; pointer-events: none; z-index: 9999;
            width: ${cloneSize}px; height: ${cloneSize}px;
            left: 0; top: 0;
            transform: translate3d(${cx - cloneSize / 2}px, ${cy - cloneSize / 2}px, 0) scale(1.05);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
            will-change: transform;
          `;
          document.body.appendChild(clone);
          img.style.opacity = "0"; // مخفی کردن مهره اصلی
          return clone;
        }

        function updateDragClone() {
          if (dragClone) {
            dragClone.style.transform = `translate3d(${lastX - cloneSize / 2}px, ${lastY - cloneSize / 2}px, 0) scale(1.05)`;
          }
          rafId = null; // ریست فلگ
        }

        function onPointerDown(e) {
          if (!isGameActive || gameEnded || game.turn() !== userColor) return;
          const cx = e.touches ? e.touches[0].clientX : e.clientX;
          const cy = e.touches ? e.touches[0].clientY : e.clientY;

          const el = document.elementFromPoint(cx, cy);
          const sq = el?.closest?.(".square");
          if (!sq) return;

          const square = sq.dataset.square;
          const piece = game.get(square);

          if (piece && piece.color === userColor) {
            e.preventDefault();
            dragStart = square;
            isDragging = true;
            dragClone = createDragClone(square, cx, cy);
            document.body.style.userSelect = "none";
          } else if (selectedSquare) {
            e.preventDefault();
            if (square !== selectedSquare)
              executeMove({ from: selectedSquare, to: square });
            selectedSquare = null;
            updateBoardContent();
          }
        }

        function onPointerMove(e) {
          if (!isDragging) return;
          e.preventDefault(); // جلوگیری از اسکرول سایت در موبایل
          lastX = e.touches ? e.touches[0].clientX : e.clientX;
          lastY = e.touches ? e.touches[0].clientY : e.clientY;

          // هماهنگی با نرخ نوسازی صفحه (60fps) برای جلوگیری از لگ
          if (!rafId) {
            rafId = requestAnimationFrame(updateDragClone);
          }
        }

        function onPointerUp(e) {
          if (!isDragging || !dragStart) {
            cleanupDrag();
            return;
          }

          const cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
          const cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

          if (dragClone) {
            dragClone.remove();
            dragClone = null;
          }
          if (boardSquares[dragStart] && boardSquares[dragStart].img)
            boardSquares[dragStart].img.style.opacity = "1";

          const el = document.elementFromPoint(cx, cy);
          const target = el?.closest?.(".square");
          const to = target ? target.dataset.square : null;

          if (to && to !== dragStart) {
            executeMove({ from: dragStart, to: to });
          } else {
            selectedSquare = to === dragStart ? dragStart : null;
            updateBoardContent();
          }
          cleanupDrag();
        }

        function cleanupDrag() {
          if (dragClone) {
            dragClone.remove();
            dragClone = null;
          }
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
          dragStart = null;
          isDragging = false;
          document.body.style.userSelect = "";
        }

        function onClickFallback(e) {
          if (isDragging) return;
          if (!isGameActive || gameEnded || game.turn() !== userColor) return;
          const sq = e.target.closest?.(".square");
          if (!sq) return;
          const square = sq.dataset.square;

          if (selectedSquare === null) {
            const piece = game.get(square);
            if (piece && piece.color === userColor) {
              selectedSquare = square;
              updateBoardContent();
            }
          } else {
            if (square !== selectedSquare) {
              executeMove({ from: selectedSquare, to: square });
            }
            selectedSquare = null;
            updateBoardContent();
          }
        }

        function initSettings() {
          document.querySelectorAll("#colorGroup .chip-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              document
                .querySelectorAll("#colorGroup .chip-btn")
                .forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
              selectedColorChoice = btn.dataset.color;
              if (gameStarted) resetGame();
            });
          });
          document.querySelectorAll("#timeGroup .chip-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              document
                .querySelectorAll("#timeGroup .chip-btn")
                .forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
              selectedTimeControl = btn.dataset.time;
              if (gameStarted) resetGame();
              else resetTimers();
            });
          });
        }

        function copyPGN() {
          if (moveHistory.length === 0) return alert("هیچ حرکتی ثبت نشده!");
          navigator.clipboard
            .writeText(game.pgn())
            .then(() => alert("✅ PGN کپی شد"));
        }
        function downloadPGN() {
          if (moveHistory.length === 0) return alert("هیچ حرکتی ثبت نشده!");
          const blob = new Blob([game.pgn()], { type: "text/plain" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `game_vs_${selectedBot.name}.pgn`;
          a.click();
        }

        async function init() {
          pieceSet = getCurrentPieceSet();
          document.addEventListener("pieceSetChanged", () => {
            pieceSet = getCurrentPieceSet();
            if (game) updateBoardContent();
          });

          initStockfish();
          buildBotsGrid();
          initSettings();
          resetTimers();
          buildBoardDOM();

          playBtn.addEventListener("click", startGame);
          resignBtn.addEventListener("click", () => {
            if (isGameActive) endGame("resign");
          });
          document
            .getElementById("resultRematch")
            .addEventListener("click", () => {
              resultOverlay.classList.remove("open");
              resetGame();
              setTimeout(startGame, 100);
            });
          document
            .getElementById("resultClose")
            .addEventListener("click", () => {
              resultOverlay.classList.remove("open");
              resetGame();
            });
          document
            .getElementById("copyPgnBtn")
            .addEventListener("click", copyPGN);
          document
            .getElementById("downloadPgnBtn")
            .addEventListener("click", downloadPGN);

          boardDiv.addEventListener("mousedown", onPointerDown);
          window.addEventListener("mousemove", onPointerMove);
          window.addEventListener("mouseup", onPointerUp);
          boardDiv.addEventListener("touchstart", onPointerDown, {
            passive: false,
          });
          boardDiv.addEventListener("touchmove", onPointerMove, {
            passive: false,
          });
          boardDiv.addEventListener("touchend", onPointerUp, {
            passive: false,
          });
          boardDiv.addEventListener("click", onClickFallback);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
