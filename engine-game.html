<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="بازی شطرنج با موتور استوک‌فیش و بات‌های با هوش مصنوعی بر اساس ریتینگ"
    />
    <title>ChessHub | بازی با موتور</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/engine-game.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <section class="app-hero">
        <h1><i class="fas fa-robot"></i> بازی با موتور هوشمند</h1>
        <p>بات‌ها بر اساس ریتینگ واقعی بازی می‌کنند، دقیقاً مثل یک انسان!</p>
      </section>

      <div class="engine-wrapper">
        <div class="side-card">
          <h3><i class="fas fa-users"></i> انتخاب حریف</h3>
          <div class="bots-grid" id="botsGrid"></div>
          <div class="control-group" style="margin-top: 1.5rem">
            <span class="control-label">رنگ شما:</span>
            <div class="chips-group" id="colorGroup">
              <button class="chip-btn active" data-color="white">سفید</button>
              <button class="chip-btn" data-color="black">سیاه</button>
              <button class="chip-btn" data-color="random">تصادفی</button>
            </div>
          </div>
          <div class="control-group">
            <span class="control-label">زمان:</span>
            <div class="chips-group" id="timeGroup">
              <button class="chip-btn active" data-time="10+0">۱۰+۰</button>
              <button class="chip-btn" data-time="5+2">۵+۲</button>
              <button class="chip-btn" data-time="3+2">۳+۲</button>
              <button class="chip-btn" data-time="0">بی‌زمان</button>
            </div>
          </div>
        </div>

        <div class="game-main">
          <div class="player-bar">
            <div class="player-info">
              <div class="player-avatar-sm" id="botAvatarBox">
                <img src="images/bots/1.png" alt="Bot" id="botAvatarImg" />
              </div>
              <div>
                <div class="player-name" id="botName">بات لوئیس</div>
                <div class="player-rating" id="botRating">۲۵۰</div>
              </div>
            </div>
            <div class="timer-box" id="botTimerBox">10:00</div>
          </div>

          <div class="board-wrapper-engine">
            <div id="chessboard"></div>
          </div>

          <div class="player-bar">
            <div class="player-info">
              <div class="player-avatar-sm">
                <i
                  class="fas fa-user"
                  style="
                    color: var(--text-light);
                    width: 100%;
                    text-align: center;
                    margin-top: 8px;
                  "
                ></i>
              </div>
              <div>
                <div class="player-name">شما</div>
                <div class="player-rating">۱۲۰۰</div>
              </div>
            </div>
            <div class="timer-box" id="userTimerBox">10:00</div>
          </div>

          <div class="game-controls">
            <button class="btn btn-primary" id="playBtn">
              <i class="fas fa-play"></i> شروع بازی
            </button>
            <button class="btn" id="resignBtn">
              <i class="fas fa-flag"></i> تسلیم
            </button>
          </div>
        </div>

        <div class="side-card">
          <h3><i class="fas fa-history"></i> حرکات</h3>
          <div class="history-list" id="historyList">
            <div class="empty-history">هنوز حرکتی ثبت نشده</div>
          </div>
          <div style="margin-top: 1rem; display: flex; gap: 0.5rem">
            <button class="btn" style="flex: 1" id="copyPgnBtn">
              <i class="fas fa-copy"></i> کپی PGN
            </button>
            <button class="btn" style="flex: 1" id="downloadPgnBtn">
              <i class="fas fa-download"></i> دانلود
            </button>
          </div>
        </div>
      </div>

      <div id="footer-placeholder"></div>
    </div>

    <div class="result-overlay" id="resultOverlay">
      <div class="result-card">
        <div class="result-icon" id="resultIcon">🏆</div>
        <div class="result-title" id="resultTitle">برد!</div>
        <div class="result-sub" id="resultSub">آفرین! شما برنده شدید.</div>
        <div class="result-stats">
          <div class="stat-box">
            <span class="stat-label">حرکات</span
            ><span class="stat-value" id="resultMoves">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">زمان شما</span
            ><span class="stat-value" id="resultUserTime">0:00</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">زمان بات</span
            ><span class="stat-value" id="resultBotTime">0:00</span>
          </div>
        </div>
        <div class="result-actions">
          <button class="btn btn-primary" id="resultRematch">
            <i class="fas fa-redo"></i> بازی مجدد
          </button>
          <button class="btn" id="resultClose">بستن</button>
        </div>
      </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/engine-game.js"></script>
  </body>
</html>
