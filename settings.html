<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ChessHub | تنظیمات</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .settings-card {
        background: #ffffff;
        border-radius: var(--radius-lg);
        padding: 1.5rem;
        box-shadow: var(--shadow-md);
        margin-bottom: 1.5rem;
        border: 1px solid #e2e8f0;
        flex-shrink: 0;
      }
      .settings-card .card-title {
        font-size: 1.2rem;
        color: var(--primary-dark);
        border-right: 4px solid var(--accent);
        padding-right: 12px;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 800;
      }
      .settings-card .card-title i {
        color: var(--accent);
      }
      .settings-card .card-sub {
        font-size: 0.8rem;
        color: var(--text-light);
        margin: 0 0 1.2rem 16px;
        font-weight: 600;
      }

      .theme-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        gap: 1rem;
        margin-bottom: 0.5rem;
      }
      .theme-btn {
        background: #f8fafc;
        border: 2px solid #e2e8f0;
        border-radius: var(--radius-md);
        padding: 0.6rem 0.3rem;
        cursor: pointer;
        transition: var(--transition-smooth);
        text-align: center;
      }
      .theme-btn:hover {
        transform: translateY(-2px);
        border-color: #cbd5e0;
        box-shadow: var(--shadow-sm);
      }
      .theme-btn.active {
        border-color: var(--accent);
        background: #ebf8ff;
        box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
      }
      .theme-btn .theme-preview {
        display: flex;
        width: 100%;
        height: 40px;
        border-radius: var(--radius-sm);
        border: 1px solid rgba(0, 0, 0, 0.06);
        overflow: hidden;
      }
      .theme-btn .theme-preview .preview-light,
      .theme-btn .theme-preview .preview-dark {
        flex: 1;
        height: 100%;
      }

      #pieceSetsContainer {
        max-height: 400px;
        overflow-y: auto;
        padding-left: 4px;
        padding-right: 2px;
        scroll-behavior: smooth;
        margin-bottom: 0.5rem;
      }
      #pieceSetsContainer::-webkit-scrollbar {
        width: 6px;
      }
      #pieceSetsContainer::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 10px;
      }
      #pieceSetsContainer::-webkit-scrollbar-thumb {
        background: #cbd5e0;
        border-radius: 10px;
      }
      #pieceSetsContainer::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }

      .piece-section {
        margin-bottom: 1.2rem;
      }
      .piece-section:last-child {
        margin-bottom: 0;
      }
      .piece-section .section-label {
        font-size: 0.75rem;
        color: var(--text-light);
        font-weight: 700;
        display: block;
        margin-bottom: 0.6rem;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .piece-section .section-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
      }
      .piece-btn {
        background: #ffffff;
        border: 2px solid #e2e8f0;
        border-radius: var(--radius-md);
        padding: 0.6rem;
        cursor: pointer;
        transition: var(--transition-smooth);
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 75px;
        min-height: 75px;
      }
      .piece-btn:hover {
        transform: translateY(-2px);
        border-color: #cbd5e0;
        box-shadow: var(--shadow-sm);
      }
      .piece-btn.active {
        border-color: var(--accent);
        background: #ebf8ff;
        box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
      }
      .piece-btn .piece-preview {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
      }
      .piece-btn .piece-preview img {
        width: 50px;
        height: 50px;
        object-fit: contain;
        display: block;
      }
      .piece-btn .piece-preview .piece-fallback {
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        background: #f1f5f9;
        border-radius: var(--radius-sm);
        color: var(--text-light);
      }

      .settings-actions {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid #e2e8f0;
      }
      .settings-actions .btn {
        padding: 0.6rem 1.5rem;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        font-family: "Vazir";
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition-smooth);
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .settings-actions .btn-primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent-dark);
        box-shadow: 0 4px 0 var(--accent-dark);
      }
      .settings-actions .btn-primary:hover {
        background: #4299e1;
        transform: translateY(-1px);
        box-shadow: 0 5px 0 var(--accent-dark);
      }
      .settings-actions .btn-primary:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 var(--accent-dark);
      }

      .settings-actions .btn-secondary {
        background: #f1f5f9;
        color: var(--text-dark);
        border-color: #e2e8f0;
        box-shadow: 0 4px 0 #cbd5e0;
      }
      .settings-actions .btn-secondary:hover {
        background: #e2e8f0;
        transform: translateY(-1px);
        box-shadow: 0 5px 0 #cbd5e0;
      }
      .settings-actions .btn-secondary:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #cbd5e0;
      }

      .settings-toast {
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        background: var(--primary-dark);
        color: #fff;
        padding: 0.8rem 1.5rem;
        border-radius: 40px;
        font-size: 0.85rem;
        font-family: "Vazir", sans-serif;
        box-shadow: var(--shadow-lg);
        z-index: 9999;
        direction: rtl;
        opacity: 0;
        transition: all 0.3s ease;
        pointer-events: none;
        max-width: 90vw;
        text-align: center;
        font-weight: 600;
      }
      .settings-toast.show {
        opacity: 1;
        bottom: 3rem;
      }

      @media (max-width: 768px) {
        .settings-card {
          padding: 1.2rem;
        }
        .theme-grid {
          grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
          gap: 0.6rem;
        }
        .theme-btn {
          padding: 0.5rem 0.2rem;
        }
        .theme-btn .theme-preview {
          height: 34px;
        }
        #pieceSetsContainer {
          max-height: 350px;
        }
        .piece-btn {
          min-width: 65px;
          min-height: 65px;
          padding: 0.5rem;
        }
        .piece-btn .piece-preview img,
        .piece-btn .piece-preview .piece-fallback {
          width: 45px;
          height: 45px;
        }
        .settings-actions .btn {
          font-size: 0.8rem;
          padding: 0.5rem 1.2rem;
        }
      }
      @media (max-width: 480px) {
        .settings-card {
          padding: 1rem;
          border-radius: var(--radius-md);
        }
        .settings-card .card-title {
          font-size: 1rem;
        }
        .theme-grid {
          grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
          gap: 0.4rem;
        }
        .theme-btn .theme-preview {
          height: 28px;
          border-radius: 4px;
        }
        #pieceSetsContainer {
          max-height: 300px;
        }
        .piece-btn {
          min-width: 60px;
          min-height: 60px;
          padding: 0.4rem;
        }
        .piece-btn .piece-preview img,
        .piece-btn .piece-preview .piece-fallback {
          width: 40px;
          height: 40px;
        }
        .settings-actions {
          gap: 0.5rem;
          margin-top: 1rem;
          padding-top: 1rem;
        }
        .settings-actions .btn {
          font-size: 0.75rem;
          padding: 0.4rem 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <!-- بنر یکپارچه -->
      <section class="app-hero">
        <h1><i class="fas fa-cog"></i> تنظیمات</h1>
        <p>مجموعه مهره‌ها و تم رنگی مورد علاقه خود را انتخاب کنید</p>
      </section>

      <!-- انتخاب تم -->
      <div class="settings-card">
        <div class="card-title"><i class="fas fa-palette"></i> تم رنگی</div>
        <div class="card-sub">۲۹ تم رنگی برای تخته شطرنج</div>
        <div class="theme-grid" id="themeGrid"></div>
      </div>

      <!-- انتخاب مهره‌ها -->
      <div class="settings-card">
        <div class="card-title">
          <i class="fas fa-chess-queen"></i> مجموعه مهره‌ها
        </div>
        <div class="card-sub">
          <span id="pieceCountDisplay">۳۸</span> مجموعه مختلف – انتخاب شما در
          تمام بخش‌ها اعمال می‌شود
        </div>
        <div id="pieceSetsContainer"></div>

        <div class="settings-actions">
          <button class="btn btn-primary" id="saveSettingsBtn">
            <i class="fas fa-save"></i> ذخیره تنظیمات
          </button>
          <button class="btn btn-secondary" id="resetSettingsBtn">
            <i class="fas fa-undo"></i> بازنشانی به پیش‌فرض
          </button>
        </div>
      </div>

      <div id="footer-placeholder"></div>
    </div>

    <div class="settings-toast" id="settingsToast"></div>

    <script src="js/script.js"></script>
    <script>
      (function () {
        "use strict";

        // اعمال تم ذخیره‌شده
        (function applySavedTheme() {
          try {
            const settings = JSON.parse(
              localStorage.getItem("chesshub_settings"),
            );
            if (settings && settings.theme) {
              document.body.classList.add(`theme-${settings.theme}`);
            } else {
              document.body.classList.add("theme-1");
            }
          } catch (e) {}
        })();

        const themes = [
          { id: "1", light: "#6a9b41", dark: "#f3f3f4" },
          { id: "2", light: "#c7703c", dark: "#ecc79b" },
          { id: "3", light: "#4b7399", dark: "#eae9d2" },
          { id: "4", light: "#b58863", dark: "#f0d9b5" },
          { id: "5", light: "#fcd8dd", dark: "#ffffff" },
          { id: "6", light: "#854d2d", dark: "#e0b88f" },
          { id: "7", light: "#6f3b29", dark: "#ba8d51" },
          { id: "8", light: "#2b323f", dark: "#717b8e" },
          { id: "9", light: "#769656", dark: "#eeeed2" },
          { id: "10", light: "#7b9eb3", dark: "#cddbe2" },
          { id: "11", light: "#ababab", dark: "#dcdcdc" },
          { id: "12", light: "#9ea6a1", dark: "#dce6e6" },
          { id: "13", light: "#726d68", dark: "#beb7a0" },
          { id: "14", light: "#6e6f6f", dark: "#e0e0e0" },
          { id: "15", light: "#6c625f", dark: "#cccccc" },
          { id: "16", light: "#d08b18", dark: "#fce4b2" },
          { id: "17", light: "#52514e", dark: "#cac8bf" },
          { id: "18", light: "#8877b7", dark: "#efefef" },
          { id: "19", light: "#ba5546", dark: "#f0d8bf" },
          { id: "20", light: "#4f4d4b", dark: "#aca8a1" },
          { id: "21", light: "#d3a36a", dark: "#edc9a2" },
          { id: "22", light: "#c2d7e2", dark: "#efefef" },
          { id: "23", light: "#6e4e37", dark: "#b89a75" },
          { id: "24", light: "#33684b", dark: "#efefec" },
          { id: "25", light: "#ababab", dark: "#efefef" },
          { id: "26", light: "#845c3a", dark: "#c09d65" },
          { id: "27", light: "#a6865f", dark: "#a9a9a9" },
          { id: "28", light: "#b8a671", dark: "#e3e0c5" },
          { id: "29", light: "#c6b19d", dark: "#d0bbaf" },
        ];

        const pieceSets = {
          پیش‌فرض: ["neo"],
          "سه بعدی": ["3d_chesskid", "3d_plastic", "3d_staunton", "3d_wood"],
          کلاسیک: [
            "alpha",
            "bases",
            "classic",
            "club",
            "condal",
            "tournament",
            "vintage",
          ],
          مدرن: ["glass", "light", "marble", "metal", "modern", "neon"],
          کارتونی: ["8_bit", "bubblegum", "graffiti", "lolz", "tigers"],
          طبیعت: ["icy_sea", "nature", "neo_wood", "ocean", "sky", "wood"],
          ویژه: [
            "blindfold",
            "book",
            "cases",
            "dash",
            "game_room",
            "gothic",
            "maya",
            "newspaper",
            "space",
          ],
        };

        function loadSettings() {
          try {
            const saved = localStorage.getItem("chesshub_settings");
            if (saved) return JSON.parse(saved);
          } catch (e) {}
          return { pieceSet: "neo", theme: "1" };
        }

        function saveSettings(settings) {
          try {
            localStorage.setItem("chesshub_settings", JSON.stringify(settings));
          } catch (e) {}
        }

        function buildThemeButtons() {
          const container = document.getElementById("themeGrid");
          if (!container) return;
          const currentTheme = loadSettings().theme || "1";
          container.innerHTML = "";
          themes.forEach((theme) => {
            const btn = document.createElement("button");
            btn.className = `theme-btn${theme.id === currentTheme ? " active" : ""}`;
            btn.dataset.theme = theme.id;
            btn.innerHTML = `
              <span class="theme-preview">
                <span class="preview-light" style="background:${theme.light};"></span>
                <span class="preview-dark" style="background:${theme.dark};"></span>
              </span>
            `;
            btn.onclick = () => {
              document
                .querySelectorAll(".theme-btn")
                .forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
              window._tempTheme = theme.id;
              showToast(`✅ تم انتخاب شد (برای اعمال ذخیره کن)`);
            };
            container.appendChild(btn);
          });
        }

        function buildPieceButtons() {
          const container = document.getElementById("pieceSetsContainer");
          if (!container) return;
          const currentPieceSet = loadSettings().pieceSet || "neo";
          container.innerHTML = "";
          let totalCount = 0;

          Object.keys(pieceSets).forEach((catName) => {
            const section = document.createElement("div");
            section.className = "piece-section";
            const label = document.createElement("span");
            label.className = "section-label";
            label.textContent = catName;
            section.appendChild(label);

            const grid = document.createElement("div");
            grid.className = "section-grid";

            pieceSets[catName].forEach((setName) => {
              totalCount++;
              const btn = document.createElement("button");
              btn.className = `piece-btn${setName === currentPieceSet ? " active" : ""}`;
              btn.dataset.set = setName;
              const wKPath = `pieces/${setName}/wk.png`;
              const bKPath = `pieces/${setName}/bk.png`;

              btn.innerHTML = `
                <div class="piece-preview">
                  <img src="${wKPath}" alt="شاه سفید" onerror="this.style.display='none';this.parentElement.querySelector('.piece-fallback-w').style.display='flex'">
                  <div class="piece-fallback piece-fallback-w" style="display:none;">♔</div>
                  <img src="${bKPath}" alt="شاه سیاه" onerror="this.style.display='none';this.parentElement.querySelector('.piece-fallback-b').style.display='flex'">
                  <div class="piece-fallback piece-fallback-b" style="display:none;">♚</div>
                </div>
              `;
              btn.onclick = () => {
                document
                  .querySelectorAll(".piece-btn")
                  .forEach((b) => b.classList.remove("active"));
                btn.classList.add("active");
                window._tempPieceSet = setName;
                showToast(`✅ مجموعه مهره انتخاب شد (برای اعمال ذخیره کن)`);
              };
              grid.appendChild(btn);
            });
            section.appendChild(grid);
            container.appendChild(section);
          });
          const countDisplay = document.getElementById("pieceCountDisplay");
          if (countDisplay) countDisplay.textContent = totalCount;
        }

        function saveAllSettings() {
          const settings = loadSettings();
          const newTheme = window._tempTheme || settings.theme || "1";
          const newPieceSet =
            window._tempPieceSet || settings.pieceSet || "neo";
          settings.theme = newTheme;
          settings.pieceSet = newPieceSet;
          saveSettings(settings);

          document.body.className = document.body.className
            .split(" ")
            .filter((cls) => !cls.startsWith("theme-"))
            .join(" ");
          document.body.classList.add(`theme-${newTheme}`);

          document.dispatchEvent(
            new CustomEvent("pieceSetChanged", {
              detail: { pieceSet: newPieceSet },
            }),
          );
          document.dispatchEvent(
            new CustomEvent("themeChanged", { detail: { theme: newTheme } }),
          );
          showToast(`✅ تنظیمات با موفقیت ذخیره شد`);
        }

        function resetToDefault() {
          if (!confirm("آیا مطمئنی؟ تنظیمات به حالت پیش‌فرض برمی‌گردد."))
            return;
          const settings = { pieceSet: "neo", theme: "1" };
          saveSettings(settings);
          document.body.className = document.body.className
            .split(" ")
            .filter((cls) => !cls.startsWith("theme-"))
            .join(" ");
          document.body.classList.add("theme-1");
          window._tempTheme = "1";
          window._tempPieceSet = "neo";
          buildThemeButtons();
          buildPieceButtons();
          document.dispatchEvent(
            new CustomEvent("pieceSetChanged", { detail: { pieceSet: "neo" } }),
          );
          document.dispatchEvent(
            new CustomEvent("themeChanged", { detail: { theme: "1" } }),
          );
          showToast("✅ تنظیمات به حالت پیش‌فرض بازگشت");
        }

        function showToast(text) {
          const toast = document.getElementById("settingsToast");
          if (!toast) return;
          toast.textContent = text;
          toast.classList.add("show");
          clearTimeout(toast._timeout);
          toast._timeout = setTimeout(() => {
            toast.classList.remove("show");
          }, 2500);
        }

        function init() {
          const settings = loadSettings();
          window._tempTheme = settings.theme || "1";
          window._tempPieceSet = settings.pieceSet || "neo";
          buildThemeButtons();
          buildPieceButtons();
          document
            .getElementById("saveSettingsBtn")
            .addEventListener("click", saveAllSettings);
          document
            .getElementById("resetSettingsBtn")
            .addEventListener("click", resetToDefault);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
