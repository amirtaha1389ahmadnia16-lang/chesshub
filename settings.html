<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="تنظیمات ChessHub - انتخاب تم رنگی تخته و مجموعه مهره‌ها"
    />
    <title>ChessHub | تنظیمات</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E2%99%9B%3C/text%3E%3C/svg%3E"
    />
    <link
      href="fonts/vazir/font-face.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="lib/fontawesome/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <!-- بنر اصلی -->
      <section class="app-hero">
        <h1><i class="fas fa-gear"></i> تنظیمات</h1>
        <p>مجموعه مهره‌ها و تم رنگی مورد علاقه خود را انتخاب کن — انتخابت در همه صفحات اعمال می‌شود</p>
      </section>

      <!-- انتخاب تم -->
      <div class="settings-card">
        <div class="card-title"><i class="fas fa-palette"></i> تم رنگی</div>
        <div class="card-sub">۲۹ تم رنگی برای تخته شطرنج</div>
        <div class="theme-grid" id="themeGrid"></div>
      </div>

      <!-- انتخاب مهره‌ها -->
      <div class="settings-card">
        <div class="card-title">
          <i class="fas fa-chess-queen"></i> مجموعه مهره‌ها
        </div>
        <div class="card-sub">
          <span id="pieceCountDisplay">۳۸</span> مجموعه مختلف — کافیست پوشه
          <b>pieces/&lt;نام‌مجموعه&gt;/</b> را با تصاویر خودت بگذاری
        </div>
        <div id="pieceSetsContainer"></div>

        <div class="settings-actions">
          <button class="btn btn-primary" id="saveSettingsBtn">
            <i class="fas fa-floppy-disk"></i> ذخیره تنظیمات
          </button>
          <button class="btn btn-secondary" id="resetSettingsBtn">
            <i class="fas fa-rotate-left"></i> بازنشانی به پیش‌فرض
          </button>
        </div>
      </div>

      <div id="footer-placeholder"></div>
    </div>

    <div class="settings-toast" id="settingsToast"></div>

    <script src="js/script.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
