<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChessHub | ورود و ثبت‌نام</title>
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <div class="auth-wrapper">
        <!-- کارت ورود -->
        <div class="auth-card" id="loginBox">
          <div class="auth-card-header">
            <i class="fas fa-chess-queen"></i>
            <h2>ورود به حساب کاربری</h2>
            <p>خوش اومدی! ادامه بده 🚀</p>
          </div>

          <form class="auth-form" onsubmit="handleLogin(event)">
            <div class="form-group">
              <label>ایمیل یا نام کاربری</label>
              <div class="input-icon">
                <i class="fas fa-user"></i>
                <input
                  type="text"
                  id="loginEmail"
                  placeholder="example@chesshub.com"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label>رمز عبور</label>
              <div class="input-icon">
                <i class="fas fa-lock"></i>
                <input
                  type="password"
                  id="loginPassword"
                  placeholder="رمز عبور خود را وارد کنید"
                  required
                />
                <i
                  class="fas fa-eye toggle-pass"
                  onclick="togglePassword('loginPassword', this)"
                ></i>
              </div>
            </div>

            <div class="auth-options">
              <label class="custom-checkbox">
                <input type="checkbox" />
                <span class="checkmark"></span>
                مرا به خاطر بسپار
              </label>
              <a href="#" class="forgot-link">فراموشی رمز عبور؟</a>
            </div>

            <button type="submit" class="btn-auth-submit">
              <i class="fas fa-sign-in-alt"></i> ورود
            </button>

            <div class="auth-divider"><span>یا</span></div>

            <button type="button" class="btn-auth-google">
              <i class="fab fa-google"></i> ورود سریع با گوگل
            </button>

            <p class="auth-switch">
              حساب کاربری نداری؟
              <a href="#" onclick="switchToRegister(event)">ثبت‌نام کن</a>
            </p>
          </form>
        </div>

        <!-- کارت ثبت‌نام -->
        <div class="auth-card hidden" id="registerBox">
          <div class="auth-card-header">
            <i class="fas fa-chess-knight"></i>
            <h2>ساخت حساب جدید</h2>
            <p>به خانواده بزرگ شطرنج بپیوند 🎉</p>
          </div>

          <form class="auth-form" onsubmit="handleRegister(event)">
            <div class="form-group">
              <label>نام کاربری</label>
              <div class="input-icon">
                <i class="fas fa-user"></i>
                <input
                  type="text"
                  id="registerUsername"
                  placeholder="نام نمایشی شما"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label>ایمیل</label>
              <div class="input-icon">
                <i class="fas fa-envelope"></i>
                <input
                  type="email"
                  id="registerEmail"
                  placeholder="example@chesshub.com"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label>رمز عبور</label>
              <div class="input-icon">
                <i class="fas fa-lock"></i>
                <input
                  type="password"
                  id="registerPassword"
                  placeholder="حداقل ۶ کاراکتر"
                  required
                  minlength="6"
                />
                <i
                  class="fas fa-eye toggle-pass"
                  onclick="togglePassword('registerPassword', this)"
                ></i>
              </div>
            </div>

            <div class="form-group">
              <label>تکرار رمز عبور</label>
              <div class="input-icon">
                <i class="fas fa-shield-alt"></i>
                <input
                  type="password"
                  id="confirmPassword"
                  placeholder="رمز را دوباره وارد کنید"
                  required
                />
              </div>
            </div>

            <button type="submit" class="btn-auth-submit">
              <i class="fas fa-user-plus"></i> ثبت‌نام
            </button>

            <p class="auth-switch">
              قبلاً حساب ساختی؟
              <a href="#" onclick="switchToLogin(event)">ورود کن</a>
            </p>
          </form>
        </div>
      </div>

      <div id="footer-placeholder"></div>
    </div>

    <script src="js/script.js"></script>
    <script>
      // چون سرور و فرانت روی یک دامنه هستند، از آدرس نسبی استفاده می‌کنیم
      const API_URL = "/api/auth";

      function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }

      function switchToRegister(e) {
        e.preventDefault();
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("registerBox").classList.remove("hidden");
      }

      function switchToLogin(e) {
        e.preventDefault();
        document.getElementById("registerBox").classList.add("hidden");
        document.getElementById("loginBox").classList.remove("hidden");
      }

      window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        if (params.get("mode") === "register") {
          switchToRegister(new Event("click"));
        }
      };

      async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        try {
          const res = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json();

          if (res.ok) {
            localStorage.setItem("chesshub_user", JSON.stringify(data));
            alert("ورود موفقیت‌آمیز بود! در حال انتقال...");
            window.location.href = "index.html";
          } else {
            alert(data.message || "خطا در ورود");
          }
        } catch (err) {
          alert("ارتباط با سرور برقرار نشد! مطمئن شو سرور روشن است.");
        }
      }

      async function handleRegister(e) {
        e.preventDefault();
        const username = document.getElementById("registerUsername").value;
        const email = document.getElementById("registerEmail").value;
        const password = document.getElementById("registerPassword").value;
        const confirm = document.getElementById("confirmPassword").value;

        if (password !== confirm) {
          alert("رمز عبور و تکرار آن یکسان نیستند!");
          return;
        }

        try {
          const res = await fetch(`${API_URL}/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email, password }),
          });

          const data = await res.json();

          if (res.ok) {
            localStorage.setItem("chesshub_user", JSON.stringify(data));
            alert("ثبت‌نام موفقیت‌آمیز بود! خوش آمدی.");
            window.location.href = "index.html";
          } else {
            alert(data.message || "خطا در ثبت‌نام");
          }
        } catch (err) {
          alert("ارتباط با سرور برقرار نشد!");
        }
      }
    </script>
  </body>
</html>
