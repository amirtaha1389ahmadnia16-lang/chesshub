<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="دروس آموزشی شطرنج – از مبتدی تا حرفه‌ای"
    />
    <title>ChessHub | دروس آموزشی شطرنج</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* ============================================
         🎯 استایل‌های اختصاصی صفحه دروس
         ============================================ */

      .hero-section {
        padding: 1.8rem 1.5rem !important;
        min-height: 110px !important;
        margin-bottom: 1.5rem !important;
      }

      .hero-section h1 {
        font-size: clamp(1.6rem, 3.5vw, 2.2rem) !important;
      }

      .hero-section p {
        font-size: clamp(0.9rem, 1.4vw, 1rem) !important;
      }

      .lessons-toolbar {
        background: var(--bg-card, #ffffff);
        border-radius: var(--radius-md);
        padding: 0.8rem 1.2rem;
        margin-bottom: 1.5rem;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color, transparent);
        transition:
          background 0.3s ease,
          border-color 0.3s ease;
      }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
      }

      .filter-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .filter-label {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-secondary, #5f7f9e);
        white-space: nowrap;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .chip {
        background: var(--secondary);
        border: none;
        padding: 0.3rem 0.9rem;
        border-radius: 40px;
        font-family: "Vazir";
        font-size: 0.7rem;
        font-weight: 500;
        cursor: pointer;
        transition: 0.2s;
        color: var(--text-dark);
      }

      .chip.active {
        background: var(--primary);
        color: white;
      }

      .chip:hover:not(.active) {
        background: #dde4ec;
      }

      .search-box {
        display: flex;
        align-items: center;
        background: var(--secondary);
        border-radius: 40px;
        padding: 0.1rem 1rem;
        gap: 0.5rem;
        flex: 1;
        min-width: 160px;
        border: 1px solid var(--border-color, transparent);
        transition:
          background 0.3s ease,
          border-color 0.3s ease;
      }

      .search-box i {
        color: #94a3b8;
        font-size: 0.8rem;
      }

      .search-box input {
        width: 100%;
        border: none;
        background: transparent;
        padding: 0.5rem 0;
        font-family: "Vazir";
        font-size: 0.8rem;
        outline: none;
        color: var(--text-dark);
      }

      .search-box input::placeholder {
        color: var(--text-secondary, #94a3b8);
      }

      .lessons-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.2rem;
        margin-bottom: 2rem;
      }

      .lesson-card {
        background: var(--bg-card, #ffffff);
        border-radius: var(--radius-lg);
        overflow: hidden;
        transition: all 0.3s ease;
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border-color, transparent);
        cursor: pointer;
      }

      .lesson-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-lg);
        border-color: var(--primary);
      }

      .lesson-thumb {
        height: 130px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        flex-shrink: 0;
      }

      .lesson-thumb i {
        font-size: 2.8rem;
        color: white;
        background: rgba(0, 0, 0, 0.2);
        width: 65px;
        height: 65px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .lesson-content {
        padding: 1rem 1.2rem 1.2rem;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .lesson-meta {
        display: flex;
        gap: 0.4rem;
        margin-bottom: 0.4rem;
        flex-wrap: wrap;
      }

      .lesson-tag {
        padding: 0.15rem 0.7rem;
        border-radius: 30px;
        font-size: 0.65rem;
        font-weight: bold;
        color: white;
      }

      .lesson-tag.tag-opening {
        background: #10b981;
      }
      .lesson-tag.tag-middlegame {
        background: #3b82f6;
      }
      .lesson-tag.tag-endgame {
        background: #8b5cf6;
      }

      .lesson-level {
        background: var(--secondary);
        padding: 0.15rem 0.7rem;
        border-radius: 30px;
        font-size: 0.6rem;
        color: var(--text-secondary);
      }

      .lesson-title {
        font-size: 1rem;
        font-weight: 800;
        color: var(--text-dark);
        margin-bottom: 0.3rem;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .lesson-description {
        font-size: 0.78rem;
        color: var(--text-secondary);
        line-height: 1.5;
        margin-bottom: 0.6rem;
        flex: 1;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .lesson-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
        border-top: 1px solid var(--border-color, #eef2f5);
        padding-top: 0.5rem;
      }

      .lesson-duration {
        font-size: 0.65rem;
        color: var(--text-secondary);
        direction: ltr;
      }

      .lesson-footer .btn-view {
        background: var(--primary);
        color: white;
        border: none;
        padding: 0.2rem 1rem;
        border-radius: 30px;
        font-size: 0.65rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        font-family: "Vazir";
      }

      .lesson-footer .btn-view:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
      }

      .no-result {
        text-align: center;
        padding: 2.5rem;
        color: var(--text-secondary, #5f7f9e);
        font-size: 0.9rem;
        grid-column: 1 / -1;
      }

      /* ============================================
         📂 Overlay تمام‌صفحه (عرض محتوا ۷۰۰px)
         ============================================ */
      .page-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(8px);
        z-index: 1000;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 1rem;
        transform: translateX(100%);
        transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        direction: rtl;
      }

      .page-overlay.open {
        transform: translateX(0);
      }

      .overlay-inner {
        max-width: 700px;
        margin: 0 auto;
        width: 100%;
      }

      .overlay-header {
        position: sticky;
        top: 0;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 0.6rem 1.2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        margin-bottom: 1rem;
        border-radius: 16px 16px 0 0;
      }

      .overlay-header h2 {
        font-size: 1.1rem;
        color: var(--primary);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0;
      }

      .overlay-header h2 i {
        color: #ffb347;
      }

      .overlay-header .close-btn {
        background: var(--secondary);
        border: none;
        padding: 0.3rem 1rem;
        border-radius: 40px;
        font-family: "Vazir";
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        font-size: 0.8rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--text-dark);
      }

      .overlay-header .close-btn:hover {
        background: #e25555;
        color: white;
        transform: scale(0.96);
      }

      .lesson-viewer {
        background: var(--bg-card, #ffffff);
        border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        padding: 1.8rem 2rem 2rem;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border-color, transparent);
        animation: fadeSlideIn 0.3s ease;
        width: 100%;
        margin: 0 auto;
      }

      @keyframes fadeSlideIn {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .lesson-viewer h3 {
        font-size: 1.6rem;
        color: var(--primary);
        border-right: 5px solid var(--primary);
        padding-right: 14px;
        margin-bottom: 0.8rem;
      }

      .lesson-viewer .tag {
        display: inline-block;
        padding: 0.2rem 1rem;
        border-radius: 40px;
        font-size: 0.75rem;
        font-weight: bold;
        color: white;
        margin-bottom: 1rem;
      }

      .lesson-viewer p,
      .lesson-viewer li {
        color: var(--text-primary);
        line-height: 1.8;
        font-size: 0.95rem;
      }

      .lesson-viewer h4 {
        color: var(--primary-dark);
        margin: 1.2rem 0 0.5rem;
        font-size: 1.15rem;
        border-right: 4px solid var(--primary);
        padding-right: 10px;
      }

      .lesson-viewer ul,
      .lesson-viewer ol {
        padding-right: 1.5rem;
        margin-bottom: 0.8rem;
      }

      .lesson-viewer li {
        margin-bottom: 0.3rem;
      }

      .lesson-viewer code {
        font-family: "Courier New", monospace;
        background: #f1f5f9;
        padding: 0.1rem 0.4rem;
        border-radius: 6px;
        font-size: 0.85rem;
        color: #d63384;
        direction: ltr;
        display: inline-block;
      }

      .lesson-viewer blockquote {
        background: #f1f5f9;
        border-right: 4px solid var(--primary);
        padding: 0.6rem 1.2rem;
        margin: 0.8rem 0;
        border-radius: 8px;
        color: var(--text-secondary);
        font-style: italic;
      }

      .lesson-viewer table {
        width: 100%;
        border-collapse: collapse;
        margin: 0.8rem 0;
        font-size: 0.85rem;
        border-radius: 12px;
        overflow: hidden;
      }

      .lesson-viewer th,
      .lesson-viewer td {
        border: 1px solid var(--border-color, #e2e8f0);
        padding: 0.4rem 0.8rem;
        text-align: center;
      }

      .lesson-viewer th {
        background: var(--primary);
        color: white;
        font-weight: 700;
      }

      .lesson-viewer td {
        background: var(--bg-card);
        color: var(--text-primary);
      }

      .lesson-viewer tr:nth-child(even) td {
        background: var(--secondary);
      }

      .lesson-viewer hr {
        border: none;
        border-top: 1px solid var(--border-color, #e2e8f0);
        margin: 0.8rem 0;
      }

      .lesson-viewer .close-modal-btn {
        background: #e25555;
        color: white;
        border: none;
        padding: 0.4rem 1.5rem;
        border-radius: 60px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 1.2rem;
        font-size: 0.85rem;
        transition: 0.2s;
        display: block;
        width: fit-content;
        font-family: "Vazir";
      }

      .lesson-viewer .close-modal-btn:hover {
        background: #c03939;
        transform: translateY(-2px);
      }

      /* ============================================
         📱 واکنش‌گرایی
         ============================================ */
      @media (max-width: 768px) {
        .hero-section {
          padding: 1.2rem 1rem !important;
          min-height: 80px !important;
        }

        .hero-section h1 {
          font-size: 1.4rem !important;
        }

        .lessons-toolbar {
          padding: 0.6rem 0.8rem;
        }

        .filter-row {
          flex-direction: column;
          align-items: stretch;
          gap: 0.6rem;
        }

        .search-box {
          min-width: unset;
        }

        .page-overlay {
          padding: 0.5rem;
        }

        .overlay-header {
          padding: 0.5rem 0.8rem;
        }

        .overlay-header h2 {
          font-size: 0.95rem;
        }

        .overlay-header .close-btn {
          font-size: 0.7rem;
          padding: 0.25rem 0.7rem;
        }

        .lesson-viewer {
          padding: 1.2rem;
        }

        .lesson-viewer h3 {
          font-size: 1.3rem;
        }

        .lesson-viewer p,
        .lesson-viewer li {
          font-size: 0.85rem;
        }

        .lesson-viewer table {
          font-size: 0.75rem;
        }

        .lesson-viewer th,
        .lesson-viewer td {
          padding: 0.3rem 0.5rem;
        }

        .lessons-grid {
          grid-template-columns: 1fr 1fr;
          gap: 0.8rem;
        }

        .lesson-thumb {
          height: 100px;
        }

        .lesson-thumb i {
          font-size: 2.2rem;
          width: 50px;
          height: 50px;
        }

        .lesson-title {
          font-size: 0.9rem;
        }

        .lesson-description {
          font-size: 0.7rem;
        }
      }

      @media (max-width: 480px) {
        .hero-section {
          padding: 0.8rem 0.6rem !important;
          min-height: 60px !important;
        }

        .hero-section h1 {
          font-size: 1.1rem !important;
        }

        .hero-section p {
          font-size: 0.7rem !important;
        }

        .page-overlay {
          padding: 0.3rem;
        }

        .overlay-header {
          padding: 0.4rem 0.6rem;
        }

        .overlay-header h2 {
          font-size: 0.8rem;
        }

        .overlay-header .close-btn {
          font-size: 0.6rem;
          padding: 0.2rem 0.5rem;
        }

        .lesson-viewer {
          padding: 0.8rem;
          border-radius: 0 0 16px 16px;
        }

        .lesson-viewer h3 {
          font-size: 1.1rem;
        }

        .lesson-viewer p,
        .lesson-viewer li {
          font-size: 0.8rem;
        }

        .lesson-viewer table {
          font-size: 0.65rem;
        }

        .lesson-viewer th,
        .lesson-viewer td {
          padding: 0.2rem 0.3rem;
        }

        .lessons-grid {
          grid-template-columns: 1fr;
        }

        .chip {
          font-size: 0.6rem;
          padding: 0.2rem 0.6rem;
        }

        .filter-label {
          font-size: 0.65rem;
        }

        .lesson-thumb {
          height: 80px;
        }

        .lesson-thumb i {
          font-size: 1.8rem;
          width: 42px;
          height: 42px;
        }

        .lesson-title {
          font-size: 0.85rem;
        }

        .lesson-content {
          padding: 0.6rem 0.8rem 0.8rem;
        }
      }

      @media (max-width: 360px) {
        .lessons-grid {
          gap: 0.6rem;
        }

        .lesson-thumb {
          height: 70px;
        }

        .lesson-thumb i {
          font-size: 1.5rem;
          width: 36px;
          height: 36px;
        }

        .lesson-title {
          font-size: 0.75rem;
        }

        .chip {
          font-size: 0.5rem;
          padding: 0.15rem 0.4rem;
        }

        .search-box input {
          font-size: 0.65rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <section class="hero-section">
        <h1>
          <span class="highlight"><i class="fas fa-graduation-cap"></i></span>
          <span class="highlight">دروس</span> آموزشی شطرنج
        </h1>
        <p>از مبتدی تا حرفه‌ای، هر آنچه برای پیشرفت نیاز داری اینجاست</p>
      </section>

      <div class="lessons-toolbar">
        <div class="filter-row">
          <div class="filter-group">
            <span class="filter-label">دسته:</span>
            <div class="chips" id="categoryFilters">
              <button class="chip active" data-cat="all">همه</button>
              <button class="chip" data-cat="شروع بازی">شروع بازی</button>
              <button class="chip" data-cat="وسط بازی">وسط بازی</button>
              <button class="chip" data-cat="آخر بازی">آخر بازی</button>
            </div>
          </div>
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input
              type="text"
              id="searchLessonInput"
              placeholder="جستجوی درس..."
            />
          </div>
        </div>
      </div>

      <div id="lessonsGridContainer" class="lessons-grid"></div>

      <div id="footer-placeholder"></div>
    </div>

    <!-- Overlay -->
    <div class="page-overlay" id="lessonOverlay">
      <div class="overlay-inner">
        <div class="overlay-header">
          <h2>
            <i class="fas fa-graduation-cap"></i>
            <span id="overlayTitle">درس</span>
          </h2>
          <button class="close-btn" id="closeOverlay">
            <i class="fas fa-times"></i> بستن
          </button>
        </div>
        <div id="lessonViewerContainer" class="lesson-viewer"></div>
      </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/lessons-data.js"></script>
    <script>
      (function () {
        "use strict";

        (function applySavedTheme() {
          try {
            const settings = JSON.parse(
              localStorage.getItem("chesshub_settings"),
            );
            if (settings && settings.theme) {
              document.body.className = document.body.className
                .split(" ")
                .filter((cls) => !cls.startsWith("theme-"))
                .join(" ");
              document.body.classList.add(`theme-${settings.theme}`);
            }
          } catch (e) {}
        })();

        let currentCategory = "all";
        let searchText = "";

        const gridContainer = document.getElementById("lessonsGridContainer");
        const overlay = document.getElementById("lessonOverlay");
        const overlayTitle = document.getElementById("overlayTitle");
        const viewerContainer = document.getElementById(
          "lessonViewerContainer",
        );
        const closeBtn = document.getElementById("closeOverlay");

        const categoryColors = {
          "شروع بازی": "#10b981",
          "وسط بازی": "#3b82f6",
          "آخر بازی": "#8b5cf6",
        };

        const categoryClasses = {
          "شروع بازی": "tag-opening",
          "وسط بازی": "tag-middlegame",
          "آخر بازی": "tag-endgame",
        };

        function openLesson(lesson) {
          if (!lesson) return;
          overlayTitle.textContent = lesson.title;
          const color = categoryColors[lesson.category] || "#2c7da0";

          viewerContainer.innerHTML = `
            <h3>${lesson.title}</h3>
            <div class="tag" style="background:${color}">${lesson.category} – ${lesson.level}</div>
            ${lesson.content}
            <button class="close-modal-btn" id="closeLessonBtn">✖ بستن</button>
          `;

          overlay.classList.add("open");
          document.body.style.overflow = "hidden";

          document
            .getElementById("closeLessonBtn")
            .addEventListener("click", closeLessonOverlay);
        }

        function closeLessonOverlay() {
          overlay.classList.remove("open");
          document.body.style.overflow = "";
        }

        function renderLessons() {
          const lessonsData = window.lessons || [];
          let filtered = lessonsData.filter((l) => {
            if (currentCategory !== "all" && l.category !== currentCategory)
              return false;
            if (
              searchText &&
              !l.title.includes(searchText) &&
              !l.description.includes(searchText)
            )
              return false;
            return true;
          });

          if (filtered.length === 0) {
            gridContainer.innerHTML = `<div class="no-result">درسی با این مشخصات پیدا نشد.</div>`;
            return;
          }

          gridContainer.innerHTML = "";

          filtered.forEach((lesson) => {
            const color = categoryColors[lesson.category] || "#2c7da0";
            const cls = categoryClasses[lesson.category] || "";

            const card = document.createElement("div");
            card.className = "lesson-card";
            card.innerHTML = `
              <div class="lesson-thumb" style="background:linear-gradient(135deg, ${color}, ${color}cc)">
                <i class="${lesson.thumbIcon}"></i>
              </div>
              <div class="lesson-content">
                <div class="lesson-meta">
                  <span class="lesson-tag ${cls}">${lesson.category}</span>
                  <span class="lesson-level">${lesson.level}</span>
                </div>
                <div class="lesson-title">${lesson.title}</div>
                <p class="lesson-description">${lesson.description}</p>
                <div class="lesson-footer">
                  <span class="lesson-duration"><i class="far fa-clock"></i> ${lesson.duration}</span>
                  <button class="btn-view" data-id="${lesson.id}">مشاهده</button>
                </div>
              </div>
            `;
            gridContainer.appendChild(card);
          });

          document.querySelectorAll(".btn-view").forEach((btn) => {
            btn.addEventListener("click", function (e) {
              e.stopPropagation();
              const lesson = window.lessons.find(
                (l) => l.id == this.dataset.id,
              );
              if (lesson) openLesson(lesson);
            });
          });

          document.querySelectorAll(".lesson-card").forEach((card) => {
            card.addEventListener("click", function () {
              const btn = this.querySelector(".btn-view");
              if (btn) btn.click();
            });
          });
        }

        function setupFilters() {
          const setActive = (container, activeBtn) => {
            container
              .querySelectorAll(".chip")
              .forEach((b) => b.classList.remove("active"));
            activeBtn.classList.add("active");
          };

          document.querySelectorAll("#categoryFilters .chip").forEach((btn) => {
            btn.addEventListener("click", function () {
              setActive(document.getElementById("categoryFilters"), this);
              currentCategory = this.dataset.cat;
              renderLessons();
            });
          });

          document
            .getElementById("searchLessonInput")
            .addEventListener("input", (e) => {
              searchText = e.target.value.trim();
              renderLessons();
            });
        }

        closeBtn.addEventListener("click", closeLessonOverlay);

        overlay.addEventListener("click", function (e) {
          if (e.target === this) closeLessonOverlay();
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") closeLessonOverlay();
        });

        function init() {
          renderLessons();
          setupFilters();
          console.log("✅ ChessHub Lessons loaded successfully");
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
