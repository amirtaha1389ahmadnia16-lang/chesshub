<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="دروس آموزشی شطرنج" />
    <title>ChessHub | دروس آموزشی</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/lessons.css" />
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <section class="app-hero">
        <h1><i class="fas fa-graduation-cap"></i> دروس آموزشی</h1>
        <p>یادگیری اصول طلایی شطرنج از شروع تا پایان بازی</p>
      </section>

      <div class="lessons-toolbar">
        <div class="filter-row">
          <div class="filter-group">
            <span class="filter-label">دسته‌بندی:</span>
            <div class="chips" id="categoryFilters">
              <button class="chip active" data-cat="all">همه</button>
              <button class="chip" data-cat="شروع بازی">شروع بازی</button>
              <button class="chip" data-cat="وسط بازی">وسط بازی</button>
              <button class="chip" data-cat="آخر بازی">آخر بازی</button>
            </div>
          </div>
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input
              type="text"
              id="searchLessonInput"
              placeholder="جستجو در دروس..."
            />
          </div>
        </div>
      </div>

      <div class="lessons-grid" id="lessonsGridContainer"></div>

      <div id="footer-placeholder"></div>
    </div>

    <div class="page-overlay" id="lessonOverlay">
      <div class="overlay-header">
        <h2 id="overlayTitle">
          <i class="fas fa-graduation-cap"></i> عنوان درس
        </h2>
        <button class="close-btn" id="closeOverlay">
          <i class="fas fa-times"></i> بستن
        </button>
      </div>
      <div class="overlay-scroll">
        <div class="lesson-viewer" id="lessonViewerContainer"></div>
      </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/lessons-data.js"></script>
    <script src="js/lessons.js"></script>
  </body>
</html>
