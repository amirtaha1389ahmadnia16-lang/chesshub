<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="دروس آموزشی شطرنج – از مبتدی تا حرفه‌ای با دسته‌بندی گشایش، وسط بازی، آخر بازی، تاکتیک، حمله، دفاع و استراتژی"
    />
    <title>ChessHub | دروس آموزشی شطرنج</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* ============================================
         🎯 استایل‌های اختصاصی صفحه دروس
         ============================================ */

      /* ----- بخش معرفی (Hero) ----- */
      .lessons-hero {
        background: linear-gradient(
          135deg,
          #0f2b3f 0%,
          #1a4b6e 60%,
          #2a7f9c 100%
        );
        border-radius: var(--radius-lg);
        padding: 2.2rem 1.5rem;
        margin-bottom: 2rem;
        text-align: center;
        color: #fff;
        position: relative;
        overflow: hidden;
      }

      .lessons-hero::before {
        content: "\265A";
        position: absolute;
        font-size: 130px;
        right: -20px;
        bottom: -40px;
        opacity: 0.06;
        font-family: "Vazir", serif;
      }

      .lessons-hero::after {
        content: "\265B";
        position: absolute;
        font-size: 100px;
        left: -20px;
        top: -30px;
        opacity: 0.06;
        font-family: "Vazir", serif;
      }

      .lessons-hero h1 {
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        font-weight: 900;
        position: relative;
        z-index: 1;
      }

      .lessons-hero h1 i {
        color: #ffb347;
      }

      .lessons-hero p {
        opacity: 0.9;
        font-size: 1rem;
        max-width: 650px;
        margin: 0.5rem auto 0;
        position: relative;
        z-index: 1;
      }

      /* ----- نوار ابزار (با پشتیبانی از تم) ----- */
      .lessons-toolbar {
        background: var(--bg-card, #ffffff);
        border-radius: var(--radius-md);
        padding: 1rem 1.2rem;
        margin-bottom: 2rem;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color, transparent);
        transition:
          background 0.3s ease,
          border-color 0.3s ease;
      }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 1.2rem;
        align-items: center;
      }

      .filter-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .filter-label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-secondary, #5f7f9e);
        white-space: nowrap;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .chip {
        background: var(--secondary);
        border: none;
        padding: 0.35rem 1rem;
        border-radius: 40px;
        font-family: "Vazir";
        font-size: 0.75rem;
        font-weight: 500;
        cursor: pointer;
        transition: 0.2s;
        color: var(--text-dark);
      }

      .chip.active {
        background: var(--primary);
        color: white;
      }

      .chip:hover:not(.active) {
        background: #dde4ec;
      }

      .search-box {
        display: flex;
        align-items: center;
        background: var(--secondary);
        border-radius: 40px;
        padding: 0.2rem 1rem;
        gap: 0.5rem;
        flex: 1;
        min-width: 180px;
        border: 1px solid var(--border-color, transparent);
        transition:
          background 0.3s ease,
          border-color 0.3s ease;
      }

      .search-box i {
        color: #94a3b8;
        font-size: 0.9rem;
      }

      .search-box input {
        width: 100%;
        border: none;
        background: transparent;
        padding: 0.6rem 0;
        font-family: "Vazir";
        font-size: 0.85rem;
        outline: none;
        color: var(--text-dark);
      }

      .search-box input::placeholder {
        color: var(--text-secondary, #94a3b8);
      }

      /* ----- گرید درس‌ها ----- */
      .lessons-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
      }

      /* ----- کارت درس (با پشتیبانی از تم) ----- */
      .lesson-card {
        background: var(--bg-card, #ffffff);
        border-radius: var(--radius-lg);
        overflow: hidden;
        transition: all 0.3s ease;
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border-color, transparent);
      }

      .lesson-card:hover {
        transform: translateY(-6px);
        box-shadow: var(--shadow-lg);
      }

      .lesson-thumb {
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
      }

      .lesson-thumb i {
        font-size: 3rem;
        color: white;
        background: rgba(0, 0, 0, 0.25);
        width: 75px;
        height: 75px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .lesson-content {
        padding: 1.2rem 1.4rem 1.4rem;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .lesson-meta {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.6rem;
        flex-wrap: wrap;
      }

      .lesson-tag {
        background: var(--secondary);
        padding: 0.2rem 0.8rem;
        border-radius: 30px;
        font-size: 0.7rem;
        font-weight: bold;
        color: var(--primary);
      }

      .lesson-level {
        background: var(--secondary);
        padding: 0.2rem 0.8rem;
        border-radius: 30px;
        font-size: 0.65rem;
        color: var(--text-secondary);
      }

      .lesson-title {
        font-size: 1.15rem;
        font-weight: 800;
        color: var(--text-dark);
        margin-bottom: 0.5rem;
      }

      .lesson-description {
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.5;
        margin-bottom: 1rem;
        flex: 1;
      }

      .lesson-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
      }

      .lesson-duration {
        font-size: 0.7rem;
        color: var(--text-secondary);
        direction: ltr;
      }

      .btn-outline {
        background: transparent;
        border: 1.5px solid var(--primary);
        color: var(--primary);
        padding: 0.3rem 1rem;
        border-radius: 40px;
        font-size: 0.75rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        font-family: "Vazir";
      }

      .btn-outline:hover {
        background: var(--primary);
        color: #fff;
        transform: translateY(-2px);
      }

      /* ----- مودال (با پشتیبانی از تم) ----- */
      .lesson-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(12px);
        z-index: 1200;
        display: flex;
        align-items: center;
        justify-content: center;
        visibility: hidden;
        opacity: 0;
        transition: all 0.3s ease;
      }

      .lesson-modal.active {
        visibility: visible;
        opacity: 1;
      }

      .modal-container {
        background: var(--bg-card, #ffffff);
        border-radius: var(--radius-lg);
        max-width: 850px;
        width: 92%;
        max-height: 85vh;
        overflow-y: auto;
        direction: rtl;
        padding: 2rem;
        box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
        position: relative;
      }

      .modal-container::-webkit-scrollbar {
        width: 6px;
      }

      .modal-container::-webkit-scrollbar-track {
        background: var(--secondary);
        border-radius: 10px;
        margin-block: 8px;
      }

      .modal-container::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 10px;
      }

      .modal-container h3 {
        font-size: 1.6rem;
        color: var(--primary);
        border-right: 5px solid var(--primary);
        padding-right: 14px;
        margin-bottom: 0.8rem;
      }

      .modal-container .tag {
        background: var(--secondary);
        display: inline-block;
        padding: 0.3rem 1rem;
        border-radius: 40px;
        font-size: 0.75rem;
        color: var(--primary);
        font-weight: bold;
        margin-bottom: 1.2rem;
      }

      .modal-container p,
      .modal-container li {
        color: var(--text-primary);
        line-height: 1.8;
        font-size: 0.95rem;
      }

      .modal-container h4 {
        color: var(--primary-dark);
        margin: 1.5rem 0 0.6rem;
        font-size: 1.2rem;
        border-right: 4px solid var(--primary);
        padding-right: 10px;
      }

      .modal-container ul,
      .modal-container ol {
        padding-right: 1.5rem;
        margin-bottom: 0.8rem;
      }

      .modal-container li {
        margin-bottom: 0.3rem;
      }

      .modal-container code {
        font-family: monospace;
        background: var(--secondary);
        padding: 0.1rem 0.4rem;
        border-radius: 6px;
        font-size: 0.85rem;
        color: var(--primary);
        direction: ltr;
      }

      .modal-container blockquote {
        background: var(--secondary);
        border-right: 4px solid var(--primary);
        padding: 0.8rem 1.2rem;
        margin: 1rem 0;
        border-radius: 8px;
        color: var(--text-secondary);
      }

      .modal-container table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
        font-size: 0.85rem;
      }

      .modal-container th,
      .modal-container td {
        border: 1px solid var(--border-color, #e2e8f0);
        padding: 0.5rem 0.8rem;
        text-align: center;
      }

      .modal-container th {
        background: var(--primary);
        color: white;
      }

      .modal-container td {
        background: var(--bg-card);
        color: var(--text-primary);
      }

      .modal-container hr {
        border: none;
        border-top: 1px solid var(--border-color, #e2e8f0);
        margin: 1rem 0;
      }

      .close-modal {
        background: #e25555;
        color: white;
        border: none;
        padding: 0.6rem 1.8rem;
        border-radius: 60px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 1.5rem;
        font-size: 0.9rem;
        transition: 0.2s;
        display: block;
        width: fit-content;
        font-family: "Vazir";
      }

      .close-modal:hover {
        background: #c03939;
        transform: translateY(-2px);
      }

      /* ============================================
         📱 واکنش‌گرایی
         ============================================ */
      @media (max-width: 768px) {
        .lessons-hero {
          padding: 1.8rem 1.2rem;
        }

        .lessons-hero h1 {
          font-size: 1.8rem;
        }

        .lessons-toolbar {
          padding: 0.8rem 1rem;
        }

        .filter-row {
          flex-direction: column;
          align-items: stretch;
          gap: 0.8rem;
        }

        .filter-group {
          flex-wrap: wrap;
        }

        .search-box {
          min-width: unset;
        }
      }

      @media (max-width: 640px) {
        .lessons-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 480px) {
        .lessons-hero {
          padding: 1.2rem 1rem;
        }

        .lessons-hero h1 {
          font-size: 1.4rem;
        }

        .lessons-hero p {
          font-size: 0.85rem;
        }

        .lesson-thumb {
          height: 120px;
        }

        .lesson-thumb i {
          font-size: 2.5rem;
          width: 60px;
          height: 60px;
        }

        .lesson-title {
          font-size: 1rem;
        }

        .modal-container {
          padding: 1.2rem;
          width: 95%;
        }

        .modal-container h3 {
          font-size: 1.3rem;
        }

        .modal-container p,
        .modal-container li {
          font-size: 0.85rem;
        }

        .modal-container h4 {
          font-size: 1rem;
        }

        .close-modal {
          font-size: 0.8rem;
          padding: 0.5rem 1.2rem;
        }

        .chip {
          font-size: 0.65rem;
          padding: 0.25rem 0.7rem;
        }

        .filter-label {
          font-size: 0.7rem;
        }
      }

      @media (max-width: 360px) {
        .lessons-grid {
          gap: 1rem;
        }

        .lesson-card {
          border-radius: 16px;
        }

        .lesson-content {
          padding: 0.8rem 1rem 1rem;
        }

        .lesson-title {
          font-size: 0.9rem;
        }

        .lesson-description {
          font-size: 0.75rem;
        }

        .btn-outline {
          font-size: 0.65rem;
          padding: 0.2rem 0.7rem;
        }

        .chip {
          font-size: 0.55rem;
          padding: 0.2rem 0.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- هدر -->
      <div id="header-placeholder"></div>

      <!-- بخش معرفی (Hero) -->
      <div class="lessons-hero">
        <h1><i class="fas fa-graduation-cap"></i> دروس آموزشی شطرنج</h1>
        <p>از اصول گشایش تا آخر بازی‌های پیچیده – دسته‌بندی در ۷ بخش و ۳ سطح</p>
      </div>

      <!-- نوار ابزار -->
      <div class="lessons-toolbar">
        <div class="filter-row">
          <div class="filter-group">
            <span class="filter-label">دسته:</span>
            <div class="chips" id="categoryFilters">
              <button class="chip active" data-cat="all">همه</button>
              <button class="chip" data-cat="گشایش">گشایش</button>
              <button class="chip" data-cat="وسط بازی">وسط بازی</button>
              <button class="chip" data-cat="آخر بازی">آخر بازی</button>
              <button class="chip" data-cat="تاکتیک">تاکتیک</button>
              <button class="chip" data-cat="حمله">حمله</button>
              <button class="chip" data-cat="دفاع">دفاع</button>
              <button class="chip" data-cat="استراتژی">استراتژی</button>
            </div>
          </div>
          <div class="filter-group">
            <span class="filter-label">سطح:</span>
            <div class="chips" id="levelFilters">
              <button class="chip active" data-level="all">همه</button>
              <button class="chip" data-level="مبتدی">مبتدی</button>
              <button class="chip" data-level="متوسط">متوسط</button>
              <button class="chip" data-level="حرفه‌ای">حرفه‌ای</button>
            </div>
          </div>
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input
              type="text"
              id="searchLessonInput"
              placeholder="جستجوی درس..."
            />
          </div>
        </div>
      </div>

      <!-- گرید درس‌ها -->
      <div id="lessonsGridContainer" class="lessons-grid"></div>

      <!-- فوتر -->
      <div id="footer-placeholder"></div>
    </div>

    <!-- مودال -->
    <div id="lessonModal" class="lesson-modal">
      <div class="modal-container">
        <div id="modalContent"></div>
        <button class="close-modal" id="closeModalBtn">✖ بستن</button>
      </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/lessons-data.js"></script>
    <script>
      (function () {
        "use strict";

        // ============================================
        // 🎨 اعمال تم ذخیره‌شده
        // ============================================
        (function applySavedTheme() {
          try {
            const settings = JSON.parse(
              localStorage.getItem("chesshub_settings"),
            );
            if (settings && settings.theme) {
              document.body.className = document.body.className
                .split(" ")
                .filter((cls) => !cls.startsWith("theme-"))
                .join(" ");
              document.body.classList.add(`theme-${settings.theme}`);
            }
          } catch (e) {}
        })();

        // ============================================
        // 📚 متغیرهای فیلتر
        // ============================================
        let currentCategory = "all";
        let currentLevel = "all";
        let searchText = "";

        // ============================================
        // 🎨 رندر درس‌ها
        // ============================================
        function renderLessons() {
          const container = document.getElementById("lessonsGridContainer");
          if (!container) return;

          const lessonsData = window.lessons || [];
          let filtered = lessonsData.filter((l) => {
            if (currentCategory !== "all" && l.category !== currentCategory)
              return false;
            if (currentLevel !== "all" && l.level !== currentLevel)
              return false;
            if (
              searchText &&
              !l.title.includes(searchText) &&
              !l.description.includes(searchText)
            )
              return false;
            return true;
          });

          if (filtered.length === 0) {
            container.innerHTML = `
              <div style="text-align:center;padding:3rem;color:var(--text-secondary, #5f7f9e);">
                درسی با این مشخصات پیدا نشد.
              </div>
            `;
            return;
          }

          container.innerHTML = "";
          filtered.forEach((l) => {
            const card = document.createElement("div");
            card.className = "lesson-card";
            card.innerHTML = `
              <div class="lesson-thumb" style="background:linear-gradient(135deg, ${l.color}, ${l.color}cc)">
                <i class="${l.thumbIcon}"></i>
              </div>
              <div class="lesson-content">
                <div class="lesson-meta">
                  <span class="lesson-tag">${l.category}</span>
                  <span class="lesson-level">${l.level}</span>
                </div>
                <div class="lesson-title">${l.title}</div>
                <p class="lesson-description">${l.description}</p>
                <div class="lesson-footer">
                  <span class="lesson-duration"><i class="far fa-clock"></i> ${l.duration}</span>
                  <button class="btn-outline" data-id="${l.id}">مشاهده <i class="fas fa-arrow-left"></i></button>
                </div>
              </div>
            `;
            container.appendChild(card);
          });

          // رویداد دکمه‌های مشاهده
          document.querySelectorAll(".btn-outline").forEach((btn) => {
            btn.onclick = () => {
              const lesson = window.lessons.find((l) => l.id == btn.dataset.id);
              if (lesson) showLessonModal(lesson);
            };
          });
        }

        // ============================================
        // 📖 نمایش مودال
        // ============================================
        function showLessonModal(lesson) {
          const modal = document.getElementById("lessonModal");
          const content = document.getElementById("modalContent");

          // اعمال تم به مودال
          const themeClass = document.body.className
            .split(" ")
            .find((cls) => cls.startsWith("theme-"));
          if (themeClass) {
            modal.querySelector(".modal-container").className =
              "modal-container " + themeClass;
          }

          content.innerHTML = `
            <h3>${lesson.title}</h3>
            <div class="tag">${lesson.category} – ${lesson.level}</div>
            ${lesson.content}
          `;

          modal.classList.add("active");
          document.body.style.overflow = "hidden";
        }

        function closeModal() {
          document.getElementById("lessonModal").classList.remove("active");
          document.body.style.overflow = "";
        }

        // ============================================
        // 🎛️ تنظیم فیلترها
        // ============================================
        function setupFilters() {
          const setActive = (container, activeBtn) => {
            container
              .querySelectorAll(".chip")
              .forEach((b) => b.classList.remove("active"));
            activeBtn.classList.add("active");
          };

          // فیلتر دسته
          document.querySelectorAll("#categoryFilters .chip").forEach((btn) => {
            btn.onclick = () => {
              setActive(document.getElementById("categoryFilters"), btn);
              currentCategory = btn.dataset.cat;
              renderLessons();
            };
          });

          // فیلتر سطح
          document.querySelectorAll("#levelFilters .chip").forEach((btn) => {
            btn.onclick = () => {
              setActive(document.getElementById("levelFilters"), btn);
              currentLevel = btn.dataset.level;
              renderLessons();
            };
          });

          // جستجو
          document
            .getElementById("searchLessonInput")
            .addEventListener("input", (e) => {
              searchText = e.target.value.trim();
              renderLessons();
            });
        }

        // ============================================
        // 🚀 راه‌اندازی
        // ============================================
        function init() {
          renderLessons();
          setupFilters();

          // بستن مودال با کلیک روی پس‌زمینه
          document
            .getElementById("lessonModal")
            .addEventListener("click", (e) => {
              if (e.target === e.currentTarget) closeModal();
            });

          // دکمه بستن
          document
            .getElementById("closeModalBtn")
            .addEventListener("click", closeModal);

          // بستن با دکمه ESC
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeModal();
          });

          console.log("✅ ChessHub Lessons loaded successfully");
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
