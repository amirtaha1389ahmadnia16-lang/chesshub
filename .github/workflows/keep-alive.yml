# ♛ ChessHub — بیداربان (Keep Alive)
# ------------------------------------------------------------
# هدف: سرور Render «به خواب نرود» و داده‌ها هیچ وقت قفل نشوند.
#
# Render نسخه‌ی رایگان بعد از ۱۵ دقیقه بی‌کاری، سرویس را می‌خواباند؛
# این اکشن هر ۱۰ دقیقه یک درخواست به /api/health می‌زند تا سرویس
# همیشه روشن و پاسخ‌گو بماند — بدون هیچ وابستگی و بدون هزینه.
#
# نکته‌ها:
#  • ریپو عمومی است → اکشن‌های زمان‌بندی‌شده رایگان و نامحدودند
#  • بعد از ۶۰ روز بی‌کاری، گیت‌هاب اکشن‌های زمان‌بندی‌شده را غیرفعال
#    می‌کند — ولی کامیت‌های خودکار همگام‌سازی داده ریپو را فعال نگه
#    می‌دارند، پس این اتفاق نمی‌افتد
#  • اگر خواستی مطمئن‌تر باشی، در UptimeRobot هم یک مانیتور با آدرس
#    https://chesshub-online.onrender.com/api/health هر ۵ دقیقه بساز
# ------------------------------------------------------------
name: Keep Alive

on:
  schedule:
    # هر ۱۰ دقیقه — سقف مجاز گیت‌هاب ۵ دقیقه است؛ ۱۰ دقیقه امن‌تر و کافی است
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# اجرای هم‌زمان دو عدد لازم نیست؛ اجرای تازه جایگزین اجرای معطل می‌شود
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🩺 پینگ سلامت سرور ChessHub
        run: |
          URL="https://chesshub-online.onrender.com/api/health"
          for i in 1 2 3; do
            echo "تلاش $i از ۳ …"
            CODE=$(curl -s -o health.json -w "%{http_code}" --max-time 55 "$URL" || echo "000")
            echo "کد پاسخ: $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ سرور بیدار و سالم است"
              cat health.json
              exit 0
            fi
            sleep 8
          done
          echo "⚠️ سه تلاش ناموفق بود — سرور ممکن است در حال بیدارشدن یا دیپلوی باشد"
          exit 0
