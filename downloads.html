<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="دانلود فایل‌های PGN بازی‌های استادان بزرگ شطرنج"
    />
    <title>ChessHub | دانلود PGN</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* استایل‌های اختصاصی صفحه دانلود (Pro Edition) */
      .search-container {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        align-items: center;
        background: #ffffff;
        padding: 0.8rem 1rem;
        border-radius: var(--radius-md);
        margin-bottom: 1.5rem;
        box-shadow: var(--shadow-sm);
        border: 1px solid #e2e8f0;
      }
      .search-field {
        flex: 2;
        min-width: 150px;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: #f1f5f9;
        border-radius: var(--radius-sm);
        padding: 0.2rem 0.8rem;
        border: 1px solid #e2e8f0;
        transition: var(--transition-smooth);
      }
      .search-field:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
        background: #ffffff;
      }
      .search-field i {
        color: var(--text-light);
        font-size: 0.85rem;
      }
      .search-field input {
        width: 100%;
        border: none;
        background: transparent;
        padding: 0.5rem 0;
        font-family: "Vazir";
        font-size: 0.85rem;
        outline: none;
        color: var(--text-dark);
        font-weight: 600;
      }
      .download-count {
        font-size: 0.8rem;
        color: var(--text-light);
        background: #f1f5f9;
        padding: 0.3rem 1rem;
        border-radius: var(--radius-sm);
        white-space: nowrap;
        font-weight: 600;
        border: 1px solid #e2e8f0;
      }

      .players-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1.2rem;
        margin-bottom: 2rem;
      }
      .player-card {
        background: #ffffff;
        border-radius: var(--radius-md);
        padding: 1.2rem 0.5rem;
        text-align: center;
        transition: var(--transition-smooth);
        box-shadow: var(--shadow-sm);
        border: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .player-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-md);
        border-color: var(--accent);
      }
      .player-avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        margin: 0 auto 0.8rem;
        overflow: hidden;
        background: #f1f5f9;
        border: 3px solid #e2e8f0;
        transition: var(--transition-smooth);
      }
      .player-card:hover .player-avatar {
        border-color: var(--accent);
      }
      .player-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .player-name {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--primary-dark);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
      }
      .player-title {
        font-size: 0.65rem;
        color: var(--text-light);
        font-weight: 600;
        margin-bottom: 0.8rem;
      }
      .btn-download {
        background: var(--accent);
        color: #fff;
        border: 1px solid var(--accent-dark);
        padding: 0.3rem 1rem;
        border-radius: var(--radius-sm);
        font-size: 0.75rem;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition-smooth);
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-family: "Vazir";
        box-shadow: 0 3px 0 var(--accent-dark);
      }
      .btn-download:hover {
        background: #4299e1;
      }
      .btn-download:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 var(--accent-dark);
      }

      .no-result {
        text-align: center;
        padding: 3rem;
        color: var(--text-light);
        font-size: 0.9rem;
        grid-column: 1 / -1;
        background: #fff;
        border-radius: var(--radius-md);
        border: 1px dashed #cbd5e0;
      }

      @media (max-width: 768px) {
        .search-container {
          flex-direction: column;
          align-items: stretch;
        }
        .players-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 0.8rem;
        }
        .player-avatar {
          width: 56px;
          height: 56px;
        }
      }
      @media (max-width: 480px) {
        .players-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 0.5rem;
        }
        .player-avatar {
          width: 50px;
          height: 50px;
        }
        .player-name {
          font-size: 0.75rem;
        }
      }
    </style>
  </head>
  <body>

      <section class="app-hero">

        <p>
          فایل کامل بازی‌های ۳۰ استاد بزرگ به فرمت PGN برای تحلیل در
          نرم‌افزارهای شطرنج
        </p>
      </section>

      <!-- نوار جستجو -->
      <div class="search-container">
        <div class="search-field">
          <i class="fas fa-search"></i>
          <input
            type="text"
            id="searchPlayerInput"

        </div>
        <div class="download-count" id="resultCount">۳۰ فایل</div>

      <!-- گرید بازیکنان -->
      <div id="playersGridContainer" class="players-grid"></div>

      <div id="footer-placeholder"></div>
    </div>

          },
        ];

        let currentFilter = "";
        const gridContainer = document.getElementById("playersGridContainer");
        const resultCount = document.getElementById("resultCount");

        function renderPlayers() {
          const filtered =
            currentFilter === ""
              ? players
              : players.filter((p) =>
                  p.name.toLowerCase().includes(currentFilter.toLowerCase()),
                );
          if (resultCount) resultCount.innerText = `${filtered.length} فایل`;

          if (filtered.length === 0) {
            gridContainer.innerHTML = `<div class="no-result">❌ هیچ استادی با این نام یافت نشد</div>`;
            return;
          }

          gridContainer.innerHTML = "";
          filtered.forEach((player) => {
            const card = document.createElement("div");
            card.className = "player-card";
            card.innerHTML = `
              <div class="player-avatar">
                <img src="${player.avatar}" alt="${player.name}" onerror="this.src='https://ui-avatars.com/api/?background=2c3e50&color=fff&name=${encodeURIComponent(player.name)}'" loading="lazy">
              </div>
              <div class="player-name">${player.name}</div>
              <div class="player-title">${player.title}</div>
              <button class="btn-download" data-file="${player.file}">
                <i class="fas fa-download"></i> دانلود PGN
              </button>
            `;
            gridContainer.appendChild(card);
          });

          document.querySelectorAll(".btn-download").forEach((btn) => {
            btn.addEventListener("click", function (e) {
              e.stopPropagation();
              const fileName = this.getAttribute("data-file");
              const link = document.createElement("a");
              link.href = `pgn/${fileName}`;
              link.download = fileName;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
            });
          });
        }

        function initSearch() {
          const searchInput = document.getElementById("searchPlayerInput");
          if (searchInput) {
            searchInput.addEventListener("input", function (e) {
              currentFilter = e.target.value.trim();
              renderPlayers();
            });
          }
        }

        function init() {
          renderPlayers();
          initSearch();
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
