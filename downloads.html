<!doctype html>
<html lang="fa" dir="rtl">

    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="دانلود فایل‌های PGN بازی‌های استادان بزرگ شطرنج - بیش از ۳۰ استاد بزرگ و هزاران بازی معروف"
    />
    <title>ChessHub | دانلود PGN</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* ============================================
         🎯 استایل‌های اختصاصی صفحه دانلود
         ============================================ */

      /* ----- بخش معرفی (Hero) ----- */
      .download-hero {
        background: linear-gradient(
          135deg,
          #0f2b3f 0%,
          #1a4b6e 60%,
          #2a7f9c 100%
        );
        border-radius: var(--radius-lg);
        padding: 2rem 1.5rem;
        margin-bottom: 2rem;
        text-align: center;
        color: #fff;
        position: relative;
        overflow: hidden;
      }

      .download-hero::before {
        content: "\265A";
        position: absolute;
        font-size: 140px;
        right: -20px;
        bottom: -40px;
        opacity: 0.06;
        font-family: "Vazir", serif;
      }

      .download-hero::after {
        content: "\265B";
        position: absolute;
        font-size: 100px;
        left: -20px;
        top: -40px;
        opacity: 0.06;
        font-family: "Vazir", serif;
      }

      .download-hero h1 {
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        font-weight: 800;
        position: relative;
        z-index: 1;
      }

      .download-hero h1 i {
        color: #ffb347;
      }

      .download-hero p {
        opacity: 0.85;
        font-size: clamp(0.85rem, 1.4vw, 0.95rem);
        max-width: 560px;
        margin: 0.5rem auto 0;
        position: relative;
        z-index: 1;
      }

      /* ----- نوار جستجو (با پشتیبانی از تم) ----- */
      .search-container {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        align-items: center;
        background: var(--bg-card, #ffffff);
        padding: 0.5rem 1rem;
        border-radius: 60px;
        margin-bottom: 1.5rem;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color, #e2e8f0);
        transition:
          background 0.3s ease,
          border-color 0.3s ease;
      }

      .search-field {
        flex: 2;
        min-width: 150px;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--secondary);
        border-radius: 40px;
        padding: 0.1rem 0.8rem;
        border: 1px solid var(--border-color, transparent);
        transition:
          background 0.3s ease,
          border-color 0.3s ease;
      }

      .search-field i {
        color: var(--text-secondary, #94a3b8);
        font-size: 0.8rem;
      }

      .search-field input {
        width: 100%;
        border: none;
        background: transparent;
        padding: 0.5rem 0;
        font-family: "Vazir";
        font-size: 0.8rem;
        outline: none;
        color: var(--text-dark);
      }

      .search-field input::placeholder {
        color: var(--text-secondary, #94a3b8);
      }

      .download-count {
        font-size: 0.75rem;
        color: var(--text-secondary, #5f7f9e);
        background: var(--secondary);
        padding: 0.25rem 0.9rem;
        border-radius: 40px;
        white-space: nowrap;
        font-weight: 600;
        transition:
          background 0.3s ease,
          color 0.3s ease;
      }

      /* ----- گرید بازیکنان (مشابه games-database) ----- */
      .players-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1.2rem;
        margin-bottom: 2rem;
      }

      /* ----- کارت بازیکن (با پشتیبانی از تم) ----- */
      .player-card {
        background: var(--bg-card, #ffffff);
        border-radius: var(--radius-lg);
        padding: 1rem 0.5rem;
        text-align: center;
        transition: all 0.25s ease;
        box-shadow: var(--shadow-sm);
        border: 2px solid var(--border-color, transparent);
        display: flex;
        flex-direction: column;
        align-items: center;
        transition:
          background 0.3s ease,
          border-color 0.3s ease,
          transform 0.3s ease;
      }

      .player-card:hover {
        transform: translateY(-6px);
        box-shadow: var(--shadow-lg);
        border-color: var(--primary);
      }

      .player-avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        margin: 0 auto 0.5rem;
        overflow: hidden;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        background: var(--secondary);
        border: 2px solid var(--bg-card, #fff);
        transition:
          background 0.3s ease,
          border-color 0.3s ease;
      }

      .player-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .player-name {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--text-dark);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
      }

      .player-title {
        font-size: 0.6rem;
        color: var(--text-secondary, #5f7f9e);
        font-weight: 500;
        margin-bottom: 0.3rem;
      }

      .btn-download {
        background: var(--primary);
        color: #fff;
        border: none;
        padding: 0.25rem 0.9rem;
        border-radius: 40px;
        font-size: 0.65rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-family: "Vazir";
        margin-top: 0.3rem;
      }

      .btn-download:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
      }

      .no-result {
        text-align: center;
        padding: 2.5rem;
        color: var(--text-secondary, #5f7f9e);
        font-size: 0.9rem;
        grid-column: 1 / -1;
      }

      /* ============================================
         📱 واکنش‌گرایی (مشابه games-database)
         ============================================ */

      /* تبلت و موبایل بزرگ */
      @media (max-width: 768px) {
        .download-hero {
          padding: 1.5rem 1.2rem;
        }

        .download-hero h1 {
          font-size: 1.6rem;
        }

        .search-container {
          border-radius: 28px;
          padding: 0.6rem;
          flex-direction: column;
          align-items: stretch;
        }

        .search-field {
          min-width: unset;
        }

        .download-count {
          text-align: center;
        }

        /* 🔥 ۳ ستونه در تبلت و موبایل بزرگ */
        .players-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 0.8rem;
        }

        .player-avatar {
          width: 56px;
          height: 56px;
        }
      }

      /* موبایل متوسط */
      @media (max-width: 640px) {
        .players-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 0.8rem;
        }

        .player-avatar {
          width: 52px;
          height: 52px;
        }
      }

      /* موبایل کوچک */
      @media (max-width: 480px) {
        .download-hero {
          padding: 1.2rem 1rem;
        }

        .download-hero h1 {
          font-size: 1.3rem;
        }

        .download-hero p {
          font-size: 0.8rem;
        }

        /* 🔥 ۳ ستونه در موبایل کوچک (مشابه games-database) */
        .players-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 0.5rem;
        }

        .player-card {
          padding: 0.6rem 0.3rem;
        }

        .player-avatar {
          width: 44px;
          height: 44px;
        }

        .player-name {
          font-size: 0.7rem;
        }

        .player-title {
          font-size: 0.5rem;
        }

        .btn-download {
          font-size: 0.5rem;
          padding: 0.15rem 0.5rem;
        }

        .search-container {
          border-radius: 20px;
          padding: 0.4rem;
        }

        .search-field {
          padding: 0.1rem 0.6rem;
        }

        .search-field input {
          font-size: 0.7rem;
        }

        .download-count {
          font-size: 0.65rem;
          padding: 0.15rem 0.6rem;
        }
      }

      /* موبایل خیلی کوچک */
      @media (max-width: 380px) {
        .download-hero h1 {
          font-size: 1.1rem;
        }

        /* 🔥 ۳ ستونه حتی در کوچک‌ترین سایز (مشابه games-database) */
        .players-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 0.4rem;
        }

        .player-card {
          padding: 0.4rem 0.2rem;
        }

        .player-avatar {
          width: 38px;
          height: 38px;
        }

        .player-name {
          font-size: 0.55rem;
        }

        .player-title {
          font-size: 0.45rem;
        }

        .btn-download {
          font-size: 0.45rem;
          padding: 0.1rem 0.4rem;
        }

        .search-field input {
          font-size: 0.6rem;
          padding: 0.3rem 0;
        }

        .download-count {
          font-size: 0.55rem;
          padding: 0.1rem 0.4rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- هدر -->
      <div id="header-placeholder"></div>

      <!-- بخش معرفی (Hero) -->
      <div class="download-hero">
        <h1>
          <i class="fas fa-database"></i> دانلود فایل‌های PGN استادان بزرگ
        </h1>
        <p>
          ۳۰ استاد بزرگ برتر | فایل کامل بازی‌های هر استاد به فرمت PGN | مناسب
          برای تحلیل در نرم‌افزارهای شطرنج
        </p>
      </div>

      <!-- نوار جستجو -->
      <div class="search-container">
        <div class="search-field">
          <i class="fas fa-search"></i>
          <input
            type="text"
            id="searchPlayerInput"
            placeholder="جستجوی نام استاد..."
          />
        </div>
        <div class="download-count" id="resultCount">۳۰ فایل</div>
      </div>

      <!-- گرید بازیکنان -->
      <div id="playersGridContainer" class="players-grid"></div>

      <!-- فوتر -->
      <div id="footer-placeholder"></div>
    </div>

    <script src="js/script.js"></script>

          },
          {

            title: "استاد بزرگ",

          },
          {
            name: "Gukesh D",
            title: "سوپر استاد",
            file: "Gukesh.pgn",
            avatar: "images/players/gukesh.jpg",
          },
        ];

        // ============================================
        // 📊 متغیرها
        // ============================================
        let currentFilter = "";
        const gridContainer = document.getElementById("playersGridContainer");
        const resultCount = document.getElementById("resultCount");

        // ============================================
        // 🎨 رندر کارت‌ها
        // ============================================
        function renderPlayers() {
          const filtered =
            currentFilter === ""
              ? players
              : players.filter((p) =>
                  p.name.toLowerCase().includes(currentFilter.toLowerCase()),
                );

          if (resultCount) {
            resultCount.innerText = `${filtered.length} فایل`;
          }

          if (filtered.length === 0) {
            gridContainer.innerHTML = `
              <div class="no-result">
                ❌ هیچ استادی با این نام یافت نشد
              </div>
            `;
            return;
          }

          gridContainer.innerHTML = "";

          filtered.forEach((player) => {
            const card = document.createElement("div");
            card.className = "player-card";

            card.innerHTML = `
              <div class="player-avatar">
                <img 
                  src="${player.avatar}" 
                  alt="${player.name}" 
                  onerror="this.src='https://ui-avatars.com/api/?background=2a7f9c&color=fff&name=${encodeURIComponent(player.name)}'"
                  loading="lazy"
                >
              </div>
              <div class="player-name">${player.name}</div>
              <div class="player-title">${player.title}</div>
              <button class="btn-download" data-file="${player.file}">
                <i class="fas fa-download"></i> دانلود PGN
              </button>
            `;

            gridContainer.appendChild(card);
          });

          // رویداد دانلود
          document.querySelectorAll(".btn-download").forEach((btn) => {
            btn.addEventListener("click", function (e) {
              e.stopPropagation();
              const fileName = this.getAttribute("data-file");
              const link = document.createElement("a");
              link.href = `pgn/${fileName}`;
              link.download = fileName;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
            });
          });
        }

        // ============================================
        // 🔍 جستجو
        // ============================================
        function initSearch() {
          const searchInput = document.getElementById("searchPlayerInput");
          if (searchInput) {
            searchInput.addEventListener("input", function (e) {
              currentFilter = e.target.value.trim();
              renderPlayers();
            });
          }
        }

        // ============================================
        // 🚀 راه‌اندازی
        // ============================================
        function init() {
          renderPlayers();
          initSearch();

          console.log("✅ ChessHub Downloads loaded successfully");
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
