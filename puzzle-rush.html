<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>ChessHub | پازل عجله‌ای</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
      .game-area {
        background: white;
        border-radius: 32px;
        padding: 25px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
        max-width: 800px;
        margin: 0 auto;
      }
      .mode-selector {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .mode-btn {
        background: #eef2f5;
        border: none;
        padding: 8px 24px;
        border-radius: 40px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        font-size: 1rem;
      }
      .mode-btn.active {
        background: #2c7da0;
        color: white;
      }
      .stats {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f8fafc;
        padding: 12px 20px;
        border-radius: 60px;
        margin-bottom: 20px;
        font-weight: bold;
        flex-wrap: wrap;
        gap: 10px;
      }
      .turn-indicator {
        background: #e2e8f0;
        padding: 4px 12px;
        border-radius: 30px;
        font-size: 0.8rem;
      }
      #chessboard {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        aspect-ratio: 1 / 1;
        max-width: 500px;
        margin: 20px auto;
        border: 2px solid #cbd5e1;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      }
      .board-locked {
        opacity: 0.6;
        pointer-events: none;
      }
      .square {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        position: relative;
      }
      .square.light {
        background-color: #f0d9b5;
      }
      .square.dark {
        background-color: #b58863;
      }
      .square.selected {
        background-color: #b7d968;
        box-shadow: inset 0 0 0 2px #2c7da0;
      }
      .piece-img {
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .btn {
        background: #eef2f5;
        border: none;
        padding: 8px 20px;
        margin: 8px;
        border-radius: 40px;
        font-family: "Vazir";
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn-primary {
        background: #2c7da0;
        color: white;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn:hover:not(:disabled) {
        transform: scale(0.96);
        background: #e2e8f0;
      }
      .message {
        margin-top: 15px;
        padding: 10px;
        border-radius: 60px;
        font-size: 0.9rem;
        animation: fadeIn 0.3s;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .success {
        background: #d1fae5;
        color: #065f46;
      }
      .error {
        background: #fee2e2;
        color: #991b1b;
      }
      .info {
        background: #dbeafe;
        color: #1e40af;
      }
      .warning {
        background: #fef3c7;
        color: #92400e;
      }
      .record {
        background: #fef9c3;
        color: #854d0e;
      }
      @media (max-width: 768px) {
        .game-area {
          max-width: 100%;
          margin: 0 10px;
        }
        #chessboard {
          max-width: 100%;
        }
        .stats {
          font-size: 0.8rem;
        }
        .mode-btn {
          padding: 6px 16px;
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>
      <div class="game-area">
        <div class="mode-selector">
          <button class="mode-btn" data-mode="3">⏱️ ۳ دقیقه</button>
          <button class="mode-btn" data-mode="5">⏱️ ۵ دقیقه</button>
          <button class="mode-btn" data-mode="unlimited">
            ♾️ بی‌زمان (۳ خطا)
          </button>
        </div>
        <div class="stats">
          <span>🎯 پازل: <span id="puzzleCounter">0</span></span>
          <span id="timerDisplay">⏱️ ۰:۰۰</span>
          <span id="mistakeDisplay">❌ خطا: 0</span>
          <span class="turn-indicator" id="turnDisplay">⚪ نوبت: سفید</span>
        </div>
        <div id="chessboard"></div>
        <div>
          <button id="resetGameBtn" class="btn btn-primary">
            🔄 شروع مجدد
          </button>
          <button id="hintBtn" class="btn">💡 راهنمایی</button>
        </div>
        <div id="message" class="message"></div>
        <div
          id="recordDisplay"
          class="message record"
          style="display: none"
        ></div>
      </div>
      <div id="footer-placeholder"></div>
    </div>
    <script src="js/script.js"></script>
    <script src="puzzle-rush.js"></script>
  </body>
</html>
