<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>ChessHub | پازل عجله‌ای (Puzzle Rush)</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
      /* استایل‌های مخصوص پازل عجله‌ای */
      .game-area {
        background: white;
        border-radius: 32px;
        padding: 25px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
        max-width: 800px;
        margin: 0 auto;
      }
      .mode-selector {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .mode-btn {
        background: #eef2f5;
        border: none;
        padding: 8px 24px;
        border-radius: 40px;
        font-family: "Vazir";
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        font-size: 1rem;
      }
      .mode-btn.active {
        background: #2c7da0;
        color: white;
      }
      .stats {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f8fafc;
        padding: 12px 20px;
        border-radius: 60px;
        margin-bottom: 20px;
        font-weight: bold;
        flex-wrap: wrap;
        gap: 10px;
      }
      .turn-indicator {
        background: #e2e8f0;
        padding: 4px 12px;
        border-radius: 30px;
        font-size: 0.8rem;
      }
      #chessboard {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        aspect-ratio: 1 / 1;
        max-width: 500px;
        margin: 20px auto;
        border: 2px solid #cbd5e1;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      }
      .board-locked {
        opacity: 0.6;
        pointer-events: none;
      }
      .square {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .square.light {
        background-color: #f0d9b5;
      }
      .square.dark {
        background-color: #b58863;
      }
      .square.selected {
        background-color: #b7d968;
        box-shadow: inset 0 0 0 2px #2c7da0;
      }
      .piece-img {
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .btn {
        background: #eef2f5;
        border: none;
        padding: 8px 20px;
        margin: 8px;
        border-radius: 40px;
        font-family: "Vazir";
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn-primary {
        background: #2c7da0;
        color: white;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn:hover:not(:disabled) {
        transform: scale(0.96);
        background: #e2e8f0;
      }
      .message {
        margin-top: 15px;
        padding: 10px;
        border-radius: 60px;
        font-size: 0.9rem;
        animation: fadeIn 0.3s;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .success {
        background: #d1fae5;
        color: #065f46;
      }
      .error {
        background: #fee2e2;
        color: #991b1b;
      }
      .info {
        background: #dbeafe;
        color: #1e40af;
      }
      .warning {
        background: #fef3c7;
        color: #92400e;
      }
      .record {
        background: #fef9c3;
        color: #854d0e;
      }
      @media (max-width: 768px) {
        .game-area {
          max-width: 100%;
          margin: 0 10px;
        }
        #chessboard {
          max-width: 100%;
        }
        .stats {
          font-size: 0.8rem;
        }
        .mode-btn {
          padding: 6px 16px;
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <div class="game-area">
        <div class="mode-selector">
          <button class="mode-btn" data-mode="3">⏱️ ۳ دقیقه</button>
          <button class="mode-btn" data-mode="5">⏱️ ۵ دقیقه</button>
          <button class="mode-btn" data-mode="unlimited">
            ♾️ بی‌زمان (۳ خطا)
          </button>
        </div>
        <div class="stats">
          <span>🎯 پازل: <span id="puzzleCounter">0</span></span>
          <span id="timerDisplay">⏱️ ۰:۰۰</span>
          <span id="mistakeDisplay">❌ خطا: 0</span>
          <span class="turn-indicator" id="turnDisplay">⚪ نوبت: سفید</span>
        </div>
        <div id="chessboard"></div>
        <div>
          <button id="resetGameBtn" class="btn btn-primary">
            🔄 شروع مجدد
          </button>
          <button id="hintBtn" class="btn">💡 راهنمایی</button>
        </div>
        <div id="message" class="message"></div>
        <div
          id="recordDisplay"
          class="message record"
          style="display: none"
        ></div>
      </div>

      <div id="footer-placeholder"></div>
    </div>

    <script src="js/script.js"></script>
    <script>
      // ========== Puzzle Rush Logic ==========
      let puzzlesList = [],
        currentPuzzle = null,
        game = null,
        selectedSquare = null,
        currentMode = null,
        timeLeft = 0,
        mistakes = 0,
        gameActive = false,
        timerInterval = null,
        solvedCount = 0,
        bestRecord = { 3: 0, 5: 0, unlimited: 0 },
        isExecutingAutoMoves = false,
        currentMoveIndex = 0,
        isLocked = false,
        lockTimer = null;

      const boardDiv = document.getElementById("chessboard"),
        msgDiv = document.getElementById("message"),
        puzzleCounterSpan = document.getElementById("puzzleCounter"),
        timerDisplaySpan = document.getElementById("timerDisplay"),
        mistakeDisplaySpan = document.getElementById("mistakeDisplay"),
        turnDisplaySpan = document.getElementById("turnDisplay"),
        recordDisplayDiv = document.getElementById("recordDisplay"),
        resetBtn = document.getElementById("resetGameBtn"),
        hintBtn = document.getElementById("hintBtn");

      // ========== توابع کمکی ==========
      function loadRecords() {
        const stored = localStorage.getItem("chesshub_puzzle_records");
        if (stored) {
          try {
            const parsed = JSON.parse(stored);
            if (parsed["3"]) bestRecord["3"] = parsed["3"];
            if (parsed["5"]) bestRecord["5"] = parsed["5"];
            if (parsed["unlimited"])
              bestRecord["unlimited"] = parsed["unlimited"];
          } catch (e) {}
        }
      }

      function saveRecord(mode, score) {
        if (score > bestRecord[mode]) {
          bestRecord[mode] = score;
          localStorage.setItem(
            "chesshub_puzzle_records",
            JSON.stringify(bestRecord),
          );
          return true;
        }
        return false;
      }

      function showRecordIfNew(score, mode) {
        if (score === bestRecord[mode] && score > 0) {
          recordDisplayDiv.textContent = `🏆 رکورد جدید ${mode === "unlimited" ? "بی‌زمان" : mode + " دقیقه"}: ${score} پازل! 🏆`;
          recordDisplayDiv.style.display = "block";
          setTimeout(() => (recordDisplayDiv.style.display = "none"), 4000);
        } else {
          recordDisplayDiv.style.display = "none";
        }
      }

      async function loadPuzzles() {
        try {
          const response = await fetch("puzzles.txt");
          const text = await response.text();
          const lines = text.split("\n");
          for (let line of lines) {
            line = line.trim();
            if (!line) continue;
            const parts = line.split(",");
            if (parts.length >= 3) {
              const fen = parts[1].trim();
              const movesStr = parts[2].trim();
              const movesUCI = movesStr.split(/\s+/);
              if (fen && movesUCI.length) puzzlesList.push({ fen, movesUCI });
            }
          }
          if (puzzlesList.length === 0) useSamplePuzzles();
        } catch (err) {
          console.error(err);
          useSamplePuzzles();
        }
      }

      function useSamplePuzzles() {
        puzzlesList = [
          {
            fen: "5R2/6p1/4p2p/R3N3/5P1k/1rn1K3/6rP/8 w - - 0 1",
            movesUCI: ["e5f3", "g4h4", "a5g5", "h6g5", "e5f3", "h4h5", "f8h8"],
          },
          {
            fen: "r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 0 4",
            movesUCI: ["f3e5", "c6e5", "c4e5"],
          },
        ];
      }

      function showMessage(text, type) {
        msgDiv.textContent = text;
        msgDiv.className = `message ${type}`;
        setTimeout(() => {
          if (msgDiv.textContent === text) msgDiv.className = "message";
        }, 3000);
      }

      function stopTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
      }

      function startTimer(seconds) {
        stopTimer();
        timeLeft = seconds;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
          if (!gameActive) return;
          if (timeLeft <= 0) {
            stopTimer();
            gameActive = false;
            showMessage("⏰ زمان تمام شد! بازی تمام شد.", "warning");
            boardDiv.style.pointerEvents = "none";
            hintBtn.disabled = true;
          } else {
            timeLeft--;
            updateTimerDisplay();
          }
        }, 1000);
      }

      function updateTimerDisplay() {
        if (currentMode === "unlimited") timerDisplaySpan.textContent = "⏱️ ∞";
        else {
          const m = Math.floor(timeLeft / 60),
            s = timeLeft % 60;
          timerDisplaySpan.textContent = `⏱️ ${m}:${s.toString().padStart(2, "0")}`;
        }
      }

      function updateMistakeDisplay() {
        if (currentMode === "unlimited")
          mistakeDisplaySpan.textContent = `❌ خطا: ${mistakes}/3`;
        else mistakeDisplaySpan.textContent = `❌ خطا: ${mistakes}`;
      }

      function updateTurnDisplay() {
        if (game && gameActive) {
          const turn = game.turn() === "w" ? "سفید" : "سیاه";
          const icon = game.turn() === "w" ? "⚪" : "⚫";
          turnDisplaySpan.textContent = `${icon} نوبت: ${turn}`;
        }
      }

      function getRandomPuzzle() {
        if (!puzzlesList.length) return null;
        return puzzlesList[Math.floor(Math.random() * puzzlesList.length)];
      }

      function uciToSan(uci, fen) {
        const temp = new Chess(fen);
        const from = uci.slice(0, 2),
          to = uci.slice(2, 4),
          promo = uci[4];
        const move = temp.move({ from, to, promotion: promo });
        return move ? move.san : uci;
      }

      function lockBoardTemp() {
        if (isLocked) return;
        isLocked = true;
        boardDiv.classList.add("board-locked");
        hintBtn.disabled = true;
        showMessage("⏳ سه خطا! ۵ ثانیه صبر کن...", "lock");
        lockTimer = setTimeout(() => {
          isLocked = false;
          boardDiv.classList.remove("board-locked");
          hintBtn.disabled = false;
          mistakes = 0;
          updateMistakeDisplay();
          showMessage(
            "✅ زمان قفل تمام شد. دوباره می‌توانی حرکت کنی (۳ فرصت جدید).",
            "success",
          );
          lockTimer = null;
        }, 5000);
      }

      async function autoMoveOnce() {
        if (!gameActive) return false;
        if (isExecutingAutoMoves) return false;
        if (currentMoveIndex >= currentPuzzle.movesUCI.length) return false;
        if (currentMoveIndex % 2 !== 0) return false; // فقط حرکت اول (سفید) خودکار است
        isExecutingAutoMoves = true;
        const moveUCI = currentPuzzle.movesUCI[currentMoveIndex];
        const from = moveUCI.slice(0, 2),
          to = moveUCI.slice(2, 4),
          promo = moveUCI[4];
        try {
          const move = game.move({ from, to, promotion: promo });
          if (move) {
            renderBoard();
            updateTurnDisplay();
            currentMoveIndex++;
            if (game.game_over() && game.in_checkmate()) {
              showMessage("🎉 مات! پازل با موفقیت حل شد.", "success");
              await handlePuzzleSolved();
              isExecutingAutoMoves = false;
              return true;
            }
            if (currentMoveIndex >= currentPuzzle.movesUCI.length) {
              await handlePuzzleSolved();
              isExecutingAutoMoves = false;
              return true;
            }
            isExecutingAutoMoves = false;
            return true;
          } else {
            console.error("Auto move failed:", moveUCI);
            showMessage("خطا در اجرای خودکار حرکت", "error");
            isExecutingAutoMoves = false;
            return false;
          }
        } catch (e) {
          console.error(e);
          isExecutingAutoMoves = false;
          return false;
        }
      }

      async function handlePuzzleSolved() {
        solvedCount++;
        puzzleCounterSpan.textContent = solvedCount;
        showMessage(`✅ پازل حل شد! (${solvedCount})`, "success");
        const isNewRecord = saveRecord(currentMode, solvedCount);
        if (isNewRecord) showRecordIfNew(solvedCount, currentMode);
        const nextPuzzle = getRandomPuzzle();
        if (nextPuzzle) {
          await loadPuzzleAndStart(nextPuzzle);
        } else {
          gameActive = false;
          showMessage("تمام پازل‌ها تمام شد! تبریک!", "success");
          boardDiv.style.pointerEvents = "none";
          hintBtn.disabled = true;
          stopTimer();
        }
      }

      async function loadPuzzleAndStart(puzzle) {
        if (!puzzle) return false;
        game = new Chess(puzzle.fen);
        selectedSquare = null;
        currentPuzzle = puzzle;
        currentMoveIndex = 0;
        renderBoard();
        updateTurnDisplay();
        if (currentPuzzle.movesUCI.length > 0 && currentMoveIndex % 2 === 0) {
          await autoMoveOnce();
        }
        return true;
      }

      function renderBoard() {
        if (!game) return;
        const board = game.board();
        boardDiv.innerHTML = "";
        boardDiv.style.display = "grid";
        boardDiv.style.gridTemplateColumns = "repeat(8,1fr)";
        for (let i = 7; i >= 0; i--) {
          for (let j = 0; j < 8; j++) {
            const piece = board[i][j];
            const isLight = (i + j) % 2 === 0;
            const squareDiv = document.createElement("div");
            squareDiv.className = `square ${isLight ? "light" : "dark"}`;
            const file = String.fromCharCode(97 + j);
            const rank = 8 - i;
            const squareName = file + rank;
            squareDiv.dataset.square = squareName;
            if (piece) {
              const pieceType = piece.type.toUpperCase();
              const colorCode = piece.color === "w" ? "w" : "b";
              let pieceCode = "";
              switch (pieceType) {
                case "K":
                  pieceCode = "K";
                  break;
                case "Q":
                  pieceCode = "Q";
                  break;
                case "R":
                  pieceCode = "R";
                  break;
                case "B":
                  pieceCode = "B";
                  break;
                case "N":
                  pieceCode = "N";
                  break;
                case "P":
                  pieceCode = "P";
                  break;
              }
              const img = document.createElement("img");
              img.src = `pieces/merida/${colorCode}${pieceCode}.svg`;
              img.classList.add("piece-img");
              squareDiv.appendChild(img);
            }
            squareDiv.addEventListener("click", () =>
              onSquareClick(squareName),
            );
            boardDiv.appendChild(squareDiv);
          }
        }
        if (selectedSquare) {
          const el = document.querySelector(
            `.square[data-square="${selectedSquare}"]`,
          );
          if (el) el.classList.add("selected");
        }
      }

      async function onSquareClick(square) {
        if (!gameActive) {
          showMessage("بازی تمام شده، دکمه شروع مجدد را بزنید.", "info");
          return;
        }
        if (isLocked) {
          showMessage("تخته قفل است، لطفاً صبر کنید.", "info");
          return;
        }
        if (isExecutingAutoMoves) {
          showMessage("در حال اجرای حرکات خودکار... لطفاً صبر کنید.", "info");
          return;
        }
        const turnColor = game.turn();
        if (!selectedSquare) {
          const piece = game.get(square);
          if (piece && piece.color === turnColor) {
            selectedSquare = square;
            renderBoard();
          } else {
            showMessage(
              `مهره ${turnColor === "w" ? "سفید" : "سیاه"} خود را انتخاب کنید.`,
              "error",
            );
          }
          return;
        }
        const move = { from: selectedSquare, to: square, promotion: "q" };
        try {
          const result = game.move(move);
          if (result) {
            selectedSquare = null;
            renderBoard();
            const playedUCI =
              result.from + result.to + (result.promotion || "");
            const expectedUCI = currentPuzzle.movesUCI[currentMoveIndex];
            if (playedUCI === expectedUCI) {
              showMessage(`✅ حرکت صحیح!`, "success");
              if (currentMode !== "unlimited") {
                mistakes = 0;
                updateMistakeDisplay();
              }
              currentMoveIndex++;
              if (currentMoveIndex >= currentPuzzle.movesUCI.length) {
                await handlePuzzleSolved();
                return;
              }
              if (currentMoveIndex % 2 === 0) {
                await autoMoveOnce();
              }
            } else {
              mistakes++;
              updateMistakeDisplay();
              if (currentMode === "unlimited") {
                if (mistakes >= 3) {
                  gameActive = false;
                  showMessage("❌ سه اشتباه! بازی تمام شد.", "warning");
                  boardDiv.style.pointerEvents = "none";
                  hintBtn.disabled = true;
                  stopTimer();
                } else {
                  showMessage(`❌ حرکت اشتباه! (${mistakes}/3)`, "error");
                  await loadPuzzleAndStart(currentPuzzle);
                }
              } else {
                if (mistakes >= 3) {
                  lockBoardTemp();
                  game.undo();
                  renderBoard();
                  selectedSquare = null;
                } else {
                  showMessage(`❌ حرکت اشتباه! (${mistakes}/3)`, "error");
                  game.undo();
                  renderBoard();
                  selectedSquare = null;
                }
              }
            }
            updateTurnDisplay();
          } else {
            showMessage("حرکت غیرمجاز", "error");
            selectedSquare = null;
            renderBoard();
          }
        } catch (e) {
          showMessage("خطا در حرکت", "error");
          selectedSquare = null;
          renderBoard();
        }
      }

      function showHint() {
        if (!gameActive) {
          showMessage("بازی فعال نیست.", "info");
          return;
        }
        if (isLocked) {
          showMessage("در حال قفل، نمی‌توانی راهنمایی بگیری.", "info");
          return;
        }
        if (currentPuzzle && currentMoveIndex < currentPuzzle.movesUCI.length) {
          const san = uciToSan(
            currentPuzzle.movesUCI[currentMoveIndex],
            game.fen(),
          );
          showMessage(`💡 حرکت بعدی باید: ${san}`, "hint");
        } else {
          showMessage("پازل تمام شد!", "success");
        }
      }

      async function startNewGame(mode) {
        stopTimer();
        if (lockTimer) clearTimeout(lockTimer);
        isLocked = false;
        boardDiv.classList.remove("board-locked");
        gameActive = true;
        solvedCount = 0;
        mistakes = 0;
        puzzleCounterSpan.textContent = "0";
        updateMistakeDisplay();
        boardDiv.style.pointerEvents = "auto";
        hintBtn.disabled = false;
        recordDisplayDiv.style.display = "none";
        const firstPuzzle = getRandomPuzzle();
        if (!firstPuzzle) {
          showMessage("خطا در بارگذاری پازل", "error");
          return;
        }
        await loadPuzzleAndStart(firstPuzzle);
        if (mode === "3") startTimer(180);
        else if (mode === "5") startTimer(300);
        else timerDisplaySpan.textContent = "⏱️ ∞";
        currentMode = mode;
      }

      function setMode(mode) {
        startNewGame(mode);
        document.querySelectorAll(".mode-btn").forEach((btn) => {
          if (btn.dataset.mode === mode) btn.classList.add("active");
          else btn.classList.remove("active");
        });
      }

      resetBtn.addEventListener("click", () => {
        if (currentMode) setMode(currentMode);
        else showMessage("لطفاً ابتدا یک حالت را انتخاب کنید.", "info");
      });
      hintBtn.addEventListener("click", showHint);
      document
        .querySelectorAll(".mode-btn")
        .forEach((btn) =>
          btn.addEventListener("click", () => setMode(btn.dataset.mode)),
        );

      loadRecords();
      loadPuzzles().then(() => {
        showMessage(
          "لطفاً یکی از حالت‌های زمان یا بی‌زمان را انتخاب کنید.",
          "info",
        );
      });
    </script>
  </body>
</html>
