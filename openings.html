    />

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"

    <style>
      /* استایل‌های مخصوص صفحه گشایش‌ها */
      .openings-header {
        text-align: center;
        margin-bottom: 30px;
      }
      .openings-header h2 {
        font-size: 2rem;
        color: #2c7da0;
      }
      .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin: 20px auto;
        flex-wrap: wrap;
      }
      .search-box {
        padding: 8px 18px;
        border-radius: 60px;
        border: 1px solid #cbd5e1;
        width: 260px;
        font-family: "Vazir";
      }
      .filter-buttons {
        display: flex;
        gap: 10px;
      }
      .filter-btn {
        background: #eef2f5;
        border: none;
        padding: 6px 18px;
        border-radius: 40px;
        cursor: pointer;
        font-family: "Vazir";
        font-weight: bold;
      }
      .filter-btn.active {
        background: #2c7da0;
        color: white;
      }
      .openings-grid {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .opening-group {
        background: white;
        border-radius: 32px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      }
      .group-header {
        background: linear-gradient(135deg, #2c7da0, #1f6392);
        padding: 15px 25px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
      }
      .group-header h3 {
        font-size: 1.5rem;
      }
      .group-header i {
        transition: transform 0.2s;
      }
      .group-content {
        padding: 0;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
      }
      .group-content.open {
        max-height: 3000px;
        padding: 20px;
      }
      .variations-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 12px;
      }
      .variation-item {
        background: #f8fafc;
        padding: 8px 15px;
        border-radius: 28px;
        font-size: 0.9rem;
        cursor: pointer;
        border: 1px solid #e2e8f0;
        transition: 0.1s;
      }
      .variation-item:hover {
        background: #e2e8f0;
        transform: translateX(-3px);
      }
      .no-result {
        text-align: center;
        padding: 40px;
        color: #5f7f9e;
      }
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(8px);
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: center;
        visibility: hidden;
        opacity: 0;
        transition: 0.2s;
      }
      .modal-overlay.active {
        visibility: visible;
        opacity: 1;
      }
      .modal-content {
        background: white;
        border-radius: 48px;
        padding: 25px;
        max-width: 520px;
        width: 90%;
        text-align: center;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      }
      .modal-content h3 {
        color: #2c7da0;
        margin-bottom: 15px;
        font-size: 1.5rem;
      }
      canvas {
        width: 100%;
        max-width: 420px;
        height: auto;
        background-color: #f0d9b5;
        border-radius: 24px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        margin: 15px auto;
      }
      .modal-nav {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 15px;
      }
      .modal-nav button {
        background: #eef2f5;
        border: none;
        padding: 8px 24px;
        border-radius: 40px;
        font-family: "Vazir";
        font-weight: bold;
        cursor: pointer;
      }
      .close-modal {
        background: #e25555;
        color: white;
        border: none;
        margin-top: 20px;
        padding: 8px 20px;
        border-radius: 40px;
        font-weight: bold;
        cursor: pointer;
      }
      @media (max-width: 768px) {
        .group-header h3 {
          font-size: 1.2rem;
        }
        .variations-list {
          grid-template-columns: 1fr;
        }
        .modal-content {
          padding: 15px;
        }
        canvas {
          max-width: 300px;
        }
        .controls {
          gap: 10px;
        }
        .search-box {
          width: 100%;
        }
        .filter-btn {
          padding: 4px 12px;
          font-size: 0.8rem;
        }
      }
    </style>
  </head>

    <div class="container">
      <div id="header-placeholder"></div>

      <div class="openings-header">
        <h2>📘 دانشنامه کامل گشایش‌های شطرنج</h2>
        <div class="controls">
          <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="🔍 جستجو بر اساس نام گشایش یا واریانت..."
          />
          <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">همه</button>
            <button class="filter-btn" data-filter="e4">حرکات 1.e4</button>
            <button class="filter-btn" data-filter="d4">حرکات 1.d4</button>
            <button class="filter-btn" data-filter="other">
              سایر گشایش‌ها
            </button>
          </div>
        </div>
      </div>

      <div id="openingsGrid" class="openings-grid"></div>

      <div id="footer-placeholder"></div>
    </div>

    <div id="boardModal" class="modal-overlay">
      <div class="modal-content">
        <h3 id="modalTitle"></h3>
        <canvas id="modalCanvas" width="420" height="420"></canvas>
        <div class="modal-nav">
          <button id="modalPrevBtn">◀ قبلی</button>
          <button id="modalNextBtn">بعدی ▶</button>
        </div>
        <button id="closeModalBtn" class="close-modal">✖ بستن</button>
      </div>
    </div>

        bR: "bR.svg",
        bB: "bB.svg",
        bN: "bN.svg",
        bP: "bP.svg",
      };
      function loadPieces() {
        return new Promise((resolve) => {
          let loaded = 0;
          const total = Object.keys(pieceCodes).length;
          for (const [key, filename] of Object.entries(pieceCodes)) {
            const img = new Image();
            img.onload = img.onerror = () => {
              loaded++;
              if (loaded === total) resolve();
            };
            img.src = `pieces/merida/${filename}`;
            pieceImages[key] = img;
          }
        });
      }

      // ---------- منطق مودال و رندرینگ ----------
      let currentModalGame = null,
        currentModalMoves = [],
        currentModalIndex = 0,
        modalCanvas = null,
        modalCtx = null;
      function drawModalBoard() {
        if (!modalCanvas || !modalCtx || !currentModalGame) return;
        const board = currentModalGame.board();
        const cellSize = modalCanvas.width / 8;
        for (let i = 0; i < 8; i++) {
          for (let j = 0; j < 8; j++) {
            const isLight = (i + j) % 2 === 0;
            modalCtx.fillStyle = isLight ? "#f0d9b5" : "#b58863";
            modalCtx.fillRect(j * cellSize, i * cellSize, cellSize, cellSize);
            const piece = board[i][j];
            if (piece) {
              const code =
                (piece.color === "w" ? "w" : "b") + piece.type.toUpperCase();
              const img = pieceImages[code];
              if (img && img.complete) {
                modalCtx.drawImage(
                  img,
                  j * cellSize,
                  i * cellSize,
                  cellSize,
                  cellSize,
                );
              } else {
                modalCtx.font = `${cellSize * 0.55}px Arial`;
                modalCtx.fillStyle = "#222";
                modalCtx.textAlign = "center";
                modalCtx.textBaseline = "middle";
                const sym =
                  {
                    wK: "♔",
                    wQ: "♕",
                    wR: "♖",
                    wB: "♗",
                    wN: "♘",
                    wP: "♙",
                    bK: "♚",
                    bQ: "♛",
                    bR: "♜",
                    bB: "♝",
                    bN: "♞",
                    bP: "♟",
                  }[code] || "";
                modalCtx.fillText(
                  sym,
                  j * cellSize + cellSize / 2,
                  i * cellSize + cellSize / 2,
                );
              }
            }
          }
        }
      }
      function updateModalPosition() {
        currentModalGame = new Chess();
        for (let i = 0; i < currentModalIndex; i++) {
          currentModalGame.move(currentModalMoves[i], { sloppy: true });
        }
        drawModalBoard();
      }
      function showModal(title, moves) {
        currentModalMoves = moves;
        currentModalIndex = 0;
        document.getElementById("modalTitle").innerText = title;
        currentModalGame = new Chess();
        updateModalPosition();
        document.getElementById("boardModal").classList.add("active");
      }
      function closeModal() {
        document.getElementById("boardModal").classList.remove("active");
      }
      function modalPrev() {
        if (currentModalIndex > 0) {
          currentModalIndex--;
          updateModalPosition();
        }
      }
      function modalNext() {
        if (currentModalIndex < currentModalMoves.length) {
          currentModalIndex++;
          updateModalPosition();
        }
      }

      // رندر اصلی
      let currentFilter = "all",
        searchTerm = "";
      function renderOpenings() {
        const container = document.getElementById("openingsGrid");
        container.innerHTML = "";
        let filtered = openingsDatabase.filter((group) => {
          if (currentFilter !== "all" && group.firstMove !== currentFilter)
            return false;
          if (searchTerm) {
            const matchName = group.name.includes(searchTerm);
            const matchVar = group.variations.some((v) =>
              v.name.includes(searchTerm),
            );
            if (!matchName && !matchVar) return false;
          }
          return true;
        });
        if (filtered.length === 0) {
          container.innerHTML =
            '<div class="no-result">❌ هیچ گشایشی با این جستجو یافت نشد.</div>';
          return;
        }
        filtered.forEach((group) => {
          const groupDiv = document.createElement("div");
          groupDiv.className = "opening-group";
          groupDiv.innerHTML = `
        <div class="group-header">
          <h3>${group.name}</h3>
          <i class="fas fa-chevron-down"></i>
        </div>
        <div class="group-content">
          <div class="variations-list">
            ${group.variations.map((v) => `<div class="variation-item" data-name="${v.name}" data-moves='${JSON.stringify(v.moves)}'>${v.name}</div>`).join("")}
          </div>
        </div>
      `;
          container.appendChild(groupDiv);
          const header = groupDiv.querySelector(".group-header");
          const content = groupDiv.querySelector(".group-content");
          header.addEventListener("click", () => {
            content.classList.toggle("open");
            const icon = header.querySelector("i");
            icon.style.transform = content.classList.contains("open")
              ? "rotate(180deg)"
              : "rotate(0deg)";
          });
        });
        document.querySelectorAll(".variation-item").forEach((item) => {
          item.addEventListener("click", (e) => {
            e.stopPropagation();
            const name = item.getAttribute("data-name");
            const movesJson = item.getAttribute("data-moves");
            const moves = JSON.parse(movesJson);
            showModal(name, moves);
          });
        });
      }

      document.getElementById("searchInput").addEventListener("input", (e) => {
        searchTerm = e.target.value.trim();
        renderOpenings();
      });
      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentFilter = btn.getAttribute("data-filter");
          renderOpenings();
        });
      });

      modalCanvas = document.getElementById("modalCanvas");
      modalCtx = modalCanvas.getContext("2d");
      document
        .getElementById("modalPrevBtn")
        .addEventListener("click", modalPrev);
      document
        .getElementById("modalNextBtn")
        .addEventListener("click", modalNext);
      document
        .getElementById("closeModalBtn")
        .addEventListener("click", closeModal);
      document.getElementById("boardModal").addEventListener("click", (e) => {
        if (e.target === document.getElementById("boardModal")) closeModal();
      });

      // منوی موبایل قبلاً در script.js مدیریت می‌شود، نیازی به کد جداگانه نیست.
      loadPieces().then(() => renderOpenings());
    </script>
  </body>
</html>
