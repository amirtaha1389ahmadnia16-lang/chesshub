<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ChessHub | دانشنامه گشایش‌ها</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
      /* ============================================
         🎯 استایل‌های اختصاصی صفحه گشایش‌ها
         ============================================ */

      .openings-hero {
        background: linear-gradient(
          135deg,
          #0f2b3f 0%,
          #1a4b6e 60%,
          #2a7f9c 100%
        );
        border-radius: var(--radius-lg);
        padding: 1.5rem 1.2rem;
        margin-bottom: 1.2rem;
        text-align: center;
        color: #fff;
        position: relative;
        overflow: hidden;
        min-height: 80px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .openings-hero::before {
        content: "\265A";
        position: absolute;
        font-size: 80px;
        right: -10px;
        bottom: -20px;
        opacity: 0.06;
        font-family: "Vazir", serif;
      }

      .openings-hero::after {
        content: "\265B";
        position: absolute;
        font-size: 60px;
        left: -10px;
        top: -20px;
        opacity: 0.06;
        font-family: "Vazir", serif;
      }

      .openings-hero h1 {
        font-size: clamp(1.2rem, 3vw, 1.8rem);
        font-weight: 800;
        margin-bottom: 0.1rem;
        position: relative;
        z-index: 1;
      }

      .openings-hero h1 i {
        color: #ffb347;
      }

      .openings-hero p {
        font-size: clamp(0.7rem, 1.2vw, 0.85rem);
        opacity: 0.85;
        max-width: 560px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
        background: #ffffff;
        border-radius: var(--radius-md);
        padding: 0.5rem 1rem;
        margin-bottom: 1.2rem;
        box-shadow: var(--shadow-sm);
        border: 1px solid #eef2f5;
      }

      .search-box {
        flex: 2;
        min-width: 160px;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        background: #f8fafc;
        border-radius: 40px;
        padding: 0.1rem 0.8rem;
        border: 1px solid #eef2f5;
      }

      .search-box i {
        color: #94a3b8;
        font-size: 0.8rem;
      }

      .search-box input {
        width: 100%;
        border: none;
        background: transparent;
        padding: 0.5rem 0;
        font-family: "Vazir";
        font-size: 0.8rem;
        outline: none;
        color: #1e2f3e;
      }

      .search-box input::placeholder {
        color: #94a3b8;
      }

      .filter-chips {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
      }

      .chip {
        background: #eef2f5;
        border: none;
        padding: 0.3rem 0.8rem;
        border-radius: 40px;
        font-family: "Vazir";
        font-size: 0.7rem;
        font-weight: 500;
        cursor: pointer;
        transition: 0.2s;
        color: #1e2f3e;
      }

      .chip.active {
        background: #2c7da0;
        color: white;
      }

      .chip:hover:not(.active) {
        background: #dde4ec;
      }

      .openings-list {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        margin-bottom: 1.5rem;
      }

      .opening-card {
        background: #ffffff;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        border: 1px solid #eef2f5;
      }

      .card-header {
        padding: 0.6rem 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        border-bottom: 1px solid #eef2f5;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .card-title {
        font-weight: 700;
        color: #1e2f3e;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.9rem;
      }

      .card-title i {
        color: #2c7da0;
      }

      .card-header > span:not(.card-title) {
        font-family: monospace;
        direction: ltr;
        color: #5f7f9e;
        font-size: 0.75rem;
      }

      .card-header .fa-chevron-down {
        color: #5f7f9e;
        transition: transform 0.3s ease;
        font-size: 0.8rem;
      }

      .card-body {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
        background: #fafcff;
      }

      .card-body.open {
        max-height: 350px;
        overflow-y: auto;
        padding: 0.8rem;
      }

      .card-body::-webkit-scrollbar {
        width: 4px;
      }

      .card-body::-webkit-scrollbar-track {
        background: #f8fafc;
        border-radius: 10px;
      }

      .card-body::-webkit-scrollbar-thumb {
        background: #2c7da0;
        border-radius: 10px;
      }

      .variants-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 0.6rem;
      }

      .variant-item {
        background: #f8fafc;
        border-radius: 14px;
        padding: 0.4rem 0.8rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        border: 1px solid #eef2f8;
        transition: 0.2s;
        color: #1e2f3e;
        font-size: 0.8rem;
      }

      .variant-item:hover {
        background: #f4f7fb;
        transform: translateX(-4px);
        border-color: #2c7da0;
      }

      .variant-item span:last-child {
        font-family: monospace;
        font-size: 0.7rem;
        color: #5f7f9e;
        direction: ltr;
      }

      /* ============================================
         🎯 Overlay با تخته DOM (مثل آخربازی‌ها)
         ============================================ */
      .page-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100dvh;
        background: #f0f4f8;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        box-shadow: -8px 0 40px rgba(0, 0, 0, 0.1);
        direction: rtl;
      }

      .page-overlay.open {
        transform: translateX(0);
      }

      .overlay-header {
        flex-shrink: 0;
        background: rgba(240, 244, 248, 0.9);
        backdrop-filter: blur(10px);
        padding: 0.8rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      }

      .overlay-header h2 {
        font-size: 1.1rem;
        color: #1a4b6e;
      }

      .close-btn {
        background: #f4f7fb;
        border: none;
        padding: 0.4rem 1rem;
        border-radius: 40px;
        font-family: "Vazir";
        font-weight: 600;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        gap: 0.3rem;
        color: #1e2f3e;
        transition: 0.2s;
        font-size: 0.8rem;
      }

      .close-btn:hover {
        background: #2c7da0;
        color: white;
        transform: translateY(-2px);
      }

      .overlay-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 1.2rem;
      }

      .overlay-scroll::-webkit-scrollbar {
        width: 5px;
      }

      .overlay-scroll::-webkit-scrollbar-track {
        background: #f8fafc;
        border-radius: 10px;
      }

      .overlay-scroll::-webkit-scrollbar-thumb {
        background: #2c7da0;
        border-radius: 10px;
      }

      /* ----- نمایشگر تخته (DOM) ----- */
      .viewer-body {
        display: flex;
        flex-wrap: wrap;
        gap: 1.2rem;
        justify-content: center;
        align-items: flex-start;
      }

      .board-wrapper {
        flex: 1 1 280px;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* 🔥 تخته DOM با رنگ‌های تم */
      #chessboard {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        aspect-ratio: 1 / 1;
        width: 100%;
        max-width: 400px;
        border: 2px solid #cbd5e1;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        margin: 0 auto;
      }

      @media (min-width: 768px) {
        #chessboard {
          max-width: 450px;
        }
      }

      @media (min-width: 1200px) {
        #chessboard {
          max-width: 500px;
        }
      }

      .square {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: default;
        touch-action: none;
      }

      .square.light {
        background-color: var(--board-light, #f0d9b5);
      }

      .square.dark {
        background-color: var(--board-dark, #b58863);
      }

      .piece-img {
        width: 100%;
        height: 100%;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
        draggable: false;
      }

      .info-wrapper {
        flex: 1.5 1 280px;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }

      .pie-section {
        background: #ffffff;
        border-radius: var(--radius-sm);
        padding: 0.8rem;
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        border: 1px solid #eef2f5;
      }

      .legend {
        font-size: 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        color: #1e2f3e;
      }

      .legend .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
        margin-left: 4px;
      }

      .info-card {
        background: #ffffff;
        border-radius: var(--radius-sm);
        padding: 0.8rem;
        box-shadow: var(--shadow-sm);
        border: 1px solid #eef2f5;
      }

      .info-card h4 {
        font-size: 0.85rem;
        color: #2c7da0;
        border-right: 4px solid #2c7da0;
        padding-right: 8px;
        margin-bottom: 0.6rem;
      }

      .info-list {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }

      .info-list li {
        background: #f8fafc;
        border-radius: 10px;
        padding: 0.3rem 0.6rem;
        font-size: 0.75rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        color: #1e2f3e;
      }

      .popular-move {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f8fafc;
        border-radius: 10px;
        padding: 0.3rem 0.6rem;
        cursor: pointer;
        margin-bottom: 0.3rem;
        transition: 0.2s;
        color: #1e2f3e;
        font-size: 0.75rem;
      }

      .popular-move:hover {
        background: #e2e8f0;
      }

      .move-san {
        font-family: monospace;
        direction: ltr;
        font-weight: 700;
        background: white;
        padding: 0.1rem 0.5rem;
        border-radius: 16px;
        color: #1e2f3e;
        font-size: 0.7rem;
      }

      .game-item,
      .trap-item {
        display: flex;
        justify-content: space-between;
        background: #f9fafc;
        border-radius: 12px;
        padding: 0.4rem 0.8rem;
        cursor: pointer;
        margin-bottom: 0.3rem;
        border: 1px solid #eef2f8;
        transition: 0.2s;
        color: #1e2f3e;
        font-size: 0.75rem;
      }

      .game-item:hover,
      .trap-item:hover {
        background: #f8fafc;
        border-color: #2c7da0;
      }

      /* ----- کنترل‌های پخش (مثل آخربازی‌ها) ----- */
      .control-buttons {
        display: flex;
        gap: 0.3rem;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 0.6rem;
      }

      .btn-sm {
        background: #f4f7fb;
        border: none;
        padding: 0.3rem 0.7rem;
        border-radius: 30px;
        font-family: "Vazir";
        font-size: 0.65rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        color: #1e2f3e;
        display: inline-flex;
        align-items: center;
        gap: 0.2rem;
      }

      .btn-sm.primary {
        background: #2c7da0;
        color: white;
      }

      .btn-sm.primary:hover {
        background: #1f6392;
      }

      .btn-sm:hover {
        transform: translateY(-2px);
        background: #e2e8f0;
      }

      .move-counter {
        font-size: 0.7rem;
        background: #ffffff;
        padding: 0.1rem 0.6rem;
        border-radius: 30px;
        font-weight: 700;
        direction: ltr;
        color: #1e2f3e;
        border: 1px solid #eef2f5;
        display: inline-flex;
        align-items: center;
        min-width: 45px;
        justify-content: center;
      }

      /* ============================================
         📱 واکنش‌گرایی
         ============================================ */
      @media (max-width: 768px) {
        .openings-hero {
          padding: 1.2rem 1rem;
          min-height: 60px;
        }
        .openings-hero h1 {
          font-size: 1.3rem;
        }
        .toolbar {
          padding: 0.5rem 0.8rem;
          flex-direction: column;
          align-items: stretch;
        }
        .search-box {
          min-width: unset;
        }
        .filter-chips {
          justify-content: center;
        }
        .overlay-header {
          padding: 0.6rem 1rem;
        }
        .overlay-header h2 {
          font-size: 1rem;
        }
        .overlay-scroll {
          padding: 0.8rem;
        }
        .viewer-body {
          flex-direction: column;
          align-items: center;
        }
        .info-wrapper {
          width: 100%;
        }
        .pie-section {
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        .variants-grid {
          grid-template-columns: 1fr;
        }
        #chessboard {
          max-width: 100%;
        }
      }

      @media (max-width: 480px) {
        .openings-hero {
          padding: 1rem 0.8rem;
          min-height: 50px;
        }
        .openings-hero h1 {
          font-size: 1.1rem;
        }
        .openings-hero p {
          font-size: 0.7rem;
        }
        .card-header {
          padding: 0.4rem 0.6rem;
          font-size: 0.8rem;
        }
        .card-title {
          font-size: 0.8rem;
        }
        .card-header > span:not(.card-title) {
          font-size: 0.65rem;
        }
        .variant-item {
          padding: 0.3rem 0.5rem;
          font-size: 0.75rem;
        }
        .chip {
          font-size: 0.6rem;
          padding: 0.2rem 0.6rem;
        }
        .close-btn {
          font-size: 0.7rem;
          padding: 0.3rem 0.7rem;
        }
        .btn-sm {
          font-size: 0.55rem;
          padding: 0.2rem 0.5rem;
        }
        .move-counter {
          font-size: 0.6rem;
          padding: 0.1rem 0.4rem;
          min-width: 35px;
        }
        .info-card h4 {
          font-size: 0.8rem;
        }
        .info-list li {
          font-size: 0.7rem;
          padding: 0.3rem 0.5rem;
        }
        #chessboard {
          max-width: 100%;
        }
      }

      @media (max-width: 360px) {
        .openings-hero h1 {
          font-size: 0.95rem;
        }
        .card-title {
          font-size: 0.7rem;
        }
        .variant-item {
          font-size: 0.65rem;
        }
        .chip {
          font-size: 0.5rem;
          padding: 0.15rem 0.4rem;
        }
        .filter-chips {
          gap: 0.2rem;
        }
        #chessboard {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <div class="openings-hero">
        <h1><i class="fas fa-chess-board"></i> دانشنامه گشایش‌ها</h1>
        <p>تحلیل کامل هر شاخه، نمونه بازی‌ها و تله‌های معروف</p>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="جستجوی گشایش..." />
        </div>
        <div class="filter-chips" id="filterChips">
          <button class="chip active" data-filter="all">همه</button>
          <button class="chip" data-filter="e4">1.e4</button>
          <button class="chip" data-filter="d4">1.d4</button>
          <button class="chip" data-filter="c4">1.c4</button>
          <button class="chip" data-filter="Nf3">1.Nf3</button>
          <button class="chip" data-filter="other">سایر</button>
        </div>
      </div>

      <div id="openingsList" class="openings-list"></div>

      <div id="footer-placeholder"></div>
    </div>

    <!-- Overlay اصلی -->
    <div class="page-overlay" id="mainOverlay">
      <div class="overlay-header">
        <h2 id="overlayTitle">عنوان</h2>
        <button class="close-btn" id="backBtn">
          <i class="fas fa-arrow-right"></i> بازگشت
        </button>
      </div>
      <div class="overlay-scroll" id="overlayContent">
        <!-- محتوای dynamic در اینجا قرار می‌گیرد -->
      </div>
    </div>

    <script src="js/script.js"></script>
    <script>
      (function () {
        "use strict";

        // ============================================
        // 🎨 اعمال تم ذخیره‌شده
        // ============================================
        (function applySavedTheme() {
          try {
            const settings = JSON.parse(
              localStorage.getItem("chesshub_settings"),
            );
            if (settings && settings.theme) {
              document.body.className = document.body.className
                .split(" ")
                .filter((cls) => !cls.startsWith("theme-"))
                .join(" ");
              document.body.classList.add(`theme-${settings.theme}`);
            }
          } catch (e) {}
        })();

        // ============================================
        // 🖼️ بارگذاری تصاویر مهره‌ها
        // ============================================
        const pieceImages = {};
        const pieceCodes = {
          wK: "pieces/classic/wK.png",
          wQ: "pieces/classic/wQ.png",
          wR: "pieces/classic/wR.png",
          wB: "pieces/classic/wB.png",
          wN: "pieces/classic/wN.png",
          wP: "pieces/classic/wP.png",
          bK: "pieces/classic/bK.png",
          bQ: "pieces/classic/bQ.png",
          bR: "pieces/classic/bR.png",
          bB: "pieces/classic/bB.png",
          bN: "pieces/classic/bN.png",
          bP: "pieces/classic/bP.png",
        };

        function getCurrentPieceSet() {
          try {
            const settings = JSON.parse(
              localStorage.getItem("chesshub_settings"),
            );
            return settings?.pieceSet || "classic";
          } catch {
            return "classic";
          }
        }

        function loadPieces() {
          return new Promise((resolve) => {
            const set = getCurrentPieceSet();
            let loaded = 0,
              total = Object.keys(pieceCodes).length;
            for (const [key, filename] of Object.entries(pieceCodes)) {
              const img = new Image();
              img.onload = img.onerror = () => {
                loaded++;
                if (loaded === total) resolve();
              };
              img.src = `pieces/${set}/${filename}`;
              pieceImages[key] = img;
            }
          });
        }

        // ============================================
        // 🎨 رنگ‌های تخته از تم
        // ============================================
        function getBoardColors() {
          const root = document.documentElement;
          const light =
            getComputedStyle(root).getPropertyValue("--board-light").trim() ||
            "#f0d9b5";
          const dark =
            getComputedStyle(root).getPropertyValue("--board-dark").trim() ||
            "#b58863";
          return { light, dark };
        }

        // ============================================
        // 📂 مدیریت Overlay
        // ============================================
        const overlay = document.getElementById("mainOverlay");
        const overlayTitle = document.getElementById("overlayTitle");
        const overlayContent = document.getElementById("overlayContent");
        const backBtn = document.getElementById("backBtn");
        let viewStack = [];

        // ============================================
        // 🎨 رسم تخته با DOM (مثل آخربازی‌ها)
        // ============================================
        function renderBoardDOM(containerId, moves, moveIndex) {
          const container = document.getElementById(containerId);
          if (!container) return;

          const game = new Chess();
          for (let i = 0; i < moveIndex; i++) {
            game.move(moves[i], { sloppy: true });
          }
          const board = game.board();
          const colors = getBoardColors();
          const pieceSet = getCurrentPieceSet();

          container.innerHTML = "";
          container.style.display = "grid";
          container.style.gridTemplateColumns = "repeat(8, 1fr)";
          container.style.aspectRatio = "1 / 1";

          for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
              const piece = board[i][j];
              const isLight = (i + j) % 2 === 0;
              const squareDiv = document.createElement("div");
              squareDiv.className = `square ${isLight ? "light" : "dark"}`;

              if (piece) {
                const key =
                  (piece.color === "w" ? "w" : "b") + piece.type.toUpperCase();
                const img = document.createElement("img");
                img.src = `pieces/${pieceSet}/${pieceCodes[key]}`;
                img.classList.add("piece-img");
                img.draggable = false;
                img.style.pointerEvents = "none";
                squareDiv.appendChild(img);
              }
              container.appendChild(squareDiv);
            }
          }
        }

        // ============================================
        // 🎮 کنترل‌های پخش
        // ============================================
        let autoInterval = null;

        function stopAuto() {
          if (autoInterval) clearInterval(autoInterval);
          autoInterval = null;
        }

        let currentMoveIndex = 0;
        let currentTotalMoves = 0;
        let currentMoves = [];
        let currentBoardId = null;

        function setupControls(type, moves) {
          currentMoves = moves;
          currentMoveIndex = 0;
          currentTotalMoves = moves.length;
          currentBoardId = type + "Board";

          const counter = document.getElementById("moveCounter");
          if (counter) {
            counter.textContent = `0/${Math.ceil(currentTotalMoves / 2)}`;
          }

          const update = () => {
            renderBoardDOM(currentBoardId, currentMoves, currentMoveIndex);
            if (counter) {
              counter.textContent = `${Math.ceil(currentMoveIndex / 2)}/${Math.ceil(currentTotalMoves / 2)}`;
            }
          };

          window._first = () => {
            stopAuto();
            currentMoveIndex = 0;
            update();
          };
          window._prev = () => {
            stopAuto();
            if (currentMoveIndex > 0) currentMoveIndex--;
            update();
          };
          window._next = () => {
            stopAuto();
            if (currentMoveIndex < currentTotalMoves) currentMoveIndex++;
            update();
          };
          window._last = () => {
            stopAuto();
            currentMoveIndex = currentTotalMoves;
            update();
          };
          window._toggle = () => {
            const btn = document.getElementById("playPauseBtn");
            if (autoInterval) {
              stopAuto();
              if (btn) btn.innerHTML = '<i class="fas fa-play"></i> شروع';
            } else {
              if (btn) btn.innerHTML = '<i class="fas fa-pause"></i> توقف';
              autoInterval = setInterval(() => {
                if (currentMoveIndex < currentTotalMoves) {
                  currentMoveIndex++;
                  update();
                } else {
                  stopAuto();
                  if (btn) btn.innerHTML = '<i class="fas fa-play"></i> شروع';
                }
              }, 1200);
            }
          };

          update();
        }

        // ============================================
        // 🥧 رسم نمودار دایره‌ای
        // ============================================
        function drawPieChart(stats) {
          const pieCanvas = document.getElementById("pieChart");
          if (!pieCanvas) return;
          const ctx = pieCanvas.getContext("2d");
          const w = pieCanvas.width,
            h = pieCanvas.height;
          ctx.clearRect(0, 0, w, h);

          const total = stats.whiteWins + stats.blackWins + stats.draws;
          if (total === 0) {
            ctx.fillStyle = "#94a3b8";
            ctx.font = "12px Vazir";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("داده‌ای موجود نیست", w / 2, h / 2);
            return;
          }

          const data = [
            { value: stats.whiteWins, color: "#e2e8f0" },
            { value: stats.blackWins, color: "#1e293b" },
            { value: stats.draws, color: "#64748b" },
          ];

          let startAngle = -Math.PI / 2;
          const cx = w / 2,
            cy = h / 2,
            r = Math.min(w, h) / 2 - 4;

          data.forEach((slice) => {
            const sliceAngle = (slice.value / total) * 2 * Math.PI;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, startAngle, startAngle + sliceAngle);
            ctx.closePath();
            ctx.fillStyle = slice.color;
            ctx.fill();
            startAngle += sliceAngle;
          });

          ctx.beginPath();
          ctx.arc(cx, cy, r * 0.55, 0, 2 * Math.PI);
          ctx.strokeStyle = "rgba(255,255,255,0.3)";
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(cx, cy, r * 0.45, 0, 2 * Math.PI);
          ctx.fillStyle = "rgba(255,255,255,0.15)";
          ctx.fill();

          ctx.fillStyle = "#1e293b";
          ctx.font = "bold 14px Vazir";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(`${total}`, cx, cy);
        }

        // ============================================
        // 🔄 تابع رندر View
        // ============================================
        function renderCurrentView() {
          if (viewStack.length === 0) return;
          const current = viewStack[viewStack.length - 1];
          overlayTitle.innerHTML = current.title;
          overlayContent.innerHTML = current.html;
          overlayContent.scrollTop = 0;

          if (current.type === "variant") {
            const boardId = "variantBoard";
            // تخته قبلاً در html تعریف شده، renderBoardDOM بعداً صدا زده می‌شود
            setupControls("variant", current.variant.moves);
            setTimeout(() => drawPieChart(current.variant.stats), 100);
          } else if (current.type === "game") {
            const game = new Chess();
            try {
              game.load_pgn(current.game.pgn);
              const moves = game.history();
              setupControls("game", moves);
            } catch (e) {
              console.error("Error loading PGN:", e);
            }
          } else if (current.type === "trap") {
            setupControls("trap", current.trap.moves);
          }
        }

        // ============================================
        // 📂 توابع مدیریت Stack
        // ============================================
        function pushView(view) {
          viewStack.push(view);
          renderCurrentView();
          overlay.classList.add("open");
          document.body.style.overflow = "hidden";
        }

        function popView() {
          if (viewStack.length > 1) {
            viewStack.pop();
            renderCurrentView();
          } else {
            viewStack = [];
            overlay.classList.remove("open");
            document.body.style.overflow = "";
            stopAuto();
          }
        }

        backBtn.addEventListener("click", popView);

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") popView();
        });

        // 🔥 گوش‌دادن به تغییرات تم
        document.addEventListener("themeChanged", function () {
          if (overlay.classList.contains("open") && viewStack.length > 0) {
            // به‌روزرسانی تخته با رنگ‌های جدید
            const current = viewStack[viewStack.length - 1];
            if (
              current.type === "variant" ||
              current.type === "game" ||
              current.type === "trap"
            ) {
              const boardId = current.type + "Board";
              const boardEl = document.getElementById(boardId);
              if (boardEl) {
                // بازسازی تخته با رنگ‌های جدید
                const moves =
                  current.type === "variant"
                    ? current.variant.moves
                    : current.type === "game"
                      ? current._gameMoves || []
                      : current.trap.moves;
                const idx = currentMoveIndex || 0;
                renderBoardDOM(boardId, moves, idx);
              }
            }
          }
        });

        document.addEventListener("pieceSetChanged", function () {
          if (overlay.classList.contains("open") && viewStack.length > 0) {
            const current = viewStack[viewStack.length - 1];
            if (
              current.type === "variant" ||
              current.type === "game" ||
              current.type === "trap"
            ) {
              const boardId = current.type + "Board";
              const boardEl = document.getElementById(boardId);
              if (boardEl) {
                const moves =
                  current.type === "variant"
                    ? current.variant.moves
                    : current.type === "game"
                      ? current._gameMoves || []
                      : current.trap.moves;
                const idx = currentMoveIndex || 0;
                renderBoardDOM(boardId, moves, idx);
              }
            }
          }
        });

        // ============================================
        // 📂 توابع باز کردن Views
        // ============================================
        function openVariantView(variant, openingName) {
          const stats = variant.stats || {
            whiteWins: 0,
            blackWins: 0,
            draws: 0,
          };

          const view = {
            type: "variant",
            title: `${openingName} – ${variant.name}`,
            variant: variant,
            html: `
          <div class="viewer-body">
            <div class="board-wrapper">
              <div id="variantBoard" class="chessboard"></div>
              <div class="control-buttons">
                <button class="btn-sm" onclick="window._first()"><i class="fas fa-fast-backward"></i></button>
                <button class="btn-sm" onclick="window._prev()"><i class="fas fa-step-backward"></i></button>
                <button class="btn-sm primary" id="playPauseBtn" onclick="window._toggle()"><i class="fas fa-play"></i> شروع</button>
                <button class="btn-sm" onclick="window._next()"><i class="fas fa-step-forward"></i></button>
                <button class="btn-sm" onclick="window._last()"><i class="fas fa-fast-forward"></i></button>
                <span class="move-counter" id="moveCounter">0/0</span>
              </div>
            </div>
            <div class="info-wrapper">
              <div class="pie-section">
                <canvas id="pieChart" width="100" height="100"></canvas>
                <div class="legend">
                  <span><span class="dot" style="background:#e2e8f0;"></span> برد سفید: ${stats.whiteWins}%</span>
                  <span><span class="dot" style="background:#1e293b;"></span> برد سیاه: ${stats.blackWins}%</span>
                  <span><span class="dot" style="background:#64748b;"></span> مساوی: ${stats.draws}%</span>
                </div>
              </div>
              <div class="info-card"><h4>💪 نقاط قوت</h4><ul class="info-list">${(variant.strengths || []).map((s) => `<li><i class="fas fa-check-circle" style="color:#166534;"></i> ${s}</li>`).join("")}</ul></div>
              <div class="info-card"><h4>⚠️ نقاط ضعف</h4><ul class="info-list">${(variant.weaknesses || []).map((w) => `<li><i class="fas fa-times-circle" style="color:#991b1b;"></i> ${w}</li>`).join("")}</ul></div>
              <div class="info-card"><h4>📈 حرکات پرتکرار</h4>${(variant.popularMoves || []).map((pm) => `<div class="popular-move"><span>${pm.san} – ${pm.description}</span><span class="move-san">${pm.moves.join(" ")}</span></div>`).join("") || "<p style='color:#5f7f9e;'>حرکتی ثبت نشده است.</p>"}</div>
              <div class="info-card"><h4>📊 ارزیابی پوزیسیون</h4><p>${variant.evaluation?.summary || "ارزیابی موجود نیست"} <strong>(${variant.evaluation?.score || "0.0"})</strong></p></div>
              <div class="info-card"><h4>💡 ایده‌ها و طرح‌ها</h4><ul class="info-list">${(variant.ideas || []).map((i) => `<li>🔹 ${i}</li>`).join("") || "<li>طرحی ثبت نشده است.</li>"}</ul></div>
              <div class="info-card"><h4>🏁 آخر بازی‌های احتمالی</h4><ul class="info-list">${(variant.endgames || []).map((e) => `<li>♟️ ${e}</li>`).join("") || "<li>آخر بازی ثبت نشده است.</li>"}</ul></div>
              <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                <button class="btn-sm primary" onclick="window._openGamesList()"><i class="fas fa-list"></i> نمونه بازی‌ها (${(variant.sampleGames || []).length})</button>
                <button class="btn-sm primary" onclick="window._openTrapsList()"><i class="fas fa-fish"></i> تله‌ها (${(variant.traps || []).length})</button>
                <button class="btn-sm" onclick="alert('📥 دانلود تحلیل به زودی اضافه می‌شود.')"><i class="fas fa-download"></i> دانلود تحلیل</button>
              </div>
            </div>
          </div>
        `,
          };

          pushView(view);

          window._openGamesList = () =>
            openGamesListView(
              variant.sampleGames || [],
              `${openingName} – ${variant.name}`,
            );
          window._openTrapsList = () =>
            openTrapsListView(
              variant.traps || [],
              `${openingName} – ${variant.name}`,
            );
        }

        function openGamesListView(games, parentTitle) {
          const view = {
            type: "gamesList",
            title: `نمونه بازی‌های ${parentTitle}`,
            html: `
          <div class="info-card" style="max-width:600px; margin:0 auto;">
            ${games.length === 0 ? "<p style='color:#5f7f9e;'>نمونه بازی‌ای ثبت نشده است.</p>" : ""}
            ${games
              .map(
                (g, i) => `
                <div class="game-item" onclick="window._openGameView(${i})">
                  <span>♜ ${g.white} vs ${g.black} (${g.year}) – ${g.result}</span>
                  <i class="fas fa-chevron-left"></i>
                </div>
              `,
              )
              .join("")}
          </div>
        `,
          };
          pushView(view);
          window._openGameView = (index) =>
            openGameView(games[index], parentTitle);
        }

        function openGameView(game, parentTitle) {
          const view = {
            type: "game",
            title: `${game.white} vs ${game.black}`,
            game: game,
            html: `
          <div class="viewer-body">
            <div class="board-wrapper">
              <div id="gameBoard" class="chessboard"></div>
              <div class="control-buttons">
                <button class="btn-sm" onclick="window._first()"><i class="fas fa-fast-backward"></i></button>
                <button class="btn-sm" onclick="window._prev()"><i class="fas fa-step-backward"></i></button>
                <button class="btn-sm primary" id="playPauseBtn" onclick="window._toggle()"><i class="fas fa-play"></i> شروع</button>
                <button class="btn-sm" onclick="window._next()"><i class="fas fa-step-forward"></i></button>
                <button class="btn-sm" onclick="window._last()"><i class="fas fa-fast-forward"></i></button>
                <span class="move-counter" id="moveCounter">0/0</span>
              </div>
            </div>
            <div class="info-wrapper">
              <div class="info-card">
                <p><strong>سفید:</strong> ${game.white} | <strong>سیاه:</strong> ${game.black}</p>
                <p><strong>سال:</strong> ${game.year} | <strong>نتیجه:</strong> ${game.result}</p>
              </div>
            </div>
          </div>
        `,
          };
          pushView(view);
        }

        function openTrapsListView(traps, parentTitle) {
          const view = {
            type: "trapsList",
            title: `تله‌های ${parentTitle}`,
            html: `
          <div class="info-card" style="max-width:600px; margin:0 auto;">
            ${traps.length === 0 ? "<p style='color:#5f7f9e;'>تله‌ای ثبت نشده است.</p>" : ""}
            ${traps
              .map(
                (t, i) => `
                <div class="trap-item" onclick="window._openTrapView(${i})">
                  <span>⚠️ ${t.name || "تله " + (i + 1)}</span>
                  <i class="fas fa-chevron-left"></i>
                </div>
              `,
              )
              .join("")}
          </div>
        `,
          };
          pushView(view);
          window._openTrapView = (index) =>
            openTrapView(traps[index], parentTitle);
        }

        function openTrapView(trap, parentTitle) {
          const view = {
            type: "trap",
            title: trap.name || "تله",
            trap: trap,
            html: `
          <div class="viewer-body">
            <div class="board-wrapper">
              <div id="trapBoard" class="chessboard"></div>
              <div class="control-buttons">
                <button class="btn-sm" onclick="window._first()"><i class="fas fa-fast-backward"></i></button>
                <button class="btn-sm" onclick="window._prev()"><i class="fas fa-step-backward"></i></button>
                <button class="btn-sm primary" id="playPauseBtn" onclick="window._toggle()"><i class="fas fa-play"></i> شروع</button>
                <button class="btn-sm" onclick="window._next()"><i class="fas fa-step-forward"></i></button>
                <button class="btn-sm" onclick="window._last()"><i class="fas fa-fast-forward"></i></button>
                <span class="move-counter" id="moveCounter">0/0</span>
              </div>
            </div>
            <div class="info-wrapper">
              <div class="info-card">
                <p><strong>توضیح:</strong> ${trap.description || "توضیحی ثبت نشده است."}</p>
              </div>
            </div>
          </div>
        `,
          };
          pushView(view);
        }

        // ============================================
        // 📋 رندر لیست گشایش‌ها
        // ============================================
        let openingsData = { categories: [] };
        let currentFilter = "all";

        async function loadOpeningsJSON() {
          try {
            const res = await fetch("data/openings.json");
            if (!res.ok) throw new Error("HTTP " + res.status);
            openingsData = await res.json();
            renderList();
          } catch (err) {
            document.getElementById("openingsList").innerHTML = `
          <div style="text-align:center;padding:2rem;color:#5f7f9e;">
            ❌ خطا در بارگذاری دیتابیس گشایش‌ها.
          </div>
        `;
            console.error(err);
          }
        }

        function renderList() {
          const container = document.getElementById("openingsList");
          let categories = openingsData.categories || [];

          const query =
            document
              .getElementById("searchInput")
              ?.value.trim()
              .toLowerCase() || "";

          if (currentFilter !== "all") {
            categories = categories.filter((c) => c.code === currentFilter);
          }

          if (query) {
            categories = categories
              .map((cat) => ({
                ...cat,
                openings: cat.openings.filter(
                  (op) =>
                    op.name.toLowerCase().includes(query) ||
                    (op.variants &&
                      op.variants.some((v) =>
                        v.name.toLowerCase().includes(query),
                      )),
                ),
              }))
              .filter((cat) => cat.openings.length > 0);
          }

          if (!categories.length) {
            container.innerHTML = `
          <div style="text-align:center;padding:2rem;color:#5f7f9e;">
            🔍 گشایشی با این مشخصات یافت نشد.
          </div>
        `;
            return;
          }

          container.innerHTML = "";
          categories.forEach((cat) => {
            cat.openings.forEach((opening) => {
              const card = document.createElement("div");
              card.className = "opening-card";

              const movesDisplay = opening.moves
                ? opening.moves.join(" ")
                : "...";

              card.innerHTML = `
            <div class="card-header">
              <div class="card-title"><i class="fas fa-chess-queen"></i> ${opening.name}</div>
              <span>${movesDisplay}</span>
              <i class="fas fa-chevron-down"></i>
            </div>
            <div class="card-body">
              ${
                opening.variants && opening.variants.length
                  ? `<div class="variants-grid">${opening.variants
                      .map(
                        (v) => `
                          <div class="variant-item" data-name="${v.name}">
                            <span>🔸 ${v.name}</span>
                            <span>${v.moves.slice(0, 2).join(" ")}..</span>
                          </div>
                        `,
                      )
                      .join("")}</div>`
                  : '<div style="padding:1rem;color:#5f7f9e;">بدون واریانت</div>'
              }
            </div>
          `;

              container.appendChild(card);

              const header = card.querySelector(".card-header");
              const body = card.querySelector(".card-body");
              const chevron = header.querySelector(".fa-chevron-down");

              header.addEventListener("click", (e) => {
                if (e.target.closest(".variant-item")) return;
                body.classList.toggle("open");
                chevron.style.transform = body.classList.contains("open")
                  ? "rotate(180deg)"
                  : "rotate(0)";
              });

              card.querySelectorAll(".variant-item").forEach((item) => {
                item.addEventListener("click", (e) => {
                  e.stopPropagation();
                  const variant = opening.variants.find(
                    (v) => v.name === item.dataset.name,
                  );
                  if (variant) openVariantView(variant, opening.name);
                });
              });
            });
          });
        }

        // ============================================
        // 🎛️ رویدادها
        // ============================================
        document
          .getElementById("searchInput")
          .addEventListener("input", renderList);

        document.querySelectorAll(".chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            document
              .querySelectorAll(".chip")
              .forEach((c) => c.classList.remove("active"));
            chip.classList.add("active");
            currentFilter = chip.dataset.filter;
            renderList();
          });
        });

        // ============================================
        // 🚀 راه‌اندازی
        // ============================================
        loadPieces().then(() => {
          loadOpeningsJSON();
          console.log("✅ ChessHub Openings loaded successfully");
        });
      })();
    </script>
  </body>
</html>
