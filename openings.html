<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="دانشنامه گشایش‌های شطرنج" />
    <title>ChessHub | گشایش‌ها</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/openings.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <section class="app-hero">
        <h1><i class="fas fa-chess-board"></i> دانشنامه گشایش‌ها</h1>
        <p>تحلیل کامل محبوب‌ترین گشایش‌های شطرنج با واریانت‌ها و تله‌ها</p>
      </section>

      <div class="openings-toolbar">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="جستجوی گشایش..." />
        </div>
        <div class="filter-chips" id="filterChips">
          <button class="chip active" data-filter="all">همه</button>
          <button class="chip" data-filter="king-pawn">پیاده شاه</button>
          <button class="chip" data-filter="queen-pawn">پیاده وزیر</button>
          <button class="chip" data-filter="indian">دفاع‌های هندی</button>
          <button class="chip" data-filter="closed">بسته</button>
        </div>
      </div>

      <div id="openingsList" class="openings-list"></div>

      <div id="footer-placeholder"></div>
    </div>

    <div class="page-overlay" id="mainOverlay">
      <div class="overlay-header">
        <h2 id="overlayTitle"><i class="fas fa-chess-queen"></i> گشایش</h2>
        <button class="close-btn" id="backBtn">
          <i class="fas fa-arrow-right"></i> بازگشت
        </button>
      </div>
      <div class="overlay-scroll" id="overlayContent"></div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/openings.js"></script>
  </body>
</html>
