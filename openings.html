<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ChessHub | دانشنامه گشایش‌ها</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
      /* ============================================
       🎯 استایل‌های اختصاصی گشایش‌ها
       ============================================ */

      /* بنر یکدست با کلاس hero-section */
      .hero-section {
        padding: 1.8rem 1.5rem !important;
        min-height: 110px !important;
        margin-bottom: 1.5rem !important;
      }
      .hero-section h1 {
        font-size: clamp(1.6rem, 3.5vw, 2.2rem) !important;
      }
      .hero-section p {
        font-size: clamp(0.9rem, 1.4vw, 1rem) !important;
      }

      /* نوار ابزار */
      .openings-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        align-items: center;
        background: var(--bg-card, #ffffff);
        border-radius: var(--radius-md);
        padding: 0.6rem 1rem;
        margin-bottom: 1.5rem;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color, #eef2f5);
        transition:
          background 0.3s,
          border-color 0.3s;
      }

      .openings-toolbar .search-box {
        flex: 2;
        min-width: 160px;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--secondary);
        border-radius: 40px;
        padding: 0.1rem 1rem;
        border: 1px solid var(--border-color, transparent);
        transition:
          background 0.3s,
          border-color 0.3s;
      }
      .openings-toolbar .search-box i {
        color: var(--text-secondary, #94a3b8);
        font-size: 0.8rem;
      }
      .openings-toolbar .search-box input {
        width: 100%;
        border: none;
        background: transparent;
        padding: 0.5rem 0;
        font-family: "Vazir";
        font-size: 0.8rem;
        outline: none;
        color: var(--text-dark);
      }
      .openings-toolbar .search-box input::placeholder {
        color: var(--text-secondary, #94a3b8);
      }

      .openings-toolbar .filter-chips {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
      }
      .openings-toolbar .chip {
        background: var(--secondary);
        border: none;
        padding: 0.3rem 0.8rem;
        border-radius: 40px;
        font-family: "Vazir";
        font-size: 0.7rem;
        font-weight: 500;
        cursor: pointer;
        transition: 0.2s;
        color: var(--text-dark);
      }
      .openings-toolbar .chip.active {
        background: var(--primary);
        color: white;
      }
      .openings-toolbar .chip:hover:not(.active) {
        background: var(--border-color, #dde4ec);
      }

      /* لیست گشایش‌ها */
      .openings-list {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        margin-bottom: 2rem;
      }

      /* کارت گشایش */
      .opening-card {
        background: var(--bg-card, #ffffff);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        border: 1px solid var(--border-color, #eef2f5);
        transition:
          box-shadow 0.3s,
          border-color 0.3s;
      }
      .opening-card:hover {
        border-color: var(--primary);
        box-shadow: var(--shadow-md);
      }

      /* ========== هدر کارت با اولویت نام فارسی ========== */
      .card-header {
        padding: 0.6rem 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        border-bottom: 1px solid var(--border-color, #eef2f5);
        gap: 0.6rem;
        user-select: none;
        transition:
          background 0.2s,
          flex-wrap 0.2s;
        flex-wrap: nowrap; /* در حالت بسته یک خط */
        min-width: 0;
      }
      .card-header:hover {
        background: var(--secondary);
      }

      /* ===== وقتی کارت باز است، هدر می‌تواند چندخط شود ===== */
      .card-header.expanded {
        flex-wrap: wrap; /* اجازه چندخطی */
        gap: 0.3rem 0.6rem;
      }

      /* بخش نام فارسی (اولویت) */
      .card-title {
        font-weight: 700;
        color: var(--text-dark);
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.95rem;
        flex-shrink: 0; /* نام فارسی هرگز کوچک نمی‌شود و کامل می‌ماند */
        white-space: nowrap; /* در حالت بسته یک خط */
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
        min-width: 0;
      }
      .card-header.expanded .card-title {
        white-space: normal; /* در حالت باز چندخطی */
        overflow: visible;
        text-overflow: unset;
        flex-shrink: 0;
      }
      .card-title i {
        color: var(--primary);
        flex-shrink: 0;
      }
      .card-title span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        display: inline-block;
        max-width: 100%;
      }
      .card-header.expanded .card-title span {
        white-space: normal;
        overflow: visible;
        text-overflow: unset;
      }

      /* بخش حرکات (لاتین – چپ به راست) */
      .card-moves {
        font-family: monospace;
        direction: ltr; /* چپ به راست */
        color: var(--text-secondary);
        font-size: 0.75rem;
        flex-shrink: 1; /* حرکات می‌توانند کوچک شوند تا نام کامل بماند */
        min-width: 30px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: left;
        max-width: 60%; /* حداکثر ۶۰٪ عرض برای حرکات */
      }
      .card-header.expanded .card-moves {
        white-space: normal; /* در حالت باز چندخطی */
        overflow: visible;
        text-overflow: unset;
        max-width: 100%;
        flex-shrink: 0;
      }

      /* آیکون چرخان (chevron) */
      .card-header .chevron {
        color: var(--text-secondary);
        transition: transform 0.3s ease;
        font-size: 0.8rem;
        flex-shrink: 0;
        margin-right: auto; /* چپ‌چین شدن در راست‌چین */
      }
      .card-header .chevron.open {
        transform: rotate(180deg);
      }

      /* ===== بدنه کارت ===== */
      .card-body {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.35s ease;
        background: var(--secondary, #fafcff);
      }
      .card-body.open {
        max-height: 400px;
        overflow-y: auto;
        padding: 0.8rem;
      }
      .card-body::-webkit-scrollbar {
        width: 4px;
      }
      .card-body::-webkit-scrollbar-track {
        background: var(--secondary);
        border-radius: 10px;
      }
      .card-body::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 10px;
      }

      .variants-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 0.6rem;
      }

      /* ===== هر واریانت هم یک خطی ===== */
      .variant-item {
        background: var(--bg-card, #ffffff);
        border-radius: 14px;
        padding: 0.4rem 0.8rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        border: 1px solid var(--border-color, #eef2f8);
        transition: 0.2s;
        color: var(--text-dark);
        font-size: 0.8rem;
        gap: 0.3rem;
        min-width: 0;
      }
      .variant-item:hover {
        background: var(--secondary);
        transform: translateX(-4px);
        border-color: var(--primary);
      }

      .variant-item > span:first-child {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-shrink: 1;
        min-width: 0;
      }
      .variant-item .variant-moves-preview {
        font-family: monospace;
        font-size: 0.7rem;
        color: var(--text-secondary);
        direction: ltr;
        flex-shrink: 0;
        white-space: nowrap;
      }

      .no-result {
        text-align: center;
        padding: 2.5rem;
        color: var(--text-secondary);
        font-size: 0.9rem;
        grid-column: 1 / -1;
      }

      /* ============================================
       📂 Overlay (تمام‌صفحه)
       ============================================ */
      .page-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100dvh;
        background: var(--bg-primary, #f0f4f8);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        box-shadow: -8px 0 40px rgba(0, 0, 0, 0.1);
        direction: rtl;
      }
      .page-overlay.open {
        transform: translateX(0);
      }

      .overlay-header {
        flex-shrink: 0;
        background: var(--bg-card, rgba(240, 244, 248, 0.92));
        backdrop-filter: blur(10px);
        padding: 0.8rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      }
      .overlay-header h2 {
        font-size: 1.1rem;
        color: var(--primary);
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 70%;
      }
      .overlay-header .close-btn {
        background: var(--secondary);
        border: none;
        padding: 0.4rem 1rem;
        border-radius: 40px;
        font-family: "Vazir";
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--text-dark);
        font-size: 0.8rem;
        flex-shrink: 0;
      }
      .overlay-header .close-btn:hover {
        background: var(--primary);
        color: white;
        transform: scale(0.96);
      }

      .overlay-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 1.2rem;
      }
      .overlay-scroll::-webkit-scrollbar {
        width: 5px;
      }
      .overlay-scroll::-webkit-scrollbar-track {
        background: var(--secondary);
        border-radius: 10px;
      }
      .overlay-scroll::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 10px;
      }

      /* نمایشگر تخته و اطلاعات */
      .viewer-body {
        display: flex;
        flex-wrap: wrap;
        gap: 1.2rem;
        justify-content: center;
        align-items: flex-start;
      }
      .board-wrapper {
        flex: 1 1 280px;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #chessboard {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        aspect-ratio: 1 / 1;
        width: 100%;
        max-width: 450px;
        border: 2px solid var(--border-color, #cbd5e1);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: var(--shadow-md);
        touch-action: none;
        user-select: none;
      }
      .square {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: default;
        touch-action: none;
      }
      .square.light {
        background-color: var(--board-light, #f0d9b5);
      }
      .square.dark {
        background-color: var(--board-dark, #b58863);
      }
      .piece-img {
        width: 100%;
        height: 100%;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
        draggable: false;
      }

      .control-buttons {
        display: flex;
        gap: 0.3rem;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 0.6rem;
      }
      .btn-sm {
        background: var(--secondary);
        border: none;
        padding: 0.3rem 0.7rem;
        border-radius: 30px;
        font-family: "Vazir";
        font-size: 0.65rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        color: var(--text-dark);
        display: inline-flex;
        align-items: center;
        gap: 0.2rem;
      }
      .btn-sm.primary {
        background: var(--primary);
        color: white;
      }
      .btn-sm.primary:hover {
        background: var(--primary-dark);
      }
      .btn-sm:hover {
        transform: translateY(-2px);
        background: var(--border-color, #e2e8f0);
      }
      .move-counter {
        font-size: 0.7rem;
        background: var(--bg-card, #ffffff);
        padding: 0.1rem 0.6rem;
        border-radius: 30px;
        font-weight: 700;
        direction: ltr;
        color: var(--text-dark);
        border: 1px solid var(--border-color, #eef2f5);
        display: inline-flex;
        align-items: center;
        min-width: 45px;
        justify-content: center;
      }

      .info-wrapper {
        flex: 1.5 1 280px;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      .info-card {
        background: var(--bg-card, #ffffff);
        border-radius: var(--radius-sm);
        padding: 0.8rem;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color, #eef2f5);
      }
      .info-card h4 {
        font-size: 0.85rem;
        color: var(--primary);
        border-right: 4px solid var(--primary);
        padding-right: 8px;
        margin-bottom: 0.5rem;
      }
      .info-list {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      .info-list li {
        background: var(--secondary);
        border-radius: 10px;
        padding: 0.3rem 0.6rem;
        font-size: 0.75rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--text-dark);
      }
      .popular-move {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--secondary);
        border-radius: 10px;
        padding: 0.3rem 0.6rem;
        margin-bottom: 0.3rem;
        font-size: 0.75rem;
        color: var(--text-dark);
        gap: 0.3rem;
      }
      .popular-move .move-san {
        font-family: monospace;
        direction: ltr;
        font-weight: 700;
        background: var(--bg-card, white);
        padding: 0.1rem 0.5rem;
        border-radius: 16px;
        font-size: 0.7rem;
        flex-shrink: 0;
      }
      .pie-section {
        background: var(--bg-card, #ffffff);
        border-radius: var(--radius-sm);
        padding: 0.8rem;
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        border: 1px solid var(--border-color, #eef2f5);
      }
      .pie-section .legend {
        font-size: 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        color: var(--text-dark);
      }
      .pie-section .legend .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
        margin-left: 4px;
      }

      .game-item,
      .trap-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--secondary);
        border-radius: 12px;
        padding: 0.4rem 0.8rem;
        cursor: pointer;
        margin-bottom: 0.3rem;
        border: 1px solid var(--border-color, #eef2f8);
        transition: 0.2s;
        color: var(--text-dark);
        font-size: 0.75rem;
        gap: 0.3rem;
      }
      .game-item:hover,
      .trap-item:hover {
        background: var(--bg-card);
        border-color: var(--primary);
      }
      .game-item span,
      .trap-item span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ============================================
       📱 واکنش‌گرایی
       ============================================ */
      @media (max-width: 768px) {
        .hero-section {
          padding: 1.2rem 1rem !important;
          min-height: 80px !important;
        }
        .hero-section h1 {
          font-size: 1.4rem !important;
        }
        .openings-toolbar {
          flex-direction: column;
          align-items: stretch;
          padding: 0.6rem;
        }
        .openings-toolbar .search-box {
          min-width: unset;
        }
        .filter-chips {
          justify-content: center;
        }
        .variants-grid {
          grid-template-columns: 1fr;
        }
        .overlay-header {
          padding: 0.6rem 1rem;
        }
        .overlay-header h2 {
          font-size: 1rem;
          max-width: 60%;
        }
        .overlay-scroll {
          padding: 0.8rem;
        }
        .viewer-body {
          flex-direction: column;
          align-items: center;
        }
        .info-wrapper {
          width: 100%;
        }
        #chessboard {
          max-width: 100%;
        }
        .card-header {
          padding: 0.5rem 0.6rem;
        }
        .card-title {
          font-size: 0.85rem;
        }
        .card-moves {
          font-size: 0.65rem;
          max-width: 50%;
        }
      }

      @media (max-width: 480px) {
        .hero-section {
          padding: 0.8rem 0.6rem !important;
          min-height: 60px !important;
        }
        .hero-section h1 {
          font-size: 1.1rem !important;
        }
        .hero-section p {
          font-size: 0.7rem !important;
        }
        .card-header {
          padding: 0.4rem 0.5rem;
          gap: 0.3rem;
        }
        .card-title {
          font-size: 0.75rem;
          gap: 0.2rem;
        }
        .card-title i {
          font-size: 0.8rem;
        }
        .card-moves {
          font-size: 0.55rem;
          max-width: 40%;
        }
        .card-header .chevron {
          font-size: 0.7rem;
        }
        .variant-item {
          font-size: 0.7rem;
          padding: 0.3rem 0.4rem;
        }
        .chip {
          font-size: 0.55rem;
          padding: 0.15rem 0.5rem;
        }
        .close-btn {
          font-size: 0.65rem;
          padding: 0.25rem 0.6rem;
        }
        .btn-sm {
          font-size: 0.5rem;
          padding: 0.15rem 0.4rem;
        }
        .move-counter {
          font-size: 0.55rem;
          padding: 0.05rem 0.3rem;
          min-width: 30px;
        }
        .info-card h4 {
          font-size: 0.75rem;
        }
        .info-list li {
          font-size: 0.65rem;
          padding: 0.2rem 0.4rem;
        }
        #chessboard {
          max-width: 100%;
        }
        .overlay-header h2 {
          font-size: 0.85rem;
          max-width: 55%;
        }
      }

      @media (max-width: 360px) {
        .hero-section h1 {
          font-size: 0.95rem !important;
        }
        .card-title {
          font-size: 0.7rem;
        }
        .card-moves {
          font-size: 0.5rem;
          max-width: 35%;
        }
        .variant-item {
          font-size: 0.6rem;
        }
        .chip {
          font-size: 0.5rem;
          padding: 0.1rem 0.4rem;
        }
        .filter-chips {
          gap: 0.15rem;
        }
        #chessboard {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <!-- بنر یکدست با کلاس hero-section -->
      <section class="hero-section">
        <h1>
          <span class="highlight"><i class="fas fa-chess-board"></i></span>
          <span class="highlight">دانشنامه</span> گشایش‌ها
        </h1>
        <p>تحلیل کامل هر شاخه، نمونه بازی‌ها و تله‌های معروف</p>
      </section>

      <!-- نوار ابزار -->
      <div class="openings-toolbar">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="جستجوی گشایش..." />
        </div>
        <div class="filter-chips" id="filterChips">
          <button class="chip active" data-filter="all">همه</button>
          <button class="chip" data-filter="e4">1.e4</button>
          <button class="chip" data-filter="d4">1.d4</button>
          <button class="chip" data-filter="c4">1.c4</button>
          <button class="chip" data-filter="Nf3">1.Nf3</button>
          <button class="chip" data-filter="other">سایر</button>
        </div>
      </div>

      <!-- لیست گشایش‌ها -->
      <div id="openingsList" class="openings-list"></div>

      <div id="footer-placeholder"></div>
    </div>

    <!-- ============================================
     📂 Overlay (تمام‌صفحه) برای نمایش واریانت
     ============================================ -->
    <div class="page-overlay" id="mainOverlay">
      <div class="overlay-header">
        <h2 id="overlayTitle">عنوان</h2>
        <button class="close-btn" id="backBtn">
          <i class="fas fa-arrow-right"></i> بازگشت
        </button>
      </div>
      <div class="overlay-scroll" id="overlayContent">
        <!-- محتوای داینامیک -->
      </div>
    </div>

    <script src="js/script.js"></script>
    <script>
      (function () {
        "use strict";

        // ============================================
        // 🎨 اعمال تم
        // ============================================
        (function applySavedTheme() {
          try {
            const settings = JSON.parse(
              localStorage.getItem("chesshub_settings"),
            );
            if (settings && settings.theme) {
              document.body.className = document.body.className
                .split(" ")
                .filter((c) => !c.startsWith("theme-"))
                .join(" ");
              document.body.classList.add(`theme-${settings.theme}`);
            }
          } catch (e) {}
        })();

        // ============================================
        // 📦 توابع کمکی مهره‌ها
        // ============================================
        const pieceCodes = {
          wk: "wk.png",
          wq: "wq.png",
          wr: "wr.png",
          wb: "wb.png",
          wn: "wn.png",
          wp: "wp.png",
          bk: "bk.png",
          bq: "bq.png",
          br: "br.png",
          bb: "bb.png",
          bn: "bn.png",
          bp: "bp.png",
        };
        let pieceImages = {};
        let piecesLoaded = false;

        function getCurrentPieceSet() {
          try {
            const s = JSON.parse(localStorage.getItem("chesshub_settings"));
            return s?.pieceSet || "neo";
          } catch {
            return "neo";
          }
        }

        function loadPieces() {
          if (piecesLoaded) return Promise.resolve();
          return new Promise((resolve) => {
            const set = getCurrentPieceSet();
            let loaded = 0,
              total = Object.keys(pieceCodes).length;
            for (const [key, filename] of Object.entries(pieceCodes)) {
              const img = new Image();
              img.onload = img.onerror = () => {
                loaded++;
                if (loaded === total) {
                  piecesLoaded = true;
                  resolve();
                }
              };
              img.src = `pieces/${set}/${filename}`;
              pieceImages[key] = img;
            }
          });
        }

        function getBoardColors() {
          const root = document.documentElement;
          const light =
            getComputedStyle(root).getPropertyValue("--board-light").trim() ||
            "#f0d9b5";
          const dark =
            getComputedStyle(root).getPropertyValue("--board-dark").trim() ||
            "#b58863";
          return { light, dark };
        }

        // ============================================
        // 🎨 رندر تخته در Overlay
        // ============================================
        function renderBoardDOM(containerId, moves, moveIndex) {
          const container = document.getElementById(containerId);
          if (!container) return;
          const game = new Chess();
          for (let i = 0; i < moveIndex; i++) {
            game.move(moves[i], { sloppy: true });
          }
          const board = game.board();
          const colors = getBoardColors();
          const pieceSet = getCurrentPieceSet();

          container.innerHTML = "";
          container.style.display = "grid";
          container.style.gridTemplateColumns = "repeat(8, 1fr)";
          container.style.aspectRatio = "1 / 1";

          for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
              const piece = board[i][j];
              const isLight = (i + j) % 2 === 0;
              const sq = document.createElement("div");
              sq.className = `square ${isLight ? "light" : "dark"}`;
              if (piece) {
                const key =
                  (piece.color === "w" ? "w" : "b") + piece.type.toLowerCase();
                const img = document.createElement("img");
                img.src = `pieces/${pieceSet}/${pieceCodes[key]}`;
                img.classList.add("piece-img");
                img.draggable = false;
                img.style.pointerEvents = "none";
                sq.appendChild(img);
              }
              container.appendChild(sq);
            }
          }
        }

        // ============================================
        // 🎮 کنترل‌های پخش
        // ============================================
        let autoInterval = null;
        let currentMoveIndex = 0;
        let currentTotalMoves = 0;
        let currentMoves = [];
        let currentBoardId = null;

        function stopAuto() {
          if (autoInterval) {
            clearInterval(autoInterval);
            autoInterval = null;
          }
        }

        function setupControls(type, moves) {
          currentMoves = moves;
          currentMoveIndex = 0;
          currentTotalMoves = moves.length;
          currentBoardId = type + "Board";

          const counter = document.getElementById("moveCounter");
          if (counter) {
            counter.textContent = `0/${Math.ceil(currentTotalMoves / 2)}`;
          }

          const update = () => {
            renderBoardDOM(currentBoardId, currentMoves, currentMoveIndex);
            if (counter) {
              counter.textContent = `${Math.ceil(currentMoveIndex / 2)}/${Math.ceil(currentTotalMoves / 2)}`;
            }
          };

          window._first = () => {
            stopAuto();
            currentMoveIndex = 0;
            update();
          };
          window._prev = () => {
            stopAuto();
            if (currentMoveIndex > 0) currentMoveIndex--;
            update();
          };
          window._next = () => {
            stopAuto();
            if (currentMoveIndex < currentTotalMoves) currentMoveIndex++;
            update();
          };
          window._last = () => {
            stopAuto();
            currentMoveIndex = currentTotalMoves;
            update();
          };
          window._toggle = () => {
            const btn = document.getElementById("playPauseBtn");
            if (autoInterval) {
              stopAuto();
              if (btn) btn.innerHTML = '<i class="fas fa-play"></i> شروع';
            } else {
              if (btn) btn.innerHTML = '<i class="fas fa-pause"></i> توقف';
              autoInterval = setInterval(() => {
                if (currentMoveIndex < currentTotalMoves) {
                  currentMoveIndex++;
                  update();
                } else {
                  stopAuto();
                  if (btn) btn.innerHTML = '<i class="fas fa-play"></i> شروع';
                }
              }, 1200);
            }
          };
          update();
        }

        // ============================================
        // 📂 مدیریت Overlay و view stack
        // ============================================
        const overlay = document.getElementById("mainOverlay");
        const overlayTitle = document.getElementById("overlayTitle");
        const overlayContent = document.getElementById("overlayContent");
        const backBtn = document.getElementById("backBtn");
        let viewStack = [];

        function pushView(view) {
          viewStack.push(view);
          renderCurrentView();
          overlay.classList.add("open");
          document.body.style.overflow = "hidden";
        }

        function popView() {
          if (viewStack.length > 1) {
            viewStack.pop();
            renderCurrentView();
          } else {
            viewStack = [];
            overlay.classList.remove("open");
            document.body.style.overflow = "";
            stopAuto();
          }
        }

        backBtn.addEventListener("click", popView);
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") popView();
        });

        // ============================================
        // 🎨 رندر view فعلی
        // ============================================
        function renderCurrentView() {
          if (viewStack.length === 0) return;
          const current = viewStack[viewStack.length - 1];
          overlayTitle.innerHTML = current.title;
          overlayContent.innerHTML = current.html;
          overlayContent.scrollTop = 0;

          if (current.type === "variant") {
            setupControls("variant", current.variant.moves);
            setTimeout(() => drawPieChart(current.variant.stats), 100);
          } else if (current.type === "game") {
            const g = new Chess();
            try {
              g.load_pgn(current.game.pgn);
              const moves = g.history();
              setupControls("game", moves);
            } catch (e) {
              console.error(e);
            }
          } else if (current.type === "trap") {
            setupControls("trap", current.trap.moves);
          }
        }

        // ============================================
        // 🥧 نمودار دایره‌ای
        // ============================================
        function drawPieChart(stats) {
          const canvas = document.getElementById("pieChart");
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          const w = canvas.width,
            h = canvas.height;
          ctx.clearRect(0, 0, w, h);
          const total = stats.whiteWins + stats.blackWins + stats.draws;
          if (total === 0) {
            ctx.fillStyle = "#94a3b8";
            ctx.font = "12px Vazir";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("داده‌ای موجود نیست", w / 2, h / 2);
            return;
          }
          const data = [
            { value: stats.whiteWins, color: "#e2e8f0" },
            { value: stats.blackWins, color: "#1e293b" },
            { value: stats.draws, color: "#64748b" },
          ];
          let startAngle = -Math.PI / 2;
          const cx = w / 2,
            cy = h / 2,
            r = Math.min(w, h) / 2 - 4;
          data.forEach((slice) => {
            const sliceAngle = (slice.value / total) * 2 * Math.PI;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, startAngle, startAngle + sliceAngle);
            ctx.closePath();
            ctx.fillStyle = slice.color;
            ctx.fill();
            startAngle += sliceAngle;
          });
          ctx.beginPath();
          ctx.arc(cx, cy, r * 0.55, 0, 2 * Math.PI);
          ctx.strokeStyle = "rgba(255,255,255,0.3)";
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx, cy, r * 0.45, 0, 2 * Math.PI);
          ctx.fillStyle = "rgba(255,255,255,0.15)";
          ctx.fill();
          ctx.fillStyle = "#1e293b";
          ctx.font = "bold 14px Vazir";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(`${total}`, cx, cy);
        }

        // ============================================
        // 🧩 توابع باز کردن Views
        // ============================================
        function openVariantView(variant, openingName) {
          const stats = variant.stats || {
            whiteWins: 0,
            blackWins: 0,
            draws: 0,
          };
          const view = {
            type: "variant",
            title: `${openingName} – ${variant.name}`,
            variant: variant,
            html: `
        <div class="viewer-body">
          <div class="board-wrapper">
            <div id="variantBoard" class="chessboard"></div>
            <div class="control-buttons">
              <button class="btn-sm" onclick="window._first()"><i class="fas fa-fast-backward"></i></button>
              <button class="btn-sm" onclick="window._prev()"><i class="fas fa-step-backward"></i></button>
              <button class="btn-sm primary" id="playPauseBtn" onclick="window._toggle()"><i class="fas fa-play"></i> شروع</button>
              <button class="btn-sm" onclick="window._next()"><i class="fas fa-step-forward"></i></button>
              <button class="btn-sm" onclick="window._last()"><i class="fas fa-fast-forward"></i></button>
              <span class="move-counter" id="moveCounter">0/0</span>
            </div>
          </div>
          <div class="info-wrapper">
            <div class="pie-section">
              <canvas id="pieChart" width="100" height="100"></canvas>
              <div class="legend">
                <span><span class="dot" style="background:#e2e8f0;"></span> برد سفید: ${stats.whiteWins}%</span>
                <span><span class="dot" style="background:#1e293b;"></span> برد سیاه: ${stats.blackWins}%</span>
                <span><span class="dot" style="background:#64748b;"></span> مساوی: ${stats.draws}%</span>
              </div>
            </div>
            <div class="info-card"><h4>💪 نقاط قوت</h4><ul class="info-list">${(variant.strengths || []).map((s) => `<li><i class="fas fa-check-circle" style="color:#166534;"></i> ${s}</li>`).join("")}</ul></div>
            <div class="info-card"><h4>⚠️ نقاط ضعف</h4><ul class="info-list">${(variant.weaknesses || []).map((w) => `<li><i class="fas fa-times-circle" style="color:#991b1b;"></i> ${w}</li>`).join("")}</ul></div>
            <div class="info-card"><h4>📈 حرکات پرتکرار</h4>${(variant.popularMoves || []).map((pm) => `<div class="popular-move"><span>${pm.san} – ${pm.description}</span><span class="move-san">${(pm.moves || []).join(" ")}</span></div>`).join("") || '<p style="color:#5f7f9e;">حرکتی ثبت نشده است.</p>'}</div>
            <div class="info-card"><h4>📊 ارزیابی پوزیسیون</h4><p>${variant.evaluation?.summary || "ارزیابی موجود نیست"} <strong>(${variant.evaluation?.score || "0.0"})</strong></p></div>
            <div class="info-card"><h4>💡 ایده‌ها و طرح‌ها</h4><ul class="info-list">${(variant.ideas || []).map((i) => `<li>🔹 ${i}</li>`).join("") || "<li>طرحی ثبت نشده است.</li>"}</ul></div>
            <div class="info-card"><h4>🏁 آخر بازی‌های احتمالی</h4><ul class="info-list">${(variant.endgames || []).map((e) => `<li>♟️ ${e}</li>`).join("") || "<li>آخر بازی ثبت نشده است.</li>"}</ul></div>
            <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
              <button class="btn-sm primary" onclick="window._openGamesList()"><i class="fas fa-list"></i> نمونه بازی‌ها (${(variant.sampleGames || []).length})</button>
              <button class="btn-sm primary" onclick="window._openTrapsList()"><i class="fas fa-fish"></i> تله‌ها (${(variant.traps || []).length})</button>
              <button class="btn-sm" onclick="alert('📥 دانلود تحلیل به زودی اضافه می‌شود.')"><i class="fas fa-download"></i> دانلود تحلیل</button>
            </div>
          </div>
        </div>
      `,
          };
          pushView(view);
          window._openGamesList = () =>
            openGamesListView(
              variant.sampleGames || [],
              `${openingName} – ${variant.name}`,
            );
          window._openTrapsList = () =>
            openTrapsListView(
              variant.traps || [],
              `${openingName} – ${variant.name}`,
            );
        }

        function openGamesListView(games, parentTitle) {
          const view = {
            type: "gamesList",
            title: `نمونه بازی‌های ${parentTitle}`,
            html: `
        <div class="info-card" style="max-width:600px; margin:0 auto;">
          ${games.length === 0 ? '<p style="color:#5f7f9e;">نمونه بازی‌ای ثبت نشده است.</p>' : ""}
          ${games
            .map(
              (g, i) => `
            <div class="game-item" onclick="window._openGameView(${i})">
              <span>♜ ${g.white} vs ${g.black} (${g.year}) – ${g.result}</span>
              <i class="fas fa-chevron-left"></i>
            </div>
          `,
            )
            .join("")}
        </div>
      `,
          };
          pushView(view);
          window._openGameView = (idx) => openGameView(games[idx], parentTitle);
        }

        function openGameView(game, parentTitle) {
          const view = {
            type: "game",
            title: `${game.white} vs ${game.black}`,
            game: game,
            html: `
        <div class="viewer-body">
          <div class="board-wrapper">
            <div id="gameBoard" class="chessboard"></div>
            <div class="control-buttons">
              <button class="btn-sm" onclick="window._first()"><i class="fas fa-fast-backward"></i></button>
              <button class="btn-sm" onclick="window._prev()"><i class="fas fa-step-backward"></i></button>
              <button class="btn-sm primary" id="playPauseBtn" onclick="window._toggle()"><i class="fas fa-play"></i> شروع</button>
              <button class="btn-sm" onclick="window._next()"><i class="fas fa-step-forward"></i></button>
              <button class="btn-sm" onclick="window._last()"><i class="fas fa-fast-forward"></i></button>
              <span class="move-counter" id="moveCounter">0/0</span>
            </div>
          </div>
          <div class="info-wrapper">
            <div class="info-card">
              <p><strong>سفید:</strong> ${game.white} | <strong>سیاه:</strong> ${game.black}</p>
              <p><strong>سال:</strong> ${game.year} | <strong>نتیجه:</strong> ${game.result}</p>
            </div>
          </div>
        </div>
      `,
          };
          pushView(view);
        }

        function openTrapsListView(traps, parentTitle) {
          const view = {
            type: "trapsList",
            title: `تله‌های ${parentTitle}`,
            html: `
        <div class="info-card" style="max-width:600px; margin:0 auto;">
          ${traps.length === 0 ? '<p style="color:#5f7f9e;">تله‌ای ثبت نشده است.</p>' : ""}
          ${traps
            .map(
              (t, i) => `
            <div class="trap-item" onclick="window._openTrapView(${i})">
              <span>⚠️ ${t.name || "تله " + (i + 1)}</span>
              <i class="fas fa-chevron-left"></i>
            </div>
          `,
            )
            .join("")}
        </div>
      `,
          };
          pushView(view);
          window._openTrapView = (idx) => openTrapView(traps[idx], parentTitle);
        }

        function openTrapView(trap, parentTitle) {
          const view = {
            type: "trap",
            title: trap.name || "تله",
            trap: trap,
            html: `
        <div class="viewer-body">
          <div class="board-wrapper">
            <div id="trapBoard" class="chessboard"></div>
            <div class="control-buttons">
              <button class="btn-sm" onclick="window._first()"><i class="fas fa-fast-backward"></i></button>
              <button class="btn-sm" onclick="window._prev()"><i class="fas fa-step-backward"></i></button>
              <button class="btn-sm primary" id="playPauseBtn" onclick="window._toggle()"><i class="fas fa-play"></i> شروع</button>
              <button class="btn-sm" onclick="window._next()"><i class="fas fa-step-forward"></i></button>
              <button class="btn-sm" onclick="window._last()"><i class="fas fa-fast-forward"></i></button>
              <span class="move-counter" id="moveCounter">0/0</span>
            </div>
          </div>
          <div class="info-wrapper">
            <div class="info-card">
              <p><strong>توضیح:</strong> ${trap.description || "توضیحی ثبت نشده است."}</p>
            </div>
          </div>
        </div>
      `,
          };
          pushView(view);
        }

        // ============================================
        // 📋 بارگذاری و رندر لیست گشایش‌ها
        // ============================================
        let openingsData = { categories: [] };
        let currentFilter = "all";

        async function loadOpeningsJSON() {
          try {
            const res = await fetch("data/openings.json");
            if (!res.ok) throw new Error("HTTP " + res.status);
            openingsData = await res.json();
            renderList();
          } catch (err) {
            console.error(err);
            document.getElementById("openingsList").innerHTML = `
        <div class="no-result">❌ خطا در بارگذاری دیتابیس گشایش‌ها.</div>
      `;
          }
        }

        function renderList() {
          const container = document.getElementById("openingsList");
          let categories = openingsData.categories || [];

          const query =
            document
              .getElementById("searchInput")
              ?.value.trim()
              .toLowerCase() || "";
          if (currentFilter !== "all") {
            categories = categories.filter((c) => c.code === currentFilter);
          }
          if (query) {
            categories = categories
              .map((cat) => ({
                ...cat,
                openings: cat.openings.filter(
                  (op) =>
                    op.name.toLowerCase().includes(query) ||
                    (op.variants &&
                      op.variants.some((v) =>
                        v.name.toLowerCase().includes(query),
                      )),
                ),
              }))
              .filter((cat) => cat.openings.length > 0);
          }

          if (!categories.length) {
            container.innerHTML = `<div class="no-result">🔍 گشایشی با این مشخصات یافت نشد.</div>`;
            return;
          }

          container.innerHTML = "";
          categories.forEach((cat) => {
            cat.openings.forEach((opening) => {
              const card = document.createElement("div");
              card.className = "opening-card";
              const movesDisplay = opening.moves
                ? opening.moves.join(" ")
                : "...";
              card.innerHTML = `
          <div class="card-header">
            <div class="card-title">
              <i class="fas fa-chess-queen"></i>
              <span>${opening.name}</span>
            </div>
            <span class="card-moves" dir="ltr">${movesDisplay}</span>
            <i class="fas fa-chevron-down chevron"></i>
          </div>
          <div class="card-body">
            ${
              opening.variants && opening.variants.length
                ? `
              <div class="variants-grid">
                ${opening.variants
                  .map(
                    (v) => `
                  <div class="variant-item" data-name="${v.name}">
                    <span>🔸 ${v.name}</span>
                    <span class="variant-moves-preview">${v.moves.slice(0, 2).join(" ")}..</span>
                  </div>
                `,
                  )
                  .join("")}
              </div>
            `
                : '<div style="padding:1rem;color:#5f7f9e;">بدون واریانت</div>'
            }
          </div>
        `;
              container.appendChild(card);

              const header = card.querySelector(".card-header");
              const body = card.querySelector(".card-body");
              const chevron = header.querySelector(".chevron");
              header.addEventListener("click", function (e) {
                if (e.target.closest(".variant-item")) return;
                const isOpen = body.classList.toggle("open");
                chevron.classList.toggle("open");
                // اضافه/حذف کلاس expanded به هدر برای چندخطی شدن
                header.classList.toggle("expanded", isOpen);
              });

              card.querySelectorAll(".variant-item").forEach((item) => {
                item.addEventListener("click", (e) => {
                  e.stopPropagation();
                  const variant = opening.variants.find(
                    (v) => v.name === item.dataset.name,
                  );
                  if (variant) openVariantView(variant, opening.name);
                });
              });
            });
          });
        }

        // ============================================
        // 🎛️ رویدادهای جستجو و فیلتر
        // ============================================
        document
          .getElementById("searchInput")
          .addEventListener("input", renderList);
        document.querySelectorAll("#filterChips .chip").forEach((chip) => {
          chip.addEventListener("click", function () {
            document
              .querySelectorAll("#filterChips .chip")
              .forEach((c) => c.classList.remove("active"));
            this.classList.add("active");
            currentFilter = this.dataset.filter;
            renderList();
          });
        });

        // ============================================
        // 🚀 راه‌اندازی
        // ============================================
        loadPieces().then(() => {
          loadOpeningsJSON();
          console.log("✅ ChessHub Openings loaded successfully");
        });

        // گوش‌دادن به تغییرات تم و مهره‌ها
        document.addEventListener("themeChanged", () => {
          if (overlay.classList.contains("open") && viewStack.length > 0) {
            const current = viewStack[viewStack.length - 1];
            if (["variant", "game", "trap"].includes(current.type)) {
              const boardId = current.type + "Board";
              const boardEl = document.getElementById(boardId);
              if (boardEl) {
                const moves =
                  current.type === "variant"
                    ? current.variant.moves
                    : current.type === "game"
                      ? current._gameMoves || []
                      : current.trap.moves;
                const idx = currentMoveIndex || 0;
                renderBoardDOM(boardId, moves, idx);
              }
            }
          }
        });
        document.addEventListener("pieceSetChanged", () => {
          if (overlay.classList.contains("open") && viewStack.length > 0) {
            const current = viewStack[viewStack.length - 1];
            if (["variant", "game", "trap"].includes(current.type)) {
              const boardId = current.type + "Board";
              const boardEl = document.getElementById(boardId);
              if (boardEl) {
                const moves =
                  current.type === "variant"
                    ? current.variant.moves
                    : current.type === "game"
                      ? current._gameMoves || []
                      : current.trap.moves;
                const idx = currentMoveIndex || 0;
                renderBoardDOM(boardId, moves, idx);
              }
            }
          }
        });
      })();
    </script>
  </body>
</html>
