<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ChessHub | همکاری در دروس</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/cooperation.css" />
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <section class="app-hero">
        <h1><i class="fas fa-handshake"></i> همکاری در دروس آموزشی</h1>
        <p>
          درس خود را بدون نیاز به کدنویسی بسازید و خروجی JSON را دریافت کنید
        </p>
      </section>

      <div class="coop-form" id="coopForm">
        <!-- اطلاعات پایه -->
        <div class="form-row">
          <div class="form-group">
            <label>عنوان درس <span class="required">*</span></label>
            <input
              type="text"
              id="lessonTitle"
              placeholder="مثلاً: اصول طلایی گشایش"
            />
          </div>
          <div class="form-group">
            <label>دسته‌بندی <span class="required">*</span></label>
            <select id="lessonCategory">
              <option value="شروع بازی">شروع بازی</option>
              <option value="وسط بازی">وسط بازی</option>
              <option value="آخر بازی">آخر بازی</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>سطح <span class="required">*</span></label>
            <select id="lessonLevel">
              <option value="مبتدی">مبتدی</option>
              <option value="متوسط">متوسط</option>
              <option value="پیشرفته">پیشرفته</option>
              <option value="حرفه‌ای">حرفه‌ای</option>
            </select>
          </div>
          <div class="form-group">
            <label>مدت زمان <span class="required">*</span></label>
            <input
              type="text"
              id="lessonDuration"
              placeholder="مثلاً: ۱۵ دقیقه"
            />
          </div>
        </div>

        <div class="form-group">
          <label>توضیحات کوتاه <span class="required">*</span></label>
          <input
            type="text"
            id="lessonDescription"
            placeholder="یک توضیح کوتاه و جذاب برای درس"
          />
        </div>

        <!-- آیکون -->
        <div class="form-group">
          <label
            >آیکون درس
            <span class="hint">– روی آیکون مورد نظر کلیک کنید</span></label
          >
          <div class="icon-grid" id="iconGrid"></div>
          <input type="hidden" id="selectedIcon" value="fas fa-book-open" />
        </div>

        <!-- رنگ -->
        <div class="form-group">
          <label
            >رنگ درس
            <span class="hint">– روی رنگ مورد نظر کلیک کنید</span></label
          >
          <div class="color-grid" id="colorGrid"></div>
          <input type="hidden" id="selectedColor" value="#2c7da0" />
        </div>

        <!-- ویرایشگر محتوا -->
        <div class="form-group">
          <label>محتوا <span class="required">*</span></label>
          <div class="editor-wrapper">
            <div class="editor-toolbar" id="editorToolbar">
              <div class="tool-group">
                <button class="tool-btn" data-tag="h3">
                  <i class="fas fa-heading"></i> تیتر
                </button>
                <button class="tool-btn" data-tag="h4">
                  <i class="fas fa-heading"></i> زیرتیتر
                </button>
                <button class="tool-btn" data-tag="p">
                  <i class="fas fa-paragraph"></i> متن
                </button>
              </div>
              <div class="tool-group">
                <button class="tool-btn" data-tag="ul">
                  <i class="fas fa-list-ul"></i> لیست
                </button>
                <button class="tool-btn" data-tag="ol">
                  <i class="fas fa-list-ol"></i> شماره‌دار
                </button>
              </div>
              <div class="tool-group">
                <button class="tool-btn" data-tag="blockquote">
                  <i class="fas fa-quote-right"></i> نقل قول
                </button>
                <button class="tool-btn" data-tag="code">
                  <i class="fas fa-code"></i> کد
                </button>
              </div>
              <div class="tool-group">
                <button class="tool-btn" data-tag="hr">
                  <i class="fas fa-minus"></i> خط
                </button>
                <button class="tool-btn" id="imageBtn">
                  <i class="fas fa-image"></i> تصویر (لینک)
                </button>
              </div>
              <div class="tool-group color-tool-group">
                <span>رنگ متن:</span>
                <input
                  type="color"
                  id="textColorPicker"
                  value="#1e2f3e"
                  title="رنگ متن"
                />
                <span>پس‌زمینه:</span>
                <input
                  type="color"
                  id="bgColorPicker"
                  value="#ffffff"
                  title="رنگ پس‌زمینه"
                />
                <button class="apply-color-btn" id="applyColorBtn">
                  اعمال رنگ
                </button>
              </div>
              <div class="tool-group">
                <button class="tool-btn" id="toggleTablePanelBtn">
                  <i class="fas fa-table"></i> جدول
                </button>
              </div>
            </div>

            <!-- پنل جدول -->
            <div class="table-panel" id="tablePanel">
              <div class="panel-title">
                <i class="fas fa-table"></i> ساخت و ویرایش جدول
              </div>
              <div class="ctrl-row">
                <div class="ctrl-item">
                  <span>ردیف‌ها:</span>
                  <button class="btn-circle" id="decRowsBtn" title="کاهش ردیف">
                    −
                  </button>
                  <span class="num" id="rowCountDisplay">3</span>
                  <button
                    class="btn-circle"
                    id="incRowsBtn"
                    title="افزایش ردیف"
                  >
                    +
                  </button>
                </div>
                <div class="ctrl-item">
                  <span>ستون‌ها:</span>
                  <button class="btn-circle" id="decColsBtn" title="کاهش ستون">
                    −
                  </button>
                  <span class="num" id="colCountDisplay">2</span>
                  <button
                    class="btn-circle"
                    id="incColsBtn"
                    title="افزایش ستون"
                  >
                    +
                  </button>
                </div>
              </div>
              <div class="cell-color-label">
                <i class="fas fa-paint-brush"></i> رنگ سلول:
                <span style="font-size: 0.65rem; color: #999"
                  >(روی یک سلول کلیک کنید، سپس رنگ را انتخاب کنید)</span
                >
              </div>
              <div class="cell-colors" id="cellColorPalette"></div>
              <div class="table-preview-wrap" id="tablePreviewWrap">
                <table id="previewTable">
                  <thead>
                    <tr>
                      <th>حرکت سفید</th>
                      <th>حرکت سیاه</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>e4</td>
                      <td>e5</td>
                    </tr>
                    <tr>
                      <td>Nf3</td>
                      <td>Nc6</td>
                    </tr>
                    <tr>
                      <td>Bb5</td>
                      <td>a6</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="panel-actions">
                <button
                  class="btn-sm btn-sm-primary"
                  id="insertTableToEditorBtn"
                >
                  <i class="fas fa-check"></i> درج جدول در محتوا
                </button>
                <button class="btn-sm btn-sm-secondary" id="closeTablePanelBtn">
                  <i class="fas fa-times"></i> بستن
                </button>
                <button class="btn-sm btn-sm-warning" id="resetTableBtn">
                  <i class="fas fa-undo"></i> بازنشانی جدول
                </button>
              </div>
            </div>

            <!-- منطقه ویرایش -->
            <div
              class="editor-area"
              id="editorArea"
              contenteditable="true"
              spellcheck="false"
            ></div>
          </div>
        </div>

        <!-- پیش‌نمایش -->
        <div class="preview-section">
          <h4>👁️ پیش‌نمایش محتوا</h4>
          <div class="preview-content" id="previewContent"></div>
        </div>

        <div class="btn-group">
          <button class="btn btn-secondary" id="resetFormBtn">
            <i class="fas fa-undo"></i> پاک کردن
          </button>
          <button class="btn btn-success" id="exportJsonBtn">
            <i class="fas fa-download"></i> خروجی JSON
          </button>
        </div>
      </div>

      <div id="footer-placeholder"></div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer">
      <div class="toast" id="toast"></div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/cooperation-lessons.js"></script>
  </body>
</html>
