<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ChessHub | همکاری در دروس</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* ===== استایل‌های اختصاصی فرم همکاری ===== */

      .coop-form {
        background: var(--bg-card, #ffffff);
        border-radius: var(--radius-lg);
        padding: 1.8rem 2rem;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border-color, #e2e8f0);
        max-width: 1000px;
        margin: 0 auto;
      }

      .coop-form .form-group {
        margin-bottom: 1.2rem;
      }

      .coop-form .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 0.3rem;
      }

      .coop-form .form-group label .required {
        color: #e25555;
        margin-right: 2px;
      }

      .coop-form .form-group label .hint {
        font-size: 0.7rem;
        color: var(--text-secondary, #64748b);
        font-weight: 400;
      }

      .coop-form .form-group input,
      .coop-form .form-group select {
        width: 100%;
        padding: 0.6rem 0.8rem;
        border: 1.5px solid var(--border-color, #e2e8f0);
        border-radius: 12px;
        font-family: "Vazir";
        font-size: 0.85rem;
        transition: 0.2s;
        background: var(--secondary, #f8fafc);
        color: var(--text-dark);
        outline: none;
        box-sizing: border-box;
      }

      .coop-form .form-group input:focus,
      .coop-form .form-group select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(44, 125, 160, 0.08);
        background: #fff;
      }

      .coop-form .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      /* ===== آیکن‌ها ===== */
      .icon-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        padding: 0.5rem;
        background: #f8fafc;
        border-radius: 12px;
        border: 1px solid var(--border-color, #e2e8f0);
        max-height: 110px;
        overflow-y: auto;
      }

      .icon-grid::-webkit-scrollbar {
        width: 4px;
      }

      .icon-grid::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 10px;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        border: 2px solid transparent;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        background: #fff;
        color: var(--text-dark);
        transition: 0.2s;
      }

      .icon-btn:hover {
        transform: scale(1.08);
        border-color: var(--primary);
        background: #eef6fb;
      }

      .icon-btn.active {
        border-color: var(--primary);
        background: #e0f0f7;
        color: var(--primary-dark);
        font-weight: bold;
      }

      /* ===== رنگ‌های درس ===== */
      .color-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0.5rem;
        background: #f8fafc;
        border-radius: 12px;
        border: 1px solid var(--border-color, #e2e8f0);
        max-height: 100px;
        overflow-y: auto;
        align-items: center;
      }

      .color-grid::-webkit-scrollbar {
        width: 4px;
      }

      .color-grid::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 10px;
      }

      .color-btn {
        width: 34px;
        height: 34px;
        border: 2px solid transparent;
        border-radius: 50%;
        cursor: pointer;
        transition: 0.2s;
        position: relative;
        flex-shrink: 0;
      }

      .color-btn:hover {
        transform: scale(1.1);
      }

      .color-btn.active {
        border-color: #333;
        transform: scale(1.08);
      }

      .color-btn .check {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 0.65rem;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        pointer-events: none;
      }

      /* ===== ویرایشگر ===== */
      .editor-wrapper {
        border: 1.5px solid var(--border-color, #e2e8f0);
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
      }

      .editor-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
        padding: 0.5rem 0.6rem;
        background: #f8fafc;
        border-bottom: 1px solid var(--border-color, #e2e8f0);
        align-items: center;
      }

      .editor-toolbar .tool-group {
        display: flex;
        gap: 0.2rem;
        align-items: center;
        padding: 0 0.3rem;
        border-left: 1px solid #e0e7ef;
      }

      .editor-toolbar .tool-group:last-child {
        border-left: none;
      }

      .editor-toolbar .tool-btn {
        background: #fff;
        border: 1px solid var(--border-color, #e2e8f0);
        border-radius: 8px;
        padding: 0.3rem 0.55rem;
        font-size: 0.7rem;
        cursor: pointer;
        transition: 0.2s;
        font-family: "Vazir";
        color: var(--text-dark);
        display: flex;
        align-items: center;
        gap: 0.2rem;
        white-space: nowrap;
      }

      .editor-toolbar .tool-btn:hover {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .editor-toolbar .tool-btn i {
        font-size: 0.75rem;
      }

      .color-tool-group {
        display: flex;
        gap: 0.4rem;
        align-items: center;
        flex-wrap: wrap;
      }

      .color-tool-group span {
        font-size: 0.65rem;
        color: var(--text-secondary, #64748b);
        white-space: nowrap;
      }

      .color-tool-group input[type="color"] {
        width: 28px;
        height: 28px;
        border: 1px solid #ddd;
        padding: 0;
        border-radius: 50%;
        cursor: pointer;
        background: none;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
      }

      .color-tool-group input[type="color"]:focus {
        outline: none;
        border-color: #aaa;
      }

      .color-tool-group input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }

      .color-tool-group input[type="color"]::-webkit-color-swatch {
        border-radius: 50%;
        border: none;
      }

      .apply-color-btn {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0.2rem 0.7rem;
        font-size: 0.65rem;
        cursor: pointer;
        font-family: "Vazir";
        transition: 0.2s;
        white-space: nowrap;
      }

      .apply-color-btn:hover {
        background: var(--primary-dark);
      }

      .editor-area {
        min-height: 280px;
        padding: 1rem 1.2rem;
        background: #fff;
        color: var(--text-dark);
        font-size: 0.95rem;
        line-height: 1.9;
        direction: rtl;
        outline: none;
        overflow-y: auto;
      }

      .editor-area:focus {
        background: #fafcff;
      }

      .editor-area h3 {
        font-size: 1.5rem;
        color: var(--primary);
        border-right: 4px solid var(--primary);
        padding-right: 12px;
        margin: 0.6rem 0;
      }

      .editor-area h4 {
        font-size: 1.15rem;
        color: var(--primary-dark);
        border-right: 3px solid var(--primary);
        padding-right: 10px;
        margin: 0.4rem 0;
      }

      .editor-area blockquote {
        background: #f8fafc;
        border-right: 4px solid var(--primary);
        padding: 0.5rem 1.2rem;
        margin: 0.4rem 0;
        border-radius: 8px;
        color: var(--text-secondary, #64748b);
        font-style: italic;
      }

      .editor-area code {
        font-family: "Courier New", monospace;
        background: #f1f5f9;
        padding: 0.05rem 0.4rem;
        border-radius: 4px;
        font-size: 0.85rem;
        color: #d63384;
        direction: ltr;
        display: inline-block;
      }

      .editor-area table {
        width: 100%;
        border-collapse: collapse;
        margin: 0.5rem 0;
        font-size: 0.85rem;
        border-radius: 8px;
        overflow: hidden;
      }

      .editor-area th,
      .editor-area td {
        border: 1px solid #cbd5e1;
        padding: 0.4rem 0.7rem;
        text-align: center;
        min-width: 40px;
        background: #fff;
      }

      .editor-area th {
        background: var(--primary);
        color: white;
        font-weight: 700;
      }

      .editor-area hr {
        border: none;
        border-top: 2px dashed #cbd5e1;
        margin: 0.6rem 0;
      }

      .editor-area img {
        max-width: 100%;
        border-radius: 8px;
        margin: 0.3rem 0;
      }

      .editor-area ul,
      .editor-area ol {
        padding-right: 1.5rem;
      }

      .editor-area li {
        margin: 0.2rem 0;
      }

      /* ===== پنل جدول ===== */
      .table-panel {
        display: none;
        background: #fafcfd;
        border-radius: 12px;
        padding: 1rem 1.2rem;
        margin-top: 0.6rem;
        border: 1.5px solid var(--border-color, #e2e8f0);
        animation: fadeSlideIn 0.25s ease;
      }

      @keyframes fadeSlideIn {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .table-panel .panel-title {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 0.7rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .table-panel .panel-title i {
        color: var(--primary);
      }

      .table-panel .ctrl-row {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
        margin-bottom: 0.7rem;
      }

      .table-panel .ctrl-row .ctrl-item {
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }

      .table-panel .ctrl-row .ctrl-item span {
        font-size: 0.75rem;
        color: var(--text-dark);
        font-weight: 600;
        min-width: 35px;
      }

      .table-panel .ctrl-row .ctrl-item .num {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--primary);
        min-width: 22px;
        text-align: center;
      }

      .table-panel .btn-circle {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1.5px solid var(--border-color, #e2e8f0);
        background: #fff;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 700;
        color: var(--text-dark);
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Vazir";
        line-height: 1;
      }

      .table-panel .btn-circle:hover {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      .table-panel .btn-circle:active {
        transform: scale(0.9);
      }

      .table-panel .cell-color-label {
        font-size: 0.7rem;
        color: var(--text-secondary, #64748b);
        margin-top: 0.5rem;
        margin-bottom: 0.3rem;
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }

      .table-panel .cell-color-label i {
        font-size: 0.6rem;
        color: #999;
      }

      .table-panel .cell-colors {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        margin-bottom: 0.6rem;
      }

      .table-panel .cell-colors .cc-btn {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        transition: 0.2s;
        flex-shrink: 0;
        position: relative;
      }

      .table-panel .cell-colors .cc-btn:hover {
        transform: scale(1.1);
      }

      .table-panel .cell-colors .cc-btn.active {
        border-color: #333;
        transform: scale(1.08);
      }

      .table-panel .cell-colors .cc-btn .cc-check {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 0.5rem;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        pointer-events: none;
      }

      .table-panel .table-preview-wrap {
        overflow-x: auto;
        margin: 0.6rem 0;
        border-radius: 8px;
        border: 1px solid var(--border-color, #e2e8f0);
      }

      .table-panel .table-preview-wrap table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
      }

      .table-panel .table-preview-wrap th,
      .table-panel .table-preview-wrap td {
        border: 1px solid #dde4ec;
        padding: 0.4rem 0.6rem;
        text-align: center;
        min-width: 50px;
        cursor: pointer;
        background: #fff;
        color: var(--text-dark);
        transition: 0.15s;
        user-select: none;
      }

      .table-panel .table-preview-wrap th {
        background: #e8f0f6;
        font-weight: 700;
        color: var(--primary-dark);
      }

      .table-panel .table-preview-wrap td:hover {
        background: #eef6fb;
      }

      .table-panel .table-preview-wrap td.selected-cell {
        outline: 2px solid var(--primary);
        outline-offset: -1px;
        background: #e0f0f7 !important;
        z-index: 1;
        position: relative;
      }

      .table-panel .table-preview-wrap th.selected-cell {
        outline: 2px solid #1a5a78;
        outline-offset: -1px;
        background: #c5dce8 !important;
        z-index: 1;
        position: relative;
      }

      .table-panel .panel-actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 0.5rem;
      }

      .table-panel .panel-actions .btn-sm {
        padding: 0.4rem 1rem;
        border-radius: 20px;
        border: none;
        font-family: "Vazir";
        font-size: 0.7rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }

      .btn-sm-primary {
        background: var(--primary);
        color: #fff;
      }

      .btn-sm-primary:hover {
        background: var(--primary-dark);
      }

      .btn-sm-secondary {
        background: #e2e8f0;
        color: var(--text-dark);
      }

      .btn-sm-secondary:hover {
        background: #cbd5e1;
      }

      .btn-sm-warning {
        background: #fef3c7;
        color: #92400e;
      }

      .btn-sm-warning:hover {
        background: #fde68a;
      }

      /* ===== دکمه‌های اصلی ===== */
      .btn-group {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-top: 1.5rem;
        justify-content: center;
      }

      .btn {
        padding: 0.6rem 1.8rem;
        border-radius: 40px;
        border: none;
        font-family: "Vazir";
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      .btn-primary {
        background: var(--primary);
        color: #fff;
      }

      .btn-primary:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(44, 125, 160, 0.3);
      }

      .btn-success {
        background: #10b981;
        color: #fff;
      }

      .btn-success:hover {
        background: #059669;
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
      }

      .btn-secondary {
        background: #e2e8f0;
        color: var(--text-dark);
      }

      .btn-secondary:hover {
        background: #cbd5e1;
        transform: translateY(-2px);
      }

      /* ===== پیش‌نمایش ===== */
      .preview-section {
        margin-top: 1rem;
        padding: 1rem;
        background: #f8fafc;
        border-radius: 12px;
        border: 1px solid var(--border-color, #e2e8f0);
      }

      .preview-section h4 {
        font-size: 0.85rem;
        color: var(--text-secondary, #64748b);
        margin-bottom: 0.5rem;
      }

      .preview-content {
        background: #fff;
        padding: 1rem;
        border-radius: 8px;
        min-height: 100px;
        max-height: 300px;
        overflow-y: auto;
      }

      /* ===== Toast ===== */
      .toast-container {
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        direction: rtl;
        width: 90%;
        max-width: 500px;
      }

      .toast {
        background: #1a2a3a;
        color: #fff;
        padding: 0.7rem 1.5rem;
        border-radius: 60px;
        font-size: 0.85rem;
        font-family: "Vazir", sans-serif;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        opacity: 0;
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
        transform: translateY(20px);
        text-align: center;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .toast.success {
        background: #10b981;
      }

      .toast.error {
        background: #e25555;
      }

      .toast.warning {
        background: #f59e0b;
        color: #1a2a3a;
      }

      /* ===== واکنش‌گرایی ===== */
      @media (max-width: 768px) {
        .coop-form {
          padding: 1.2rem;
        }

        .coop-form .form-row {
          grid-template-columns: 1fr;
        }

        .btn-group {
          flex-direction: column;
          align-items: stretch;
        }

        .btn {
          justify-content: center;
          font-size: 0.8rem;
        }

        .editor-toolbar .tool-btn {
          font-size: 0.6rem;
          padding: 0.25rem 0.4rem;
        }

        .editor-toolbar .tool-group {
          border-left: none;
          padding: 0.1rem;
        }

        .icon-btn {
          width: 34px;
          height: 34px;
          font-size: 1rem;
        }

        .color-btn {
          width: 30px;
          height: 30px;
        }

        .editor-area {
          min-height: 200px;
          padding: 0.7rem 0.8rem;
          font-size: 0.85rem;
        }

        .table-panel .ctrl-row {
          gap: 0.5rem;
        }

        .table-panel .btn-circle {
          width: 28px;
          height: 28px;
          font-size: 0.85rem;
        }

        .table-panel .cell-colors .cc-btn {
          width: 26px;
          height: 26px;
        }

        /* بزرگتر کردن دایره‌های رنگ در تبلت */
        .color-tool-group input[type="color"] {
          width: 36px !important;
          height: 36px !important;
        }
      }

      @media (max-width: 480px) {
        .coop-form {
          padding: 0.8rem;
        }

        .coop-form .form-group label {
          font-size: 0.75rem;
        }

        .coop-form .form-group input,
        .coop-form .form-group select {
          font-size: 0.75rem;
          padding: 0.45rem 0.6rem;
        }

        .btn {
          font-size: 0.75rem;
          padding: 0.45rem 1rem;
        }

        .editor-area {
          min-height: 180px;
          padding: 0.5rem 0.6rem;
          font-size: 0.8rem;
        }

        .icon-grid,
        .color-grid {
          max-height: 80px;
        }

        .icon-btn {
          width: 30px;
          height: 30px;
          font-size: 0.9rem;
        }

        /* ===== بزرگتر کردن دایره‌های رنگ درس در موبایل ===== */
        .color-btn {
          width: 36px !important;
          height: 36px !important;
        }

        /* ===== بزرگتر کردن دایره‌های انتخاب رنگ متن و پس‌زمینه در موبایل ===== */
        .color-tool-group input[type="color"] {
          width: 40px !important;
          height: 35px !important;
        }

        .table-panel {
          padding: 0.7rem;
        }

        .table-panel .table-preview-wrap td {
          padding: 0.25rem 0.35rem;
          font-size: 0.7rem;
          min-width: 35px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <!-- بنر یکدست با بقیه صفحات (با کلاس hero-section) -->
      <section class="hero-section">
        <h1>
          <span class="highlight"><i class="fas fa-handshake"></i></span>
          <span class="highlight">همکاری</span> در دروس آموزشی
        </h1>
        <p>
          درس خود را بدون نیاز به کدنویسی بسازید و خروجی JSON را دریافت کنید
        </p>
      </section>

      <div class="coop-form" id="coopForm">
        <!-- اطلاعات پایه -->
        <div class="form-row">
          <div class="form-group">
            <label>عنوان درس <span class="required">*</span></label>
            <input
              type="text"
              id="lessonTitle"
              placeholder="مثلاً: اصول طلایی گشایش"
            />
          </div>
          <div class="form-group">
            <label>دسته‌بندی <span class="required">*</span></label>
            <select id="lessonCategory">

        <!-- ===== ویرایشگر محتوا ===== -->
        <div class="form-group">

              <div class="tool-group">
                <button class="tool-btn" data-tag="blockquote">

                <button class="tool-btn" id="imageBtn">
                  <i class="fas fa-image"></i> تصویر (لینک)
                </button>

              <!-- گروه رنگ متن -->
              <div class="tool-group color-tool-group">
                <span>رنگ متن:</span>
                <input
                  type="color"
                  id="textColorPicker"
                  value="#1e2f3e"
                  title="رنگ متن"
                />
                <span>پس‌زمینه:</span>
                <input
                  type="color"
                  id="bgColorPicker"

                  <span>ستون‌ها:</span>
                  <button class="btn-circle" id="decColsBtn" title="کاهش ستون">
                    −
                  </button>
                  <span class="num" id="colCountDisplay">2</span>
                  <button
                    class="btn-circle"
                    id="incColsBtn"
                    title="افزایش ستون"

                    +
                  </button>

                  >(روی یک سلول کلیک کنید، سپس رنگ را انتخاب کنید)</span
                >

              <div class="table-preview-wrap" id="tablePreviewWrap">
                <table id="previewTable">
                  <thead>
                    <tr>
                      <th>حرکت سفید</th>
                      <th>حرکت سیاه</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>e4</td>
                      <td>e5</td>
                    </tr>
                    <tr>
                      <td>Nf3</td>
                      <td>Nc6</td>
                    </tr>
                    <tr>
                      <td>Bb5</td>
                      <td>a6</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="panel-actions">
                <button
                  class="btn-sm btn-sm-primary"
                  id="insertTableToEditorBtn"
                >
                  <i class="fas fa-check"></i> درج جدول در محتوا
                </button>
                <button class="btn-sm btn-sm-secondary" id="closeTablePanelBtn">
                  <i class="fas fa-times"></i> بستن
                </button>
                <button class="btn-sm btn-sm-warning" id="resetTableBtn">
                  <i class="fas fa-undo"></i> بازنشانی جدول
                </button>

            <!-- منطقه ویرایش -->
            <div
              class="editor-area"
              id="editorArea"
              contenteditable="true"
              spellcheck="false"
            ></div>
          </div>
        </div>

        <!-- پیش‌نمایش -->
        <div class="preview-section">
          <h4>👁️ پیش‌نمایش محتوا</h4>
          <div class="preview-content" id="previewContent"></div>
        </div>

        <div class="btn-group">
          <button class="btn btn-secondary" onclick="resetForm()">
            <i class="fas fa-undo"></i> پاک کردن
          </button>
          <button class="btn btn-success" onclick="exportJSON()">
            <i class="fas fa-download"></i> خروجی JSON
          </button>
        </div>

      <div id="footer-placeholder"></div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer">
      <div class="toast" id="toast"></div>
    </div>

    <script src="js/script.js"></script>
    <script>
      (function () {
        "use strict";

        // ===== اعمال تم =====
        (function applySavedTheme() {
          try {
            const settings = JSON.parse(
              localStorage.getItem("chesshub_settings"),
            );
            if (settings && settings.theme) {
              document.body.className = document.body.className
                .split(" ")
                .filter((c) => !c.startsWith("theme-"))
                .join(" ");
              document.body.classList.add(`theme-${settings.theme}`);
            }
          } catch (e) {}
        })();

        // ===== لیست آیکن‌ها (۲۰ عدد) =====
        const ICONS = [
          "fas fa-book-open",
          "fas fa-chess-queen",
          "fas fa-chess-king",
          "fas fa-chess-rook",
          "fas fa-chess-bishop",
          "fas fa-chess-knight",
          "fas fa-chess-pawn",
          "fas fa-chess-board",
          "fas fa-flag-checkered",
          "fas fa-crown",
          "fas fa-shield-alt",
          "fas fa-bolt",
          "fas fa-fire",
          "fas fa-brain",
          "fas fa-crosshairs",
          "fas fa-bullseye",
          "fas fa-graduation-cap",
          "fas fa-puzzle-piece",
          "fas fa-lightbulb",
          "fas fa-star",
        ];

        // ===== لیست رنگ‌ها (۲۰ عدد) =====
        const COLORS = [
          "#2c7da0",
          "#10b981",
          "#f59e0b",
          "#8b5cf6",
          "#ef4444",
          "#3b82f6",
          "#ec4899",
          "#14b8a6",
          "#f97316",
          "#6366f1",
          "#22d3ee",
          "#a855f7",
          "#34d399",
          "#f472b6",
          "#fb923c",
          "#60a5fa",
          "#a78bfa",
          "#4ade80",
          "#f87171",
          "#94a3b8",
        ];

        // ===== رنگ‌های سلول جدول =====
        const CELL_COLORS = [
          "#ffffff",
          "#fef3c7",
          "#d1fae5",
          "#dbeafe",
          "#fee2e2",
          "#f3e8ff",
          "#fce7f3",
          "#e0f2fe",
          "#ffedd5",
          "#ecfdf5",
        ];

        // ===== DOM refs =====
        const editorArea = document.getElementById("editorArea");
        const previewContent = document.getElementById("previewContent");
        const iconGrid = document.getElementById("iconGrid");
        const colorGrid = document.getElementById("colorGrid");
        const selectedIconInput = document.getElementById("selectedIcon");
        const selectedColorInput = document.getElementById("selectedColor");
        const tablePanel = document.getElementById("tablePanel");
        const previewTable = document.getElementById("previewTable");
        const textColorPicker = document.getElementById("textColorPicker");
        const bgColorPicker = document.getElementById("bgColorPicker");
        const cellColorPalette = document.getElementById("cellColorPalette");

        let selectedIcon = "fas fa-book-open";
        let selectedColor = "#2c7da0";
        let currentCellColor = "#fef3c7";
        let selectedTableCell = null;
        let tableRowCount = 3;
        let tableColCount = 2;

        // ===== ساخت آیکن‌ها =====
        function buildIconGrid() {
          iconGrid.innerHTML = "";
          ICONS.forEach((icon) => {
            const btn = document.createElement("button");
            btn.className =
              "icon-btn" + (icon === selectedIcon ? " active" : "");
            btn.innerHTML = `<i class="${icon}"></i>`;
            btn.dataset.icon = icon;
            btn.addEventListener("click", function () {
              iconGrid
                .querySelectorAll(".icon-btn")
                .forEach((b) => b.classList.remove("active"));
              this.classList.add("active");
              selectedIcon = this.dataset.icon;
              selectedIconInput.value = selectedIcon;
            });
            iconGrid.appendChild(btn);
          });
        }

        // ===== ساخت رنگ‌ها =====
        function buildColorGrid() {
          colorGrid.innerHTML = "";
          COLORS.forEach((color) => {
            const btn = document.createElement("button");
            btn.className =
              "color-btn" + (color === selectedColor ? " active" : "");
            btn.style.background = color;
            btn.dataset.color = color;
            if (color === selectedColor) {
              btn.innerHTML = `<span class="check"><i class="fas fa-check"></i></span>`;
            }
            btn.addEventListener("click", function () {
              colorGrid.querySelectorAll(".color-btn").forEach((b) => {
                b.classList.remove("active");
                b.innerHTML = "";
              });
              this.classList.add("active");
              this.innerHTML = `<span class="check"><i class="fas fa-check"></i></span>`;
              selectedColor = this.dataset.color;
              selectedColorInput.value = selectedColor;
            });
            colorGrid.appendChild(btn);
          });
        }

        // ===== ساخت رنگ‌های سلول =====
        function buildCellColorPalette() {
          cellColorPalette.innerHTML = "";
          CELL_COLORS.forEach((c) => {
            const btn = document.createElement("button");
            btn.className =
              "cc-btn" + (c === currentCellColor ? " active" : "");
            btn.style.background = c;
            if (c === "#ffffff") btn.style.border = "2px solid #dde4ec";
            if (c === currentCellColor) {
              btn.innerHTML = `<span class="cc-check"><i class="fas fa-check"></i></span>`;
            }
            btn.addEventListener("click", function () {
              cellColorPalette.querySelectorAll(".cc-btn").forEach((b) => {
                b.classList.remove("active");
                b.innerHTML = "";
                if (
                  b.style.background === "rgb(255, 255, 255)" ||
                  b.style.background === "#ffffff"
                ) {
                  b.style.border = "2px solid #dde4ec";
                }
              });
              this.classList.add("active");
              this.innerHTML = `<span class="cc-check"><i class="fas fa-check"></i></span>`;
              currentCellColor = c;
              applyColorToSelectedCell();
            });
            cellColorPalette.appendChild(btn);
          });
        }

        function applyColorToSelectedCell() {
          if (selectedTableCell && selectedTableCell.tagName) {
            selectedTableCell.style.background = currentCellColor;
          }
        }

        // ===== ساخت/بازسازی جدول پیش‌نمایش =====
        function rebuildPreviewTable() {
          const thead = previewTable.querySelector("thead");
          const tbody = previewTable.querySelector("tbody");
          thead.innerHTML = "";
          tbody.innerHTML = "";

          const headerRow = document.createElement("tr");
          for (let c = 0; c < tableColCount; c++) {
            const th = document.createElement("th");
            th.textContent =
              c === 0 ? "حرکت سفید" : c === 1 ? "حرکت سیاه" : "عنوان";
            th.style.background = "#e8f0f6";
            th.addEventListener("click", function () {
              selectPreviewCell(th);
            });
            headerRow.appendChild(th);
          }
          thead.appendChild(headerRow);

          for (let r = 0; r < tableRowCount; r++) {
            const tr = document.createElement("tr");
            for (let c = 0; c < tableColCount; c++) {
              const td = document.createElement("td");
              td.textContent = getDefaultCellText(r, c);
              td.addEventListener("click", function () {
                selectPreviewCell(td);
              });
              tr.appendChild(td);
            }
            tbody.appendChild(tr);
          }
          selectedTableCell = null;
        }

        function getDefaultCellText(row, col) {
          const moves = [
            ["e4", "e5"],
            ["Nf3", "Nc6"],
            ["Bb5", "a6"],
            ["O-O", "Nf6"],
            ["Re1", "Be7"],
            ["c3", "O-O"],
          ];
          if (row < moves.length && col < moves[row].length) {
            return moves[row][col];
          }
          return "...";
        }

        function selectPreviewCell(cell) {
          previewTable
            .querySelectorAll("th.selected-cell, td.selected-cell")
            .forEach((c) => c.classList.remove("selected-cell"));
          cell.classList.add("selected-cell");
          selectedTableCell = cell;
        }

        function changeRows(delta) {
          const newCount = tableRowCount + delta;
          if (newCount < 1 || newCount > 20) return;
          tableRowCount = newCount;
          document.getElementById("rowCountDisplay").textContent =
            tableRowCount;
          rebuildPreviewTable();
        }

        function changeCols(delta) {
          const newCount = tableColCount + delta;
          if (newCount < 1 || newCount > 10) return;
          tableColCount = newCount;
          document.getElementById("colCountDisplay").textContent =
            tableColCount;
          rebuildPreviewTable();
        }

        // ===== درج تگ در ویرایشگر =====
        function insertTag(tag) {
          const selection = window.getSelection();
          let range;
          if (
            selection.rangeCount > 0 &&
            !selection.isCollapsed &&
            editorArea.contains(selection.anchorNode)
          ) {
            range = selection.getRangeAt(0);
          } else {
            range = document.createRange();
            const lastChild = editorArea.lastChild;
            if (lastChild) {
              range.setStartAfter(lastChild);
            } else {
              range.setStart(editorArea, 0);
            }
            range.collapse(false);
          }

          const wrapper = document.createElement("div");
          wrapper.style.margin = "0.3rem 0";
          let content = "";
          switch (tag) {
            case "h3":
              content = "<h3>عنوان اصلی</h3>";
              break;
            case "h4":
              content = "<h4>عنوان فرعی</h4>";
              break;
            case "p":
              content = "<p>متن پاراگراف...</p>";
              break;
            case "ul":
              content = "<ul><li>مورد اول</li><li>مورد دوم</li></ul>";
              break;
            case "ol":
              content = "<ol><li>مورد اول</li><li>مورد دوم</li></ol>";
              break;
            case "blockquote":
              content = "<blockquote>نقل قول...</blockquote>";
              break;
            case "code":
              content = "<code>کد نمونه</code>";
              break;
            case "hr":
              content = "<hr />";
              break;
            default:
              return;
          }
          wrapper.innerHTML = content;
          range.deleteContents();
          range.insertNode(wrapper);
          range.setStartAfter(wrapper);
          range.collapse(true);
          selection.removeAllRanges();
          selection.addRange(range);
          editorArea.focus();
          updatePreview();
        }

        // ===== درج تصویر (فقط لینک) =====
        function insertImage(url) {
          const selection = window.getSelection();
          let range;
          if (
            selection.rangeCount > 0 &&
            !selection.isCollapsed &&
            editorArea.contains(selection.anchorNode)
          ) {
            range = selection.getRangeAt(0);
          } else {
            range = document.createRange();
            const lastChild = editorArea.lastChild;
            if (lastChild) {
              range.setStartAfter(lastChild);
            } else {
              range.setStart(editorArea, 0);
            }
            range.collapse(false);
          }
          const img = document.createElement("img");
          img.src = url;
          img.style.maxWidth = "100%";
          img.style.borderRadius = "8px";
          img.style.margin = "0.3rem 0";
          img.alt = "تصویر شطرنج";
          const wrapper = document.createElement("div");
          wrapper.style.margin = "0.3rem 0";
          wrapper.appendChild(img);
          range.deleteContents();
          range.insertNode(wrapper);
          range.setStartAfter(wrapper);
          range.collapse(true);
          selection.removeAllRanges();
          selection.addRange(range);
          editorArea.focus();
          updatePreview();
          showToast("✅ تصویر درج شد", "success");
        }

        // ===== درج جدول در ویرایشگر =====
        function insertTableIntoEditor() {
          const tableClone = previewTable.cloneNode(true);
          tableClone.querySelectorAll("th, td").forEach((cell) => {
            cell.classList.remove("selected-cell");
            cell.removeAttribute("contenteditable");
          });
          tableClone.style.width = "100%";
          tableClone.style.borderCollapse = "collapse";
          tableClone.style.margin = "0.5rem 0";
          tableClone.style.fontSize = "0.85rem";
          tableClone.querySelectorAll("th").forEach((th) => {
            th.style.background = th.style.background || "#e8f0f6";
            th.style.color = "#1a5a78";
            th.style.padding = "0.4rem 0.8rem";
            th.style.border = "1px solid #dde4ec";
            th.style.fontWeight = "700";
            th.style.cursor = "default";
          });
          tableClone.querySelectorAll("td").forEach((td) => {
            td.style.padding = "0.4rem 0.8rem";
            td.style.border = "1px solid #dde4ec";
            td.style.cursor = "default";
          });

          const wrapper = document.createElement("div");
          wrapper.style.margin = "0.3rem 0";
          wrapper.appendChild(tableClone);

          const selection = window.getSelection();
          let range;
          if (
            selection.rangeCount > 0 &&
            !selection.isCollapsed &&
            editorArea.contains(selection.anchorNode)
          ) {
            range = selection.getRangeAt(0);
          } else {
            range = document.createRange();
            const lastChild = editorArea.lastChild;
            if (lastChild) {
              range.setStartAfter(lastChild);
            } else {
              range.setStart(editorArea, 0);
            }
            range.collapse(false);
          }
          range.deleteContents();
          range.insertNode(wrapper);
          range.setStartAfter(wrapper);
          range.collapse(true);
          selection.removeAllRanges();
          selection.addRange(range);
          editorArea.focus();

          tablePanel.style.display = "none";
          showToast("✅ جدول در محتوا درج شد", "success");
          updatePreview();
        }

        // ===== پیش‌نمایش =====
        function updatePreview() {
          previewContent.innerHTML = editorArea.innerHTML;
        }
        editorArea.addEventListener("input", updatePreview);
        editorArea.addEventListener("keyup", updatePreview);
        editorArea.addEventListener("click", updatePreview);

        // ===== Toast =====
        function showToast(text, type = "success") {
          const toast = document.getElementById("toast");
          if (!toast) return;
          toast.textContent = text;
          toast.className = "toast show " + type;
          clearTimeout(toast._timeout);
          toast._timeout = setTimeout(
            () => toast.classList.remove("show"),
            4000,
          );
        }

        // ===== ریست فرم =====
        function resetForm() {
          if (!confirm("آیا مطمئنی؟ تمام اطلاعات فرم پاک می‌شود.")) return;
          document
            .querySelectorAll(
              "#coopForm input:not([type=hidden]):not([type=color]), #coopForm select",
            )
            .forEach((el) => {
              if (el.tagName === "SELECT") el.selectedIndex = 0;
              else if (el.type !== "color") el.value = "";
            });
          document.getElementById("lessonCategory").selectedIndex = 0;
          document.getElementById("lessonLevel").selectedIndex = 0;
          editorArea.innerHTML = "";
          previewContent.innerHTML = "";
          tablePanel.style.display = "none";
          selectedIcon = "fas fa-book-open";
          selectedIconInput.value = selectedIcon;
          buildIconGrid();
          selectedColor = "#2c7da0";
          selectedColorInput.value = selectedColor;
          buildColorGrid();
          tableRowCount = 3;
          tableColCount = 2;
          currentCellColor = "#fef3c7";
          document.getElementById("rowCountDisplay").textContent =
            tableRowCount;
          document.getElementById("colCountDisplay").textContent =
            tableColCount;
          rebuildPreviewTable();
          buildCellColorPalette();
          selectedTableCell = null;
          showToast("🔄 فرم پاک شد", "warning");
        }

        // ===== خروجی JSON =====
        function exportJSON() {
          const title = document.getElementById("lessonTitle").value.trim();
          const category = document.getElementById("lessonCategory").value;
          const level = document.getElementById("lessonLevel").value;
          const duration = document
            .getElementById("lessonDuration")
            .value.trim();
          const description = document
            .getElementById("lessonDescription")
            .value.trim();
          const icon = selectedIconInput.value;
          const color = selectedColorInput.value;
          const content = editorArea.innerHTML.trim();

          if (!title) {
            showToast("❌ لطفاً عنوان درس را وارد کنید", "error");
            return;
          }
          if (!duration) {
            showToast("❌ لطفاً مدت زمان را وارد کنید", "error");
            return;
          }
          if (!description) {
            showToast("❌ لطفاً توضیحات را وارد کنید", "error");
            return;
          }
          if (!content) {
            showToast("❌ لطفاً محتوای درس را وارد کنید", "error");
            return;
          }

          const existingLessons = window.lessons || [];
          const newId = existingLessons.length + 1;
          const lessonData = {
            id: newId,
            title: title,
            category: category,
            level: level,
            description: description,
            duration: duration,
            thumbIcon: icon,
            color: color,
            content: content,
          };

          const json = JSON.stringify(lessonData, null, 2);
          const blob = new Blob([json], {
            type: "application/json;charset=utf-8",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `lesson_${title.replace(/\s+/g, "_")}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast(`✅ فایل JSON با موفقیت دانلود شد! (${title})`, "success");
        }

        // ===== صادرات توابع =====
        window.resetForm = resetForm;
        window.exportJSON = exportJSON;

        // ===== رویدادهای toolbar =====
        document
          .querySelectorAll(".editor-toolbar .tool-btn[data-tag]")
          .forEach((btn) => {
            btn.addEventListener("click", function () {
              const tag = this.dataset.tag;
              insertTag(tag);
            });
          });

        document
          .getElementById("imageBtn")
          .addEventListener("click", function () {
            const url = prompt(
              "لینک تصویر را وارد کنید:",
              "https://via.placeholder.com/400x200?text=Chess",
            );
            if (url && url.trim()) insertImage(url.trim());
          });

        document
          .getElementById("applyColorBtn")
          .addEventListener("click", function () {
            const selection = window.getSelection();
            if (
              selection.rangeCount === 0 ||
              selection.isCollapsed ||
              !editorArea.contains(selection.anchorNode)
            ) {
              showToast(
                "لطفاً ابتدا متن مورد نظر را در ویرایشگر انتخاب کنید",
                "warning",
              );
              return;
            }
            const range = selection.getRangeAt(0);
            try {
              const span = document.createElement("span");
              span.style.color = textColorPicker.value;
              span.style.background = bgColorPicker.value;
              span.style.padding = "0.1rem 0.25rem";
              span.style.borderRadius = "4px";
              range.surroundContents(span);
              showToast("✅ رنگ اعمال شد", "success");
              updatePreview();
            } catch (e) {
              showToast(
                "⚠️ لطفاً فقط یک بخش ساده از متن را انتخاب کنید",
                "error",
              );
            }
          });

        // ===== پنل جدول =====
        document
          .getElementById("toggleTablePanelBtn")
          .addEventListener("click", function () {
            if (tablePanel.style.display === "block") {
              tablePanel.style.display = "none";
            } else {
              tablePanel.style.display = "block";
              rebuildPreviewTable();
              buildCellColorPalette();
              selectedTableCell = null;
              tablePanel.scrollIntoView({
                behavior: "smooth",
                block: "nearest",
              });
            }
          });

        document
          .getElementById("closeTablePanelBtn")
          .addEventListener("click", function () {
            tablePanel.style.display = "none";
          });

        document
          .getElementById("incRowsBtn")
          .addEventListener("click", () => changeRows(1));
        document
          .getElementById("decRowsBtn")
          .addEventListener("click", () => changeRows(-1));
        document
          .getElementById("incColsBtn")
          .addEventListener("click", () => changeCols(1));
        document
          .getElementById("decColsBtn")
          .addEventListener("click", () => changeCols(-1));

        document
          .getElementById("insertTableToEditorBtn")
          .addEventListener("click", insertTableIntoEditor);

        document
          .getElementById("resetTableBtn")
          .addEventListener("click", function () {
            tableRowCount = 3;
            tableColCount = 2;
            currentCellColor = "#fef3c7";
            document.getElementById("rowCountDisplay").textContent =
              tableRowCount;
            document.getElementById("colCountDisplay").textContent =
              tableColCount;
            rebuildPreviewTable();
            buildCellColorPalette();
            selectedTableCell = null;
            showToast("🔄 جدول بازنشانی شد", "warning");
          });

        // ===== مقداردهی اولیه =====
        document.addEventListener("DOMContentLoaded", function () {
          buildIconGrid();
          buildColorGrid();
          buildCellColorPalette();
          rebuildPreviewTable();
          document.getElementById("rowCountDisplay").textContent =
            tableRowCount;
          document.getElementById("colCountDisplay").textContent =
            tableColCount;
          console.log("✅ ChessHub Cooperation loaded successfully");
        });

        // ===== بستن پنل جدول با کلیک خارج =====
        document.addEventListener("click", function (e) {
          if (tablePanel.style.display === "block") {
            const isInsidePanel = tablePanel.contains(e.target);
            const isTableBtn = e.target.closest("#toggleTablePanelBtn");
            if (!isInsidePanel && !isTableBtn) {
              const isInEditor = e.target.closest(".editor-wrapper");
              if (!isInEditor) {
                tablePanel.style.display = "none";
              }
            }
          }
        });
      })();
    </script>
  </body>
</html>
