<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>ChessHub | خانه</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
      .home-grid {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        gap: 30px;
      }
      @media (max-width: 900px) {
        .home-grid {
          grid-template-columns: 1fr;
        }
      }
      .puzzle-card {
        background: white;
        border-radius: 32px;
        padding: 25px;
        text-align: center;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
      }
      .puzzle-card h2 {
        color: #2c7da0;
        margin-bottom: 5px;
      }
      #chessboard {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        aspect-ratio: 1 / 1;
        max-width: 500px;
        margin: 20px auto;
        border: 2px solid #cbd5e1;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      }
      .board-locked {
        opacity: 0.6;
        pointer-events: none;
      }
      .square {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .square.light {
        background-color: #f0d9b5;
      }
      .square.dark {
        background-color: #b58863;
      }
      .square.selected {
        background-color: #b7d968;
        box-shadow: inset 0 0 0 2px #2c7da0;
      }
      .piece-img {
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .features {
        background: white;
        border-radius: 32px;
        padding: 25px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.05);
      }
      .features h3 {
        margin-bottom: 20px;
        color: #2c7da0;
        border-right: 4px solid #2c7da0;
        padding-right: 12px;
      }
      .features-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 18px;
      }
      .feature {
        background: #f8fafc;
        border-radius: 24px;
        padding: 15px;
        text-align: center;
        transition: 0.2s;
      }
      .feature:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
      }
      .feature i {
        font-size: 2rem;
        color: #2c7da0;
        margin-bottom: 8px;
      }
      .feature h4 {
        font-size: 1rem;
        margin: 8px 0;
      }
      .feature a {
        text-decoration: none;
        color: #2c7da0;
        font-size: 0.8rem;
        font-weight: bold;
      }
      @media (max-width: 768px) {
        #chessboard {
          max-width: 100%;
        }
        .puzzle-card {
          padding: 15px;
        }
        .features {
          padding: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <div class="home-grid">
        <div class="puzzle-card">
          <h2><i class="fas fa-puzzle-piece"></i> مسئله روز</h2>
          <p>
            شما با مهره‌های <strong>سیاه</strong> بازی می‌کنید. بهترین حرکت را
            پیدا کنید.
          </p>
          <div id="chessboard"></div>
          <div>
            <button id="resetBtn" class="btn">
              <i class="fas fa-undo-alt"></i> از نو
            </button>
            <button id="hintBtn" class="btn btn-hint">
              <i class="fas fa-lightbulb"></i> راهنمایی
            </button>
          </div>
          <div id="message" class="message"></div>
        </div>
        <div class="features">
          <h3><i class="fas fa-star-of-life"></i> امکانات ChessHub</h3>
          <div class="features-grid">
            <div class="feature">
              <i class="fas fa-book-open"></i>
              <h4>دروس آموزشی</h4>
              <a href="lessons.html">مشاهده</a>
            </div>
            <div class="feature">
              <i class="fas fa-chart-line"></i>
              <h4>آنالیز</h4>
              <a href="analysis.html">شروع</a>
            </div>
            <div class="feature">
              <i class="fas fa-database"></i>
              <h4>پایگاه بازی‌ها</h4>
              <a href="games-database.html">جستجو</a>
            </div>
            <div class="feature">
              <i class="fas fa-download"></i>
              <h4>دانلود PGN</h4>
              <a href="downloads.html">دریافت</a>
            </div>
            <div class="feature">
              <i class="fas fa-language"></i>
              <h4>ترجمه کتاب</h4>
              <a href="book-translate.html">کتاب‌ها</a>
            </div>
            <div class="feature">
              <i class="fas fa-chess-board"></i>
              <h4>تمرین و گشایش</h4>
              <a href="practice.html">تمرین</a>
            </div>
          </div>
        </div>
      </div>

      <div id="footer-placeholder"></div>
    </div>

    <script src="js/script.js"></script>
    <script>
      // ========== تنظیمات پازل (کاربر = سیاه) ==========
      const USER_COLOR = "b";
      const puzzleMoves = [
        { color: "b", san: "Rg6+" },
        { color: "w", san: "Kh1" },
        { color: "b", san: "Qxh2+" },
        { color: "w", san: "Kxh2" },
        { color: "b", san: "Kg7" },
        { color: "w", san: "f4" },
        { color: "b", san: "Rh8+" },
        { color: "w", san: "Qh5" },
        { color: "b", san: "Rxh5#" },
      ];
      const initialFen = "4r1k1/8/ppr5/2p5/1P1P1q2/5P2/1P5P/R2Q1RK1 b - - 0 1";

      // ========== متغیرهای اصلی ==========
      let game = new Chess(initialFen);
      let selectedSquare = null;
      let currentMoveIndex = 0;
      let puzzleFinished = false;
      let autoMoveTimeout = null;
      let wrongAttempts = 0;
      let isLocked = false;
      let lockTimer = null;

      const boardDiv = document.getElementById("chessboard");
      const msgDiv = document.getElementById("message");
      const resetBtn = document.getElementById("resetBtn");
      const hintBtn = document.getElementById("hintBtn");

      // ========== تابع تبدیل مختصات کلیک به نام خانه شطرنجی ==========
      // با فرض orientation = 'black' (سیاه پایین صفحه)
      function getSquareFromClick(clientX, clientY) {
        const rect = boardDiv.getBoundingClientRect();
        const cellW = rect.width / 8;
        const cellH = rect.height / 8;
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        if (x < 0 || x > rect.width || y < 0 || y > rect.height) return null;
        const col = Math.floor(x / cellW);
        const row = Math.floor(y / cellH);
        // از دید سیاه: ستون‌ها برعکس می‌شوند (چپ و راست) و سطرها هم برعکس
        const fileIndex = 7 - col; // 0 -> h, 7 -> a
        const rankIndex = 7 - row; // 0 -> rank 8, 7 -> rank 1
        const file = String.fromCharCode(97 + fileIndex);
        const rank = rankIndex + 1;
        return file + rank;
      }

      // ========== تابع رسم تخته با جهت سیاه ==========
      function renderBoard() {
        const board = game.board();
        boardDiv.innerHTML = "";
        boardDiv.style.display = "grid";
        boardDiv.style.gridTemplateColumns = "repeat(8, 1fr)";

        // برای دید سیاه: ردیف‌ها را از پایین به بالا و ستون‌ها را از راست به چپ رسم می‌کنیم
        for (let row = 7; row >= 0; row--) {
          // ردیف 7 (rank1) پایین صفحه
          for (let col = 7; col >= 0; col--) {
            // ستون 7 (h-file) سمت راست صفحه
            const piece = board[row][col];
            const isLight = (row + col) % 2 === 0;
            const squareDiv = document.createElement("div");
            squareDiv.className = `square ${isLight ? "light" : "dark"}`;
            // ذخیره نام واقعی خانه (از دید سفید) برای استفاده در کلیک
            const file = String.fromCharCode(97 + col);
            const rank = 8 - row;
            const squareName = file + rank;
            squareDiv.dataset.square = squareName;
            if (piece) {
              const pieceType = piece.type.toUpperCase();
              const colorCode = piece.color === "w" ? "w" : "b";
              let pieceCode = "";
              switch (pieceType) {
                case "K":
                  pieceCode = "K";
                  break;
                case "Q":
                  pieceCode = "Q";
                  break;
                case "R":
                  pieceCode = "R";
                  break;
                case "B":
                  pieceCode = "B";
                  break;
                case "N":
                  pieceCode = "N";
                  break;
                case "P":
                  pieceCode = "P";
                  break;
              }
              const img = document.createElement("img");
              img.src = `pieces/merida/${colorCode}${pieceCode}.svg`;
              img.classList.add("piece-img");
              squareDiv.appendChild(img);
            }
            squareDiv.addEventListener("click", () =>
              onSquareClick(squareName),
            );
            boardDiv.appendChild(squareDiv);
          }
        }

        if (selectedSquare) {
          const selectedEl = document.querySelector(
            `.square[data-square="${selectedSquare}"]`,
          );
          if (selectedEl) selectedEl.classList.add("selected");
        }
      }

      // ========== توابع کمکی ==========
      function showMessage(text, type) {
        msgDiv.textContent = text;
        msgDiv.className = `message ${type}`;
        setTimeout(() => {
          if (msgDiv.textContent === text) msgDiv.className = "message";
        }, 3000);
      }

      function lockBoard() {
        if (isLocked) return;
        isLocked = true;
        boardDiv.classList.add("board-locked");
        hintBtn.disabled = true;
        showMessage("⏳ اول فکر کن بعد حرکت کن! ۳۰ ثانیه صبر کن...", "lock");
        lockTimer = setTimeout(() => {
          isLocked = false;
          boardDiv.classList.remove("board-locked");
          hintBtn.disabled = false;
          wrongAttempts = 0;
          showMessage(
            "✅ زمان به پایان رسید. دوباره می‌توانی حرکت کنی (سه فرصت جدید).",
            "success",
          );
          lockTimer = null;
        }, 30000);
      }

      function unlockBoard() {
        if (lockTimer) clearTimeout(lockTimer);
        isLocked = false;
        boardDiv.classList.remove("board-locked");
        hintBtn.disabled = false;
      }

      function resetPuzzle() {
        if (autoMoveTimeout) clearTimeout(autoMoveTimeout);
        unlockBoard();
        game = new Chess(initialFen);
        selectedSquare = null;
        currentMoveIndex = 0;
        puzzleFinished = false;
        wrongAttempts = 0;
        renderBoard();
        msgDiv.textContent = "";
        if (
          !puzzleFinished &&
          currentMoveIndex < puzzleMoves.length &&
          puzzleMoves[currentMoveIndex].color !== USER_COLOR
        ) {
          autoComputerMove();
        }
      }

      function autoComputerMove() {
        if (puzzleFinished) return;
        if (currentMoveIndex >= puzzleMoves.length) return;
        const move = puzzleMoves[currentMoveIndex];
        if (move.color === USER_COLOR) return;
        try {
          const result = game.move(move.san, { sloppy: true });
          if (result) {
            renderBoard();
            currentMoveIndex++;
            if (game.game_over() && game.in_checkmate()) {
              showMessage("🎉 مات! پازل با موفقیت حل شد.", "success");
              puzzleFinished = true;
            }
          } else {
            console.error("خطا در اجرای حرکت خودکار:", move.san);
            showMessage("خطا در دنباله پازل. دکمه از نو را بزنید.", "error");
          }
        } catch (e) {
          console.error(e);
        }
      }

      function onSquareClick(squareName) {
        if (puzzleFinished) {
          showMessage("پازل تمام شده، از نو را بزنید.", "info");
          return;
        }
        if (isLocked) {
          showMessage("صبر کن! فعلاً نمی‌توانی حرکت کنی.", "info");
          return;
        }
        if (game.turn() !== USER_COLOR) {
          showMessage("الان نوبت کامپیوتر است، کمی صبر کن...", "info");
          return;
        }
        if (currentMoveIndex >= puzzleMoves.length) {
          showMessage("پازل کامل شده!", "success");
          return;
        }
        const expectedMove = puzzleMoves[currentMoveIndex];
        if (expectedMove.color !== USER_COLOR) {
          showMessage("الان نوبت کامپیوتر است!", "info");
          return;
        }
        if (!selectedSquare) {
          const piece = game.get(squareName);
          if (piece && piece.color === USER_COLOR) {
            selectedSquare = squareName;
            renderBoard();
          } else {
            showMessage(
              `مهره ${USER_COLOR === "b" ? "سیاه" : "سفید"} خود را انتخاب کنید.`,
              "error",
            );
          }
          return;
        }
        const move = { from: selectedSquare, to: squareName, promotion: "q" };
        try {
          const result = game.move(move);
          if (result) {
            selectedSquare = null;
            renderBoard();
            if (result.san === expectedMove.san) {
              showMessage(`✅ حرکت صحیح: ${result.san}`, "success");
              wrongAttempts = 0;
              currentMoveIndex++;
              if (game.game_over() && game.in_checkmate()) {
                showMessage("🎉 مات! پازل حل شد.", "success");
                puzzleFinished = true;
                return;
              }
              if (autoMoveTimeout) clearTimeout(autoMoveTimeout);
              autoMoveTimeout = setTimeout(() => {
                if (
                  currentMoveIndex < puzzleMoves.length &&
                  puzzleMoves[currentMoveIndex].color !== USER_COLOR
                ) {
                  autoComputerMove();
                }
                autoMoveTimeout = null;
              }, 300);
            } else {
              wrongAttempts++;
              if (wrongAttempts >= 3) {
                lockBoard();
                game.undo();
                renderBoard();
                selectedSquare = null;
              } else {
                showMessage(`❌ حرکت اشتباه (${wrongAttempts}/3)`, "error");
                game.undo();
                renderBoard();
                selectedSquare = null;
              }
            }
          } else {
            showMessage("حرکت غیرمجاز", "error");
            selectedSquare = null;
            renderBoard();
          }
        } catch (e) {
          showMessage("خطا در حرکت", "error");
          selectedSquare = null;
          renderBoard();
        }
      }

      function showHint() {
        if (puzzleFinished) {
          showMessage("پازل حل شده، ریست کنید.", "info");
          return;
        }
        if (isLocked) {
          showMessage("الان نمی‌توانی راهنمایی بگیری، کمی صبر کن.", "info");
          return;
        }
        if (game.turn() !== USER_COLOR) {
          showMessage("لطفاً صبر کنید نوبت شماست.", "info");
          return;
        }
        if (
          currentMoveIndex < puzzleMoves.length &&
          puzzleMoves[currentMoveIndex].color === USER_COLOR
        ) {
          const expected = puzzleMoves[currentMoveIndex].san;
          showMessage(`💡 حرکت بعدی باید: ${expected}`, "hint");
        } else {
          showMessage("در حال حرکت کامپیوتر است!", "info");
        }
      }

      resetBtn.addEventListener("click", resetPuzzle);
      hintBtn.addEventListener("click", showHint);
      resetPuzzle();
    </script>
  </body>
</html>
