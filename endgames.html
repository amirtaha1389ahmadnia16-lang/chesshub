<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="تمرین آخر بازی‌های شطرنج با سیستم راهنمایی هوشمند"
    />
    <title>ChessHub | آخربازی‌ها</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/endgames.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <section class="app-hero">
        <h1><i class="fas fa-flag-checkered"></i> تمرین آخربازی هوشمند</h1>
        <p>
          موقعیت‌ها را حل کن و اگر گیر کردی، از موتور استوک‌فیش راهنمایی بگیر!
        </p>
      </section>

      <div class="endgame-container">
        <!-- نوار وضعیت بالایی -->
        <div class="endgame-stats-bar">
          <span id="positionCounter"
            ><i class="fas fa-map-marker-alt"></i> 1</span
          >
          <span id="moveCount"><i class="fas fa-exchange-alt"></i> 0</span>
          <span id="turnDisplay"><i class="fas fa-user"></i> شما</span>
        </div>

        <!-- تخته و پنل راهنما -->
        <div class="endgame-layout">
          <div class="board-container-endgame">
            <div id="chessboard"></div>
          </div>

          <div class="endgame-side-panel">
            <div class="panel-card">
              <h3><i class="fas fa-info-circle"></i> اطلاعات موقعیت</h3>
              <div class="info-list">
                <p>نام موقعیت: <strong id="egName">-</strong></p>
                <p>هدف: <strong id="egGoal">برد سفید</strong></p>
                <p>نوبت: <strong id="egTurn">-</strong></p>
              </div>
            </div>

            <div class="panel-card hint-card">
              <h3><i class="fas fa-lightbulb"></i> راهنمایی هوشمند</h3>
              <p class="hint-text">
                اگر در انجام حرکت مردد هستی، روی دکمه زیر بزن تا موتور استوک‌فیش
                بهترین حرکت را به تو نشان دهد.
              </p>
              <button id="hintBtn" class="btn btn-hint">
                <i class="fas fa-lightbulb"></i> نمایش حرکت بهینه
              </button>
            </div>

            <div class="control-buttons">
              <button id="undoBtn" class="btn">
                <i class="fas fa-undo"></i> برگشت
              </button>
              <button id="resetBtn" class="btn">
                <i class="fas fa-redo"></i> از نو
              </button>
              <button id="nextBtn" class="btn btn-primary">
                <i class="fas fa-forward"></i> بعدی
              </button>
            </div>
          </div>
        </div>

        <div id="message" class="rush-message"></div>
      </div>

      <div id="footer-placeholder"></div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/endgames.js"></script>
  </body>
</html>
