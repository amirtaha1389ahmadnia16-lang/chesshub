<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>ChessHub | آخربازی ها</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
      /* استایل‌های مخصوص صفحه تمرین آخر بازی */
      .training-card {
        background: white;
        border-radius: 32px;
        overflow: hidden;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
        position: relative;
        z-index: 1;
      }
      .card-header {
        background: linear-gradient(115deg, #1a4b6e, #2a7f9c);
        padding: 24px 32px;
        text-align: center;
      }
      .card-header h2 {
        color: white;
        font-size: 1.8rem;
        font-weight: 800;
      }
      .card-header p {
        color: rgba(255, 255, 255, 0.9);
        margin-top: 6px;
      }
      .card-body {
        padding: 28px;
      }
      .top-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
      }
      .endgame-selector {
        flex: 2;
        min-width: 240px;
      }
      .endgame-selector select {
        width: 100%;
        padding: 12px 20px;
        border-radius: 60px;
        border: 1px solid #cbd5e1;
        font-family: "Vazir";
        background: white;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
      }
      .stats {
        display: flex;
        gap: 20px;
        background: #f8fafc;
        padding: 8px 24px;
        border-radius: 60px;
        font-weight: 700;
        color: #1e3b4f;
        align-items: center;
        flex-wrap: wrap;
      }
      .auto-timer {
        background: #2c7da0;
        color: white;
        padding: 4px 12px;
        border-radius: 40px;
        font-size: 0.8rem;
        direction: ltr;
      }
      .main-panel {
        display: flex;
        flex-wrap: wrap;
        gap: 32px;
      }
      .board-section {
        flex: 2;
        min-width: 300px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .board-wrapper {
        background: #f8fafc;
        padding: 16px;
        border-radius: 28px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      }
      canvas {
        width: 100%;
        max-width: 520px;
        height: auto;
        background-color: #f0d9b5;
        border-radius: 28px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        cursor: grab;
        display: block;
        margin: 0 auto;
      }
      canvas:active {
        cursor: grabbing;
      }
      .action-buttons {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-top: 24px;
        flex-wrap: wrap;
      }
      .btn {
        background: #eef2f5;
        border: none;
        padding: 8px 20px;
        border-radius: 40px;
        font-family: "Vazir";
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn-primary {
        background: #2c7da0;
        color: white;
      }
      .btn:hover {
        transform: scale(0.96);
        background: #e2e8f0;
      }
      .info-section {
        flex: 1.4;
        min-width: 260px;
        background: #f9fafc;
        border-radius: 32px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      }
      .engine-status {
        background: white;
        padding: 12px 16px;
        border-radius: 40px;
        text-align: center;
        font-weight: 600;
        color: #166b8f;
      }
      .move-history {
        background: white;
        border-radius: 28px;
        padding: 18px;
        max-height: 260px;
        overflow-y: auto;
        border: 1px solid #eef2f8;
      }
      .move-history h4 {
        color: #2c7da0;
        margin-bottom: 12px;
        border-right: 4px solid #2c7da0;
        padding-right: 12px;
      }
      .history-item {
        font-family: monospace;
        direction: ltr;
        padding: 5px 0;
        border-bottom: 1px solid #edf2f7;
        font-size: 0.85rem;
      }
      .message-area {
        background: #dbeafe;
        border-radius: 40px;
        padding: 16px;
        text-align: center;
        font-weight: 500;
        color: #1e40af;
      }
      @media (max-width: 768px) {
        .card-header h2 {
          font-size: 1.4rem;
        }
        .card-body {
          padding: 20px;
        }
        canvas {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <div class="training-card">
        <div class="card-header">
          <h2>🎯 تمرین آخر بازی – کشیدن مهره (Drag & Drop)</h2>
          <p>مهره سفید را بگیر و بکش | Stockfish حرفه‌ای</p>
        </div>
        <div class="card-body">
          <div class="top-bar">
            <div class="endgame-selector">
              <select id="endgameSelect"></select>
            </div>
            <div class="stats">
              <span>⚙️ عمق: 22</span>
              <span id="turnIndicator">⚪ نوبت شما</span>
              <span id="autoTimerSpan" class="auto-timer" style="display: none"
                >⏳ بعدی در 5 ثانیه</span
              >
            </div>
          </div>
          <div class="main-panel">
            <div class="board-section">
              <div class="board-wrapper">
                <canvas id="chessCanvas" width="520" height="520"></canvas>
              </div>
              <div class="action-buttons">
                <button id="undoBtn" class="btn">↩️ برگشت</button>
                <button id="resetBtn" class="btn">🔄 شروع مجدد</button>
                <button id="nextBtn" class="btn btn-primary">
                  ▶ پازل بعدی
                </button>
              </div>
            </div>
            <div class="info-section">
              <div class="engine-status" id="engineStatus">
                🧠 Stockfish (نهایت قدرت) آماده است
              </div>
              <div class="move-history">
                <h4>📜 تاریخچه حرکات</h4>
                <div id="historyList"></div>
              </div>
              <div class="message-area" id="messageBox">
                ✨ مهره را بگیرید و روی خانه مقصد رها کنید
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="footer-placeholder"></div>
    </div>

    <script src="js/script.js"></script>
    <script>
      // ========== بارگذاری مهره‌ها ==========
      const pieceImages = {};
      const pieceCodes = {
        wK: "wK.svg",
        wQ: "wQ.svg",
        wR: "wR.svg",
        wB: "wB.svg",
        wN: "wN.svg",
        wP: "wP.svg",
        bK: "bK.svg",
        bQ: "bQ.svg",
        bR: "bR.svg",
        bB: "bB.svg",
        bN: "bN.svg",
        bP: "bP.svg",
      };
      function loadPieces() {
        return new Promise((resolve) => {
          let loaded = 0;
          const total = Object.keys(pieceCodes).length;
          for (const [key, filename] of Object.entries(pieceCodes)) {
            const img = new Image();
            img.onload = img.onerror = () => {
              loaded++;
              if (loaded === total) resolve();
            };
            img.src = `pieces/merida/${filename}`;
            pieceImages[key] = img;
          }
        });
      }

      // ========== متغیرهای اصلی ==========
      let endgames = [];
      let currentIndex = 0;
      let game = null;
      let gameActive = true;
      let selectedSquare = null;
      let orientation = "white";
      let stockfish = null;
      let stockfishReady = false;
      let isComputerThinking = false;
      let waitingForStockfish = false;
      let autoTimerId = null,
        autoTimerInterval = null;
      const autoTimerSeconds = 5;

      // Drag & Drop
      let dragStartSquare = null;
      let isDragging = false;

      const canvas = document.getElementById("chessCanvas");
      const ctx = canvas.getContext("2d");
      let cellSize = canvas.width / 8;
      const endgameSelect = document.getElementById("endgameSelect");
      const turnIndicatorSpan = document.getElementById("turnIndicator");
      const engineStatusSpan = document.getElementById("engineStatus");
      const historyListDiv = document.getElementById("historyList");
      const messageBox = document.getElementById("messageBox");
      const undoBtn = document.getElementById("undoBtn");
      const resetBtn = document.getElementById("resetBtn");
      const nextBtn = document.getElementById("nextBtn");
      const autoTimerSpan = document.getElementById("autoTimerSpan");

      // ========== توابع کمکی ==========
      function getSquareFromXY(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (clientX - rect.left) * scaleX;
        const y = (clientY - rect.top) * scaleY;
        const col = Math.floor(x / cellSize);
        const row = Math.floor(y / cellSize);
        if (row < 0 || row >= 8 || col < 0 || col >= 8) return null;
        const file = String.fromCharCode(97 + col);
        const rank = 8 - row;
        return file + rank;
      }

      function getCanvasCoordsFromSquare(square) {
        const file = square.charCodeAt(0) - 97;
        const rank = 8 - parseInt(square[1]);
        return { x: file * cellSize, y: rank * cellSize };
      }

      function drawBoard() {
        const board = game.board();
        for (let i = 0; i < 8; i++) {
          for (let j = 0; j < 8; j++) {
            const isLight = (i + j) % 2 === 0;
            ctx.fillStyle = isLight ? "#f0d9b5" : "#b58863";
            ctx.fillRect(j * cellSize, i * cellSize, cellSize, cellSize);
            const piece = board[i][j];
            if (piece) {
              const code =
                (piece.color === "w" ? "w" : "b") + piece.type.toUpperCase();
              const img = pieceImages[code];
              if (img && img.complete) {
                ctx.drawImage(
                  img,
                  j * cellSize,
                  i * cellSize,
                  cellSize,
                  cellSize,
                );
              } else {
                ctx.font = `${cellSize * 0.55}px Arial`;
                ctx.fillStyle = "#222";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                const sym =
                  {
                    wK: "♔",
                    wQ: "♕",
                    wR: "♖",
                    wB: "♗",
                    wN: "♘",
                    wP: "♙",
                    bK: "♚",
                    bQ: "♛",
                    bR: "♜",
                    bB: "♝",
                    bN: "♞",
                    bP: "♟",
                  }[code] || "";
                ctx.fillText(
                  sym,
                  j * cellSize + cellSize / 2,
                  i * cellSize + cellSize / 2,
                );
              }
            }
          }
        }
        if (selectedSquare && !isDragging) {
          const { x, y } = getCanvasCoordsFromSquare(selectedSquare);
          ctx.save();
          ctx.strokeStyle = "#b7d968";
          ctx.lineWidth = 5;
          ctx.strokeRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
          ctx.restore();
        }
        ctx.font = `${cellSize * 0.22}px 'Vazir'`;
        ctx.fillStyle = "#4a4a4a";
        for (let i = 0; i < 8; i++) {
          ctx.fillText((8 - i).toString(), 5, i * cellSize + cellSize / 2);
          ctx.fillText(
            String.fromCharCode(97 + i),
            i * cellSize + cellSize - 12,
            8 * cellSize - 6,
          );
        }
      }
      function renderBoard() {
        drawBoard();
      }

      // ========== Stockfish ==========
      function initStockfish() {
        try {
          stockfish = new Worker("js/stockfish.js");
          stockfish.onmessage = (e) => {
            const data = e.data;
            if (data.includes("uciok")) {
              stockfishReady = true;
              engineStatusSpan.innerHTML = "✅ Stockfish فعال (قوی‌ترین حالت)";
              stockfish.postMessage("setoption name Threads value 4");
              stockfish.postMessage("setoption name Hash value 256");
              stockfish.postMessage("setoption name Skill Level value 20");
            } else if (data.includes("bestmove") && waitingForStockfish) {
              const movePart = data.split("bestmove ")[1]?.split(" ")[0];
              if (movePart && movePart !== "(none)") {
                waitingForStockfish = false;
                isComputerThinking = false;
                const from = movePart.slice(0, 2),
                  to = movePart.slice(2, 4),
                  promo = movePart[4] || "q";
                const move = game.move({
                  from,
                  to,
                  promotion: promo,
                  verbose: true,
                });
                if (move) {
                  renderBoard();
                  updateHistory();
                  checkGameOverAndMaybeAuto();
                  updateTurnDisplay();
                  if (!game.game_over() && game.turn() === "b")
                    setTimeout(() => requestComputerMove(), 100);
                } else fallbackComputerMove();
              } else {
                waitingForStockfish = false;
                isComputerThinking = false;
                fallbackComputerMove();
              }
            }
          };
          stockfish.postMessage("uci");
          setTimeout(() => {
            if (!stockfishReady) {
              stockfishReady = false;
              engineStatusSpan.innerHTML =
                "⚠️ Stockfish در دسترس نیست (موتور ساده جایگزین)";
            }
          }, 2000);
        } catch (e) {
          engineStatusSpan.innerHTML = "❌ Stockfish بارگذاری نشد";
          stockfishReady = false;
        }
      }

      function requestComputerMove() {
        if (
          !gameActive ||
          game.turn() !== "b" ||
          isComputerThinking ||
          waitingForStockfish ||
          game.game_over()
        )
          return;
        isComputerThinking = true;
        waitingForStockfish = true;
        updateTurnDisplay("🤖 کامپیوتر در حال فکر...");
        if (stockfish && stockfishReady) {
          stockfish.postMessage("stop");
          stockfish.postMessage(`position fen ${game.fen()}`);
          stockfish.postMessage("go depth 22");
        } else fallbackComputerMove();
      }

      const pieceVal = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 100 };
      function evalBoard(board, turn) {
        let score = 0;
        for (let i = 0; i < 8; i++)
          for (let j = 0; j < 8; j++) {
            const p = board[i][j];
            if (p) {
              let v = pieceVal[p.type];
              if (p.color === "w") score += v;
              else score -= v;
            }
          }
        return turn === "w" ? score : -score;
      }
      function getBestMoveSimple() {
        const moves = game.moves({ verbose: true });
        if (!moves.length) return null;
        let best = moves[0],
          bestScore = -Infinity;
        for (const mv of moves) {
          const test = new Chess(game.fen());
          test.move(mv);
          const s = evalBoard(test.board(), test.turn());
          if (s > bestScore) {
            bestScore = s;
            best = mv;
          }
        }
        return best;
      }
      function fallbackComputerMove() {
        if (!gameActive || game.turn() !== "b") return;
        const mv = getBestMoveSimple();
        if (mv) {
          game.move(mv);
          renderBoard();
          updateHistory();
          checkGameOverAndMaybeAuto();
          updateTurnDisplay();
          if (game.turn() === "b") setTimeout(() => requestComputerMove(), 200);
        }
        isComputerThinking = false;
        waitingForStockfish = false;
      }

      // ========== توابع بازی ==========
      function updateHistory() {
        const hist = game.history({ verbose: true });
        historyListDiv.innerHTML = "";
        if (!hist.length) {
          historyListDiv.innerHTML =
            '<div style="color:#94a3b8;">هیچ حرکتی ثبت نشده</div>';
          return;
        }
        for (let i = 0; i < hist.length; i += 2) {
          const num = i / 2 + 1;
          const white = hist[i] ? hist[i].san : "...";
          const black = hist[i + 1] ? hist[i + 1].san : "";
          const div = document.createElement("div");
          div.className = "history-item";
          div.textContent = `${num}. ${white} ${black}`;
          historyListDiv.appendChild(div);
        }
        historyListDiv.scrollTop = historyListDiv.scrollHeight;
      }

      function updateTurnDisplay(custom = null) {
        if (custom) {
          turnIndicatorSpan.innerHTML = custom;
          return;
        }
        if (game.game_over()) {
          turnIndicatorSpan.innerHTML = "🏁 پایان بازی";
          return;
        }
        turnIndicatorSpan.innerHTML =
          game.turn() === "w"
            ? "⚪ نوبت شما (سفید)"
            : "⚫ نوبت کامپیوتر (سیاه)";
      }

      function showMessage(msg, isErr = false) {
        messageBox.textContent = msg;
        messageBox.style.background = isErr ? "#fee2e2" : "#dbeafe";
        messageBox.style.color = isErr ? "#991b1b" : "#1e40af";
        setTimeout(() => {
          if (messageBox.textContent === msg) {
            messageBox.textContent = "✨ مهره را بگیرید و رها کنید";
            messageBox.style.background = "#dbeafe";
            messageBox.style.color = "#1e40af";
          }
        }, 4000);
      }

      function checkGameOverAndMaybeAuto() {
        if (game.game_over()) {
          gameActive = false;
          let msg = "";
          if (game.in_checkmate())
            msg = `🏆 مات! ${game.turn() === "w" ? "سفید مات شد" : "سیاه مات شد"}`;
          else if (game.in_stalemate()) msg = "🤝 پات (مساوی)";
          else if (game.in_threefold_repetition())
            msg = "🔄 تکرار سه‌گانه (مساوی)";
          else msg = "🏁 بازی تمام شد";
          showMessage(msg);
          engineStatusSpan.innerHTML = "🎯 بازی پایان یافت";
          updateTurnDisplay();
          startAutoTimer();
          return true;
        }
        return false;
      }

      function stopAutoTimer() {
        if (autoTimerId) clearTimeout(autoTimerId);
        if (autoTimerInterval) clearInterval(autoTimerInterval);
        autoTimerId = null;
        autoTimerInterval = null;
        autoTimerSpan.style.display = "none";
      }
      function startAutoTimer() {
        if (!endgames.length) return;
        stopAutoTimer();
        let remaining = autoTimerSeconds;
        autoTimerSpan.style.display = "inline-block";
        autoTimerSpan.textContent = `⏳ بعدی در ${remaining} ثانیه`;
        autoTimerInterval = setInterval(() => {
          remaining--;
          if (remaining > 0)
            autoTimerSpan.textContent = `⏳ بعدی در ${remaining} ثانیه`;
        }, 1000);
        autoTimerId = setTimeout(() => {
          stopAutoTimer();
          if (endgames.length)
            loadPosition((currentIndex + 1) % endgames.length, true);
        }, autoTimerSeconds * 1000);
      }

      function loadPosition(index, isAuto = false) {
        if (!endgames.length) return;
        if (isComputerThinking && !isAuto) return;
        stopAutoTimer();
        const eg = endgames[index];
        if (!eg) return;
        game = new Chess(eg.fen);
        selectedSquare = null;
        gameActive = true;
        if (stockfish) stockfish.postMessage("stop");
        isComputerThinking = false;
        waitingForStockfish = false;
        renderBoard();
        updateHistory();
        messageBox.textContent = `📍 ${eg.name || "پوزیشن"} | شروع بازی`;
        engineStatusSpan.innerHTML = stockfishReady
          ? "✅ Stockfish فعال"
          : "⚠️ موتور ساده";
        updateTurnDisplay();
        currentIndex = index;
        localStorage.setItem("chesshub_endgame_index", currentIndex);
        endgameSelect.value = index;
        if (game.turn() === "b" && !game.game_over())
          setTimeout(() => requestComputerMove(), 400);
      }

      function resetGame() {
        loadPosition(currentIndex);
      }
      function nextPuzzle() {
        stopAutoTimer();
        loadPosition((currentIndex + 1) % endgames.length);
      }

      function tryMove(from, to) {
        if (!gameActive || game.turn() !== "w") return false;
        if (isComputerThinking || waitingForStockfish) {
          showMessage("کامپیوتر در حال فکر...", false);
          return false;
        }
        const move = { from, to, promotion: "q" };
        try {
          const result = game.move(move);
          if (result) {
            selectedSquare = null;
            renderBoard();
            updateHistory();
            if (checkGameOverAndMaybeAuto()) return true;
            updateTurnDisplay();
            if (game.turn() === "b")
              setTimeout(() => requestComputerMove(), 100);
            return true;
          } else {
            showMessage("حرکت غیرمجاز", true);
            return false;
          }
        } catch (e) {
          showMessage("خطا در حرکت", true);
          return false;
        }
      }

      // ========== رویدادهای کشیدن مهره ==========
      function onMouseDown(e) {
        if (!gameActive || game.turn() !== "w") return;
        if (isComputerThinking || waitingForStockfish) {
          showMessage("کامپیوتر در حال فکر...", false);
          return;
        }
        const square = getSquareFromXY(e.clientX, e.clientY);
        if (!square) return;
        const piece = game.get(square);
        if (!piece || piece.color !== "w") return;
        dragStartSquare = square;
        isDragging = true;
        canvas.style.cursor = "grabbing";
        e.preventDefault();
      }

      function onMouseUp(e) {
        if (!isDragging || !dragStartSquare) {
          isDragging = false;
          canvas.style.cursor = "grab";
          return;
        }
        const targetSquare = getSquareFromXY(e.clientX, e.clientY);
        if (targetSquare && targetSquare !== dragStartSquare) {
          tryMove(dragStartSquare, targetSquare);
        }
        dragStartSquare = null;
        isDragging = false;
        canvas.style.cursor = "grab";
      }

      // کلیک معمولی (fallback)
      function onCanvasClick(e) {
        if (isDragging) return;
        if (!gameActive) {
          showMessage("بازی تمام شده!", true);
          return;
        }
        if (game.turn() !== "w") {
          showMessage("نوبت کامپیوتر است", false);
          return;
        }
        if (isComputerThinking || waitingForStockfish) {
          showMessage("کامپیوتر در حال فکر", false);
          return;
        }
        const square = getSquareFromXY(e.clientX, e.clientY);
        if (!square) return;
        if (selectedSquare === null) {
          const piece = game.get(square);
          if (piece && piece.color === "w") {
            selectedSquare = square;
            renderBoard();
          } else showMessage("مهره سفید خود را انتخاب کنید", true);
        } else {
          tryMove(selectedSquare, square);
          selectedSquare = null;
          renderBoard();
        }
      }

      // ========== بارگذاری دیتابیس از فایل ==========
      async function loadEndgamesFromFile() {
        try {
          const resp = await fetch("endgames.txt");
          if (!resp.ok) throw new Error();
          const text = await resp.text();
          const lines = text.split(/\r?\n/);
          endgames = [];
          for (let line of lines) {
            line = line.trim();
            if (line === "" || line.startsWith("#")) continue;
            const parts = line.split("|");
            if (parts.length >= 2) {
              const fen = parts[0].trim();
              let name = parts[1].trim();
              endgames.push({ fen, name });
            }
          }
          if (endgames.length === 0)
            endgames.push({ fen: "start", name: "موقعیت پیش‌فرض" });
          populateSelect();
          const saved = localStorage.getItem("chesshub_endgame_index");
          let idx = saved && !isNaN(parseInt(saved)) ? parseInt(saved) : 0;
          if (idx >= endgames.length) idx = 0;
          loadPosition(idx);
        } catch (e) {
          console.error(e);
          endgames = [{ fen: "start", name: "خطا در بارگذاری" }];
          populateSelect();
          loadPosition(0);
        }
      }

      function populateSelect() {
        endgameSelect.innerHTML = "";
        endgames.forEach((eg, i) => {
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = eg.name;
          endgameSelect.appendChild(opt);
        });
        endgameSelect.onchange = (e) => {
          stopAutoTimer();
          loadPosition(parseInt(e.target.value));
        };
      }

      // ========== راه‌اندازی ==========
      function initEventListeners() {
        canvas.addEventListener("mousedown", onMouseDown);
        window.addEventListener("mouseup", onMouseUp);
        canvas.addEventListener("click", onCanvasClick);
        undoBtn.onclick = () => {
          if (gameActive && game.turn() === "w") {
            const hist = game.history({ verbose: true });
            if (hist.length) {
              game.undo();
              if (hist.length > 1 && game.turn() !== "w") game.undo();
              selectedSquare = null;
              renderBoard();
              updateHistory();
              gameActive = true;
              if (game.turn() === "b")
                setTimeout(() => requestComputerMove(), 300);
              updateTurnDisplay();
              stopAutoTimer();
            }
          }
        };
        resetBtn.onclick = resetGame;
        nextBtn.onclick = nextPuzzle;
      }

      loadPieces().then(() => {
        initStockfish();
        loadEndgamesFromFile();
        initEventListeners();
      });
    </script>
  </body>
</html>
