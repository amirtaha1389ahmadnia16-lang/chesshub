<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ChessHub | تمرین آخربازی‌ها</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
      /* ============================================
         🎯 ریست اولیه برای جلوگیری از اسکرول
         ============================================ */
      html,
      body {
        overflow-x: hidden;
        overflow-y: auto;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0.8rem;
        padding-bottom: 1.5rem;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* ============================================
         🎯 استایل‌های اختصاصی آخربازی‌ها
         ============================================ */

      .endgame-hero {
        background: linear-gradient(
          135deg,
          #0f2b3f 0%,
          #1a4b6e 60%,
          #2a7f9c 100%
        );
        border-radius: var(--radius-lg);
        padding: 1.5rem 1.2rem;
        margin-bottom: 1rem;
        text-align: center;
        color: #fff;
        position: relative;
        overflow: hidden;
        min-height: 90px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .endgame-hero::before {
        content: "\265A";
        position: absolute;
        font-size: 80px;
        right: -10px;
        bottom: -20px;
        opacity: 0.06;
        font-family: "Vazir", serif;
      }

      .endgame-hero::after {
        content: "\265B";
        position: absolute;
        font-size: 60px;
        left: -10px;
        top: -20px;
        opacity: 0.06;
        font-family: "Vazir", serif;
      }

      .endgame-hero h1 {
        font-size: clamp(1.4rem, 3.5vw, 2rem);
        font-weight: 800;
        margin-bottom: 0.2rem;
        position: relative;
        z-index: 1;
      }

      .endgame-hero h1 .highlight {
        color: #ffb347;
      }

      .endgame-hero p {
        font-size: clamp(0.8rem, 1.5vw, 0.95rem);
        opacity: 0.85;
        max-width: 560px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      .game-area {
        background: var(--bg-card, #ffffff);
        border-radius: var(--radius-lg);
        padding: 16px;
        box-shadow: var(--shadow-md);
        max-width: 780px;
        margin: 0 auto;
        transition:
          background 0.3s ease,
          border-color 0.3s ease;
        border: 1px solid var(--border-color, transparent);
        overflow: hidden;
      }

      .position-selector {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      .position-selector select {
        background: var(--secondary);
        border: none;
        padding: 8px 16px;
        border-radius: 40px;
        font-weight: bold;
        font-size: 0.85rem;
        font-family: "Vazir";
        color: var(--text-dark);
        cursor: pointer;
        transition: 0.2s;
        min-width: 180px;
        outline: none;
        border: 2px solid transparent;
        max-width: 100%;
      }

      .position-selector select:focus {
        border-color: var(--primary);
      }

      .position-selector select option {
        background: var(--bg-card, white);
        color: var(--text-dark);
      }

      /* ============================================
         🎯 استایل آمار با عرض ثابت
         ============================================ */
      .stats {
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--secondary);
        padding: 8px 14px;
        border-radius: 60px;
        margin-bottom: 12px;
        font-weight: bold;
        flex-wrap: wrap;
        gap: 6px;
        color: var(--text-dark);
        transition: background 0.3s ease;
        min-height: 42px;
        width: 100%;
        box-sizing: border-box;
      }

      .stat-item {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 0.75rem;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .stat-item-fixed {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 0.75rem;
        white-space: nowrap;
        flex-shrink: 0;
        min-width: 45px;
        justify-content: center;
      }

      .turn-indicator {
        background: var(--border-color, #e2e8f0);
        padding: 3px 12px;
        border-radius: 30px;
        font-size: 0.7rem;
        font-weight: 600;
        min-width: 60px;
        text-align: center;
        color: var(--text-dark);
        transition:
          background 0.3s ease,
          color 0.3s ease;
        display: inline-block;
        flex-shrink: 0;
      }

      .user-color-badge {
        background: var(--primary);
        color: white;
        padding: 3px 12px;
        border-radius: 30px;
        font-size: 0.7rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
        min-width: 55px;
        justify-content: center;
      }

      .result-badge {
        background: #f59e0b;
        color: white;
        padding: 3px 12px;
        border-radius: 30px;
        font-size: 0.7rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
        min-width: 70px;
        justify-content: center;
      }

      .result-badge.success {
        background: #10b981;
      }

      .result-badge.draw {
        background: #6b7280;
      }

      .timer-badge {
        background: #1e293b;
        color: #facc15;
        padding: 3px 12px;
        border-radius: 30px;
        font-size: 0.7rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        min-width: 70px;
        justify-content: center;
        animation: pulse 1s ease-in-out infinite;
        flex-shrink: 0;
      }

      .timer-badge .timer-number {
        display: inline-block;
        min-width: 18px;
        text-align: center;
        font-weight: 900;
        font-size: 0.8rem;
      }

      .timer-badge.urgent {
        background: #991b1b;
        color: #fca5a5;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      #chessboard {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        aspect-ratio: 1 / 1;
        max-width: 480px;
        margin: 10px auto;
        border: 2px solid var(--border-color, #cbd5e1);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: var(--shadow-md);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      .square {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        position: relative;
        touch-action: none;
      }

      .square.light {
        background-color: var(--board-light, #f0d9b5);
      }

      .square.dark {
        background-color: var(--board-dark, #b58863);
      }

      .square.selected {
        background-color: #b7d968 !important;
        box-shadow: inset 0 0 0 3px var(--primary) !important;
      }

      .piece-img {
        width: 100%;
        height: 100%;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
        draggable: false;
      }

      .btn {
        background: var(--secondary);
        border: none;
        padding: 6px 16px;
        margin: 3px;
        border-radius: 40px;
        font-family: "Vazir";
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        color: var(--text-dark);
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 0.75rem;
      }

      .btn-primary {
        background: var(--primary);
        color: white;
      }

      .btn-primary:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
      }

      .btn-group {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 8px;
      }

      .message {
        margin-top: 10px;
        padding: 8px 14px;
        border-radius: 60px;
        font-size: 0.8rem;
        animation: fadeIn 0.3s;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        flex-wrap: wrap;
        width: 100%;
        box-sizing: border-box;
        word-break: break-word;
        overflow: hidden;
      }

      .message .timer-text {
        font-weight: 700;
        font-size: 0.95rem;
        background: rgba(255, 255, 255, 0.4);
        padding: 0 8px;
        border-radius: 20px;
        min-width: 20px;
        text-align: center;
        display: inline-block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .success {
        background: #d1fae5;
        color: #065f46;
      }
      .error {
        background: #fee2e2;
        color: #991b1b;
      }
      .info {
        background: #dbeafe;
        color: #1e40af;
      }
      .warning {
        background: #fef3c7;
        color: #92400e;
      }
      .retry {
        background: #fef3c7;
        color: #92400e;
        border: 2px solid #f59e0b;
      }

      .promotion-bar {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: var(--bg-card, white);
        border-radius: 30px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        padding: 0.8rem 1.2rem;
        display: flex;
        gap: 0.8rem;
        z-index: 2000;
        border: 2px solid var(--border-color, #e2e8f0);
        transition: opacity 0.2s;
        backdrop-filter: blur(10px);
      }

      .promotion-bar.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .promo-piece {
        cursor: pointer;
        padding: 0.4rem;
        border-radius: 14px;
        transition: 0.2s;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--secondary);
        min-width: 50px;
      }

      .promo-piece:hover {
        background: var(--primary);
        transform: scale(1.08);
      }

      .promo-piece img {
        width: 40px;
        height: 40px;
      }

      .promo-piece span {
        font-size: 0.6rem;
        color: var(--text-dark);
        margin-top: 2px;
      }

      .drag-clone {
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 8px 25px rgba(0, 0, 0, 0.3));
        transition: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      /* ============================================
         📱 واکنش‌گرایی - سایزهای بزرگتر برای موبایل
         ============================================ */

      /* تبلت و موبایل بزرگ */
      @media (max-width: 768px) {
        .container {
          padding: 0.6rem;
          padding-bottom: 1rem;
        }

        .endgame-hero {
          padding: 1.2rem 1rem;
          min-height: 70px;
        }
        .endgame-hero h1 {
          font-size: 1.3rem;
        }
        .endgame-hero p {
          font-size: 0.8rem;
        }
        .game-area {
          padding: 14px;
          margin: 0 4px;
        }
        #chessboard {
          max-width: 100%;
        }
        .stats {
          padding: 6px 10px;
          gap: 5px;
          min-height: 36px;
          border-radius: 40px;
        }
        .stat-item {
          font-size: 0.65rem;
        }
        .stat-item-fixed {
          font-size: 0.65rem;
          min-width: 38px;
        }
        .position-selector select {
          font-size: 0.75rem;
          padding: 6px 14px;
          min-width: 150px;
        }
        .turn-indicator {
          font-size: 0.6rem;
          min-width: 50px;
          padding: 2px 8px;
        }
        .user-color-badge {
          font-size: 0.6rem;
          min-width: 48px;
          padding: 2px 8px;
        }
        .result-badge {
          font-size: 0.6rem;
          min-width: 60px;
          padding: 2px 8px;
        }
        .timer-badge {
          font-size: 0.6rem;
          min-width: 60px;
          padding: 2px 8px;
        }
        .timer-badge .timer-number {
          min-width: 16px;
          font-size: 0.7rem;
        }
        .btn {
          font-size: 0.65rem;
          padding: 5px 12px;
          margin: 3px;
        }
        .message {
          font-size: 0.7rem;
          min-height: 34px;
          padding: 6px 10px;
        }
        .message .timer-text {
          font-size: 0.85rem;
          padding: 0 5px;
          min-width: 16px;
        }
        .promotion-bar {
          padding: 0.6rem 0.8rem;
          gap: 0.5rem;
        }
        .promo-piece img {
          width: 32px;
          height: 32px;
        }
        .promo-piece {
          min-width: 40px;
        }
      }

      /* موبایل */
      @media (max-width: 480px) {
        .container {
          padding: 0.4rem;
          padding-bottom: 0.8rem;
        }

        .endgame-hero {
          padding: 1rem 0.8rem;
          min-height: 60px;
          border-radius: 16px;
        }
        .endgame-hero h1 {
          font-size: 1.1rem;
        }
        .endgame-hero p {
          font-size: 0.7rem;
        }
        .game-area {
          padding: 10px;
          margin: 0 2px;
          border-radius: 16px;
        }
        #chessboard {
          max-width: 320px;
          margin: 8px auto;
        }
        .stats {
          padding: 5px 8px;
          gap: 4px;
          min-height: 32px;
          border-radius: 30px;
          flex-wrap: wrap;
        }
        .stat-item {
          font-size: 0.55rem;
        }
        .stat-item-fixed {
          font-size: 0.55rem;
          min-width: 32px;
        }
        .position-selector select {
          font-size: 0.65rem;
          padding: 5px 12px;
          min-width: 120px;
        }
        .turn-indicator {
          font-size: 0.5rem;
          min-width: 40px;
          padding: 2px 6px;
        }
        .user-color-badge {
          font-size: 0.5rem;
          min-width: 40px;
          padding: 2px 6px;
        }
        .result-badge {
          font-size: 0.5rem;
          min-width: 48px;
          padding: 2px 6px;
        }
        .timer-badge {
          font-size: 0.5rem;
          min-width: 48px;
          padding: 2px 6px;
        }
        .timer-badge .timer-number {
          min-width: 14px;
          font-size: 0.6rem;
        }
        .btn {
          font-size: 0.55rem;
          padding: 4px 10px;
          margin: 2px;
        }
        .btn i {
          font-size: 0.55rem;
        }
        .message {
          font-size: 0.6rem;
          min-height: 30px;
          padding: 5px 8px;
          border-radius: 30px;
        }
        .message .timer-text {
          font-size: 0.75rem;
          padding: 0 4px;
          min-width: 14px;
        }
        .promotion-bar {
          padding: 0.4rem 0.6rem;
          gap: 0.4rem;
        }
        .promo-piece {
          min-width: 36px;
          padding: 0.3rem;
        }
        .promo-piece img {
          width: 28px;
          height: 28px;
        }
        .promo-piece span {
          font-size: 0.5rem;
        }
      }

      /* موبایل خیلی کوچک */
      @media (max-width: 380px) {
        .container {
          padding: 0.3rem;
          padding-bottom: 0.5rem;
        }

        .endgame-hero {
          padding: 0.8rem 0.6rem;
          min-height: 50px;
        }
        .endgame-hero h1 {
          font-size: 1rem;
        }
        .endgame-hero p {
          font-size: 0.6rem;
        }
        .game-area {
          padding: 8px;
        }
        #chessboard {
          max-width: 260px;
        }
        .stats {
          padding: 4px 6px;
          gap: 3px;
          min-height: 28px;
        }
        .stat-item {
          font-size: 0.45rem;
        }
        .stat-item-fixed {
          font-size: 0.45rem;
          min-width: 28px;
        }
        .position-selector select {
          font-size: 0.55rem;
          padding: 4px 10px;
          min-width: 100px;
        }
        .turn-indicator {
          font-size: 0.45rem;
          min-width: 34px;
          padding: 1px 5px;
        }
        .user-color-badge {
          font-size: 0.45rem;
          min-width: 34px;
          padding: 1px 5px;
        }
        .result-badge {
          font-size: 0.45rem;
          min-width: 40px;
          padding: 1px 5px;
        }
        .timer-badge {
          font-size: 0.45rem;
          min-width: 40px;
          padding: 1px 5px;
        }
        .timer-badge .timer-number {
          min-width: 12px;
          font-size: 0.5rem;
        }
        .btn {
          font-size: 0.45rem;
          padding: 3px 8px;
        }
        .btn i {
          font-size: 0.45rem;
        }
        .message {
          font-size: 0.5rem;
          min-height: 26px;
          padding: 4px 6px;
        }
        .message .timer-text {
          font-size: 0.65rem;
          padding: 0 3px;
          min-width: 12px;
        }
        .promotion-bar {
          padding: 0.3rem 0.5rem;
          gap: 0.3rem;
        }
        .promo-piece {
          min-width: 30px;
          padding: 0.2rem;
        }
        .promo-piece img {
          width: 22px;
          height: 22px;
        }
        .promo-piece span {
          font-size: 0.4rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <section class="endgame-hero">
        <h1>🎯 تمرین <span class="highlight">آخربازی‌ها</span></h1>
        <p>۱ موقعیت آخربازی | بازی کامل با Stockfish</p>
      </section>

      <div class="game-area">
        <div class="position-selector">
          <select id="endgameSelect"></select>
        </div>

        <div class="stats" id="statsBar">
          <span class="stat-item-fixed"
            >🎯 <span id="positionCounter">۱</span></span
          >
          <span class="stat-item user-color-badge" id="userColorDisplay"
            >⚪ کاربر</span
          >
          <span class="stat-item result-badge" id="resultDisplay">🎯 1-0</span>
          <span class="stat-item turn-indicator" id="turnDisplay">⚪ شما</span>
          <span class="stat-item-fixed" id="moveCount">📊 ۰</span>
          <span
            class="stat-item timer-badge"
            id="timerBadge"
            style="display: none"
          >
            <i class="fas fa-hourglass-half"></i>
            <span class="timer-number" id="timerCount">۱۰</span> ثانیه
          </span>
        </div>

        <div id="chessboard" dir="ltr"></div>

        <div class="btn-group">
          <button id="undoBtn" class="btn">
            <i class="fas fa-undo-alt"></i> برگشت
          </button>
          <button id="resetBtn" class="btn">
            <i class="fas fa-sync-alt"></i> شروع
          </button>
          <button id="nextBtn" class="btn btn-primary">
            <i class="fas fa-forward"></i> بعدی
          </button>
        </div>

        <div id="message" class="message">✨ مهره را بگیرید و رها کنید</div>

        <div id="promotionBar" class="promotion-bar hidden"></div>
      </div>

      <div id="footer-placeholder"></div>
    </div>

    <script src="js/script.js"></script>
    <script>
      (function () {
        "use strict";

        // ============================================
        // 🎨 اعمال تم ذخیره‌شده
        // ============================================
        (function applySavedTheme() {
          try {
            const settings = JSON.parse(
              localStorage.getItem("chesshub_settings"),
            );
            if (settings && settings.theme) {
              document.body.className = document.body.className
                .split(" ")
                .filter((cls) => !cls.startsWith("theme-"))
                .join(" ");
              document.body.classList.add(`theme-${settings.theme}`);
            }
          } catch (e) {}
        })();

        // ============================================
        // 🚫 جلوگیری از اسکرول در حین بازی
        // ============================================
        let isGameActive = true;

        function preventScroll(e) {
          if (isGameActive) {
            e.preventDefault();
            return false;
          }
        }

        document.addEventListener("wheel", preventScroll, { passive: false });
        document.addEventListener("touchmove", preventScroll, {
          passive: false,
        });

        // ============================================
        // 🎨 دریافت مهره از تنظیمات
        // ============================================
        function getCurrentPieceSet() {
          try {
            const s = JSON.parse(localStorage.getItem("chesshub_settings"));
            return s?.pieceSet || "classic";
          } catch {
            return "classic";
          }
        }

        // ============================================
        // 🖼️ بارگذاری تصاویر مهره‌ها
        // ============================================
        const pieceImages = {};
        const pieceCodes = {
          wK: "pieces/classic/wK.png",
          wQ: "pieces/classic/wQ.png",
          wR: "pieces/classic/wR.png",
          wB: "pieces/classic/wB.png",
          wN: "pieces/classic/wN.png",
          wP: "pieces/classic/wP.png",
          bK: "pieces/classic/bK.png",
          bQ: "pieces/classic/bQ.png",
          bR: "pieces/classic/bR.png",
          bB: "pieces/classic/bB.png",
          bN: "pieces/classic/bN.png",
          bP: "pieces/classic/bP.png",
        };

        function loadPieces() {
          return new Promise((resolve) => {
            const set = getCurrentPieceSet();
            let loaded = 0,
              total = Object.keys(pieceCodes).length;
            for (const [key, filename] of Object.entries(pieceCodes)) {
              const img = new Image();
              img.onload = img.onerror = () => {
                loaded++;
                if (loaded === total) resolve();
              };
              img.src = `pieces/${set}/${filename}`;
              pieceImages[key] = img;
            }
          });
        }

        document.addEventListener("pieceSetChanged", function () {
          loadPieces().then(() => {
            if (game) renderBoard();
          });
        });

        // ============================================
        // 🎨 رنگ‌های تخته از تم
        // ============================================
        function getBoardColors() {
          const root = document.documentElement;
          const light =
            getComputedStyle(root).getPropertyValue("--board-light").trim() ||
            "#f0d9b5";
          const dark =
            getComputedStyle(root).getPropertyValue("--board-dark").trim() ||
            "#b58863";
          return { light, dark };
        }

        // ============================================
        // 📦 متغیرها
        // ============================================
        let endgames = [];
        let currentIndex = 0;
        let game = null;
        let gameActive = true;
        let selectedSquare = null;
        let isComputerThinking = false;
        let waitingForStockfish = false;
        let autoNextTimer = null;
        let countdownInterval = null;
        let countdownValue = 10;

        let currentUserColor = "w";
        let currentDesiredResult = "1-0";
        let currentPositionName = "";
        let isWaitingForRetry = false;

        let stockfish = null;
        let stockfishReady = false;

        const boardDiv = document.getElementById("chessboard");
        const msgDiv = document.getElementById("message");
        const endgameSelect = document.getElementById("endgameSelect");
        const turnSpan = document.getElementById("turnDisplay");
        const moveCountSpan = document.getElementById("moveCount");
        const positionCounterSpan = document.getElementById("positionCounter");
        const userColorDisplay = document.getElementById("userColorDisplay");
        const resultDisplay = document.getElementById("resultDisplay");
        const timerBadge = document.getElementById("timerBadge");
        const timerCount = document.getElementById("timerCount");
        const promotionBar = document.getElementById("promotionBar");

        // ============================================
        // 🎨 رسم تخته
        // ============================================
        function renderBoard() {
          if (!game) return;
          const board = game.board();
          const colors = getBoardColors();

          boardDiv.innerHTML = "";
          boardDiv.style.display = "grid";
          boardDiv.style.gridTemplateColumns = "repeat(8, 1fr)";
          boardDiv.style.touchAction = "none";
          boardDiv.style.userSelect = "none";
          boardDiv.style.webkitUserSelect = "none";

          const pieceSet = getCurrentPieceSet();
          const isFlipped = currentUserColor === "b";

          for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
              const row = isFlipped ? 7 - i : i;
              const col = isFlipped ? 7 - j : j;

              const piece = board[row][col];
              const isLight = (row + col) % 2 === 0;
              const squareDiv = document.createElement("div");
              squareDiv.className = `square ${isLight ? "light" : "dark"}`;

              const file = String.fromCharCode(97 + col);
              const rank = 8 - row;
              const squareName = file + rank;
              squareDiv.dataset.square = squareName;
              squareDiv.style.touchAction = "none";

              if (selectedSquare && squareName === selectedSquare) {
                squareDiv.classList.add("selected");
              }

              if (piece) {
                const key =
                  (piece.color === "w" ? "w" : "b") + piece.type.toUpperCase();
                const img = document.createElement("img");
                img.src = `pieces/${pieceSet}/${pieceCodes[key]}`;
                img.classList.add("piece-img");
                img.draggable = false;
                img.style.pointerEvents = "none";
                img.alt = key;
                squareDiv.appendChild(img);
              }
              boardDiv.appendChild(squareDiv);
            }
          }
        }

        // ============================================
        // 💬 پیام‌ها
        // ============================================
        function showMessage(
          msg,
          type = "info",
          showTimer = false,
          timerVal = 0,
        ) {
          msgDiv.textContent = "";
          msgDiv.className = `message ${type}`;

          if (showTimer && timerVal > 0) {
            const timerSpan = document.createElement("span");
            timerSpan.className = "timer-text";
            timerSpan.textContent = timerVal;
            msgDiv.appendChild(document.createTextNode(msg + " "));
            msgDiv.appendChild(timerSpan);
            msgDiv.appendChild(document.createTextNode(" ثانیه تا بعدی"));
          } else {
            msgDiv.textContent = msg;
          }

          if (!showTimer && !isWaitingForRetry) {
            setTimeout(() => {
              if (msgDiv.textContent === msg) {
                msgDiv.textContent = "✨ مهره را بگیرید و رها کنید";
                msgDiv.className = "message info";
              }
            }, 3500);
          }
        }

        // ============================================
        // 📊 آپدیت آمار
        // ============================================
        function updateStats() {
          const hist = game.history({ verbose: true });
          const totalMoves = Math.ceil(hist.length / 2);
          moveCountSpan.textContent = `📊 ${totalMoves}`;
          positionCounterSpan.textContent = `${currentIndex + 1}`;

          const colorName = currentUserColor === "w" ? "سفید" : "سیاه";
          const colorIcon = currentUserColor === "w" ? "⚪" : "⚫";
          userColorDisplay.textContent = `${colorIcon} ${colorName}`;

          const resultMap = {
            "1-0": "🏆 سفید",
            "0-1": "🏆 سیاه",
            "1/2-1/2": "🤝 مساوی",
          };
          resultDisplay.textContent = `${resultMap[currentDesiredResult] || currentDesiredResult}`;
          resultDisplay.className = "stat-item result-badge";
          if (
            currentDesiredResult === "1-0" ||
            currentDesiredResult === "0-1"
          ) {
            resultDisplay.classList.add("success");
          } else if (currentDesiredResult === "1/2-1/2") {
            resultDisplay.classList.add("draw");
          }

          if (!gameActive || game.game_over()) {
            turnSpan.textContent = "🏁 پایان";
            turnSpan.className = "stat-item turn-indicator";
            return;
          }

          const isUserTurn = game.turn() === currentUserColor;
          if (isUserTurn) {
            turnSpan.textContent = "⚪ شما";
            turnSpan.className = "stat-item turn-indicator";
          } else {
            const computerColor = currentUserColor === "w" ? "سیاه" : "سفید";
            turnSpan.textContent = `⚫ ${computerColor}`;
            turnSpan.className = "stat-item turn-indicator";
          }
        }

        // ============================================
        // 🔄 بررسی نتیجه
        // ============================================
        function checkGameOver() {
          if (game.game_over()) {
            gameActive = false;

            let actualResult = "";
            if (game.in_checkmate()) {
              actualResult = game.turn() === "w" ? "0-1" : "1-0";
            } else {
              actualResult = "1/2-1/2";
            }

            const isCorrect = actualResult === currentDesiredResult;

            if (isCorrect) {
              const resultMap = {
                "1-0": "برد سفید",
                "0-1": "برد سیاه",
                "1/2-1/2": "مساوی",
              };
              showMessage(
                `🎉 ✅ نتیجه صحیح! (${resultMap[actualResult]})`,
                "success",
              );
              updateStats();
              startAutoNext();
              return true;
            } else {
              const resultMap = {
                "1-0": "برد سفید",
                "0-1": "برد سیاه",
                "1/2-1/2": "مساوی",
              };
              const desiredMap = {
                "1-0": "برد سفید",
                "0-1": "برد سیاه",
                "1/2-1/2": "مساوی",
              };
              isWaitingForRetry = true;
              showMessage(
                `❌ نتیجه اشتباه! (${resultMap[actualResult]}) هدف: ${desiredMap[currentDesiredResult]}`,
                "retry",
              );

              setTimeout(() => {
                isWaitingForRetry = false;
                loadPosition(currentIndex);
              }, 2000);

              return true;
            }
          }
          return false;
        }

        // ============================================
        // ⏱️ تایمر شمارش معکوس
        // ============================================
        function startCountdown() {
          if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
          }

          countdownValue = 10;
          timerBadge.style.display = "inline-flex";
          timerCount.textContent = countdownValue;
          timerBadge.classList.remove("urgent");

          showMessage(`⏳ بعدی در`, "warning", true, countdownValue);

          countdownInterval = setInterval(() => {
            countdownValue--;
            timerCount.textContent = countdownValue;

            if (countdownValue > 0) {
              showMessage(`⏳ بعدی در`, "warning", true, countdownValue);
            }

            if (countdownValue <= 3) {
              timerBadge.classList.add("urgent");
            }

            if (countdownValue <= 0) {
              clearInterval(countdownInterval);
              countdownInterval = null;
              timerBadge.style.display = "none";
              timerBadge.classList.remove("urgent");

              const nextIndex = (currentIndex + 1) % endgames.length;
              loadPosition(nextIndex);
            }
          }, 1000);
        }

        function stopCountdown() {
          if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
          }
          timerBadge.style.display = "none";
          timerBadge.classList.remove("urgent");
        }

        // ============================================
        // ⏭️ پرش خودکار به بعدی
        // ============================================
        function startAutoNext() {
          if (autoNextTimer) {
            clearTimeout(autoNextTimer);
            autoNextTimer = null;
          }
          startCountdown();
        }

        // ============================================
        // 🔄 بارگذاری پوزیسیون
        // ============================================
        function loadPosition(index) {
          if (!endgames.length) return;

          const eg = endgames[index];
          if (!eg) return;

          if (autoNextTimer) {
            clearTimeout(autoNextTimer);
            autoNextTimer = null;
          }
          stopCountdown();
          isWaitingForRetry = false;

          currentUserColor = eg.userColor || "w";
          currentDesiredResult = eg.result || "1-0";
          currentPositionName = eg.name || "آخربازی";

          game = new Chess(eg.fen);
          selectedSquare = null;
          gameActive = true;

          const isUsersTurn = game.turn() === currentUserColor;

          renderBoard();
          updateStats();

          const colorName = currentUserColor === "w" ? "سفید" : "سیاه";
          const computerColor = currentUserColor === "w" ? "سیاه" : "سفید";
          const resultMap = {
            "1-0": "برد سفید",
            "0-1": "برد سیاه",
            "1/2-1/2": "مساوی",
          };
          showMessage(
            `📍 ${eg.name} | شما ${colorName} | کامپیوتر ${computerColor} | هدف: ${resultMap[currentDesiredResult]}`,
            "info",
          );

          currentIndex = index;
          localStorage.setItem("chesshub_endgame_index", currentIndex);
          endgameSelect.value = index;

          if (stockfish && stockfishReady) {
            stockfish.postMessage("stop");
          }

          if (!isUsersTurn) {
            setTimeout(() => requestComputerMove(), 500);
          }
        }

        // ============================================
        // 🤖 Stockfish
        // ============================================
        function initStockfish() {
          try {
            stockfish = new Worker("js/stockfish.js");
            stockfish.onmessage = (e) => {
              const data = e.data;
              if (data.includes("uciok")) {
                stockfishReady = true;
                stockfish.postMessage("setoption name Threads value 2");
                stockfish.postMessage("setoption name Hash value 256");
                stockfish.postMessage("setoption name Skill Level value 20");
              } else if (data.includes("bestmove") && waitingForStockfish) {
                waitingForStockfish = false;
                isComputerThinking = false;
                const movePart = data.split("bestmove ")[1]?.split(" ")[0];
                if (movePart && movePart !== "(none)") {
                  const from = movePart.slice(0, 2),
                    to = movePart.slice(2, 4);
                  let promo = movePart[4] || "q";
                  try {
                    const move = game.move({ from, to, promotion: promo });
                    if (move) {
                      renderBoard();
                      updateStats();
                      if (
                        !checkGameOver() &&
                        game.turn() === "b" &&
                        gameActive
                      ) {
                        const isUsersTurn = game.turn() === currentUserColor;
                        if (!isUsersTurn) {
                          setTimeout(() => requestComputerMove(), 300);
                        }
                      }
                    } else {
                      fallbackComputerMove();
                    }
                  } catch (e) {
                    fallbackComputerMove();
                  }
                } else {
                  fallbackComputerMove();
                }
              }
            };
            stockfish.postMessage("uci");
            setTimeout(() => {
              if (!stockfishReady) {
                stockfishReady = false;
              }
            }, 2000);
          } catch (e) {
            stockfishReady = false;
          }
        }

        function requestComputerMove() {
          if (
            !gameActive ||
            isComputerThinking ||
            waitingForStockfish ||
            game.game_over()
          )
            return;

          const isUsersTurn = game.turn() === currentUserColor;
          if (isUsersTurn) return;

          isComputerThinking = true;
          waitingForStockfish = true;

          const computerColor = currentUserColor === "w" ? "سیاه" : "سفید";
          turnSpan.textContent = `⚫ ${computerColor}`;

          if (stockfish && stockfishReady) {
            stockfish.postMessage("stop");
            stockfish.postMessage(`position fen ${game.fen()}`);
            stockfish.postMessage("go depth 20");
          } else {
            fallbackComputerMove();
          }
        }

        // ============================================
        // 🎯 توابع کمکی Stockfish
        // ============================================
        const pieceVal = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 100 };

        function evalBoardSimple(board, turn) {
          let score = 0;
          for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
              const p = board[i][j];
              if (p) {
                let v = pieceVal[p.type];
                score += p.color === "w" ? v : -v;
              }
            }
          }
          return turn === "w" ? score : -score;
        }

        function getBestSimple() {
          const moves = game.moves({ verbose: true });
          if (!moves.length) return null;
          let best = moves[0],
            bestScore = -Infinity;
          for (const mv of moves) {
            const test = new Chess(game.fen());
            test.move(mv);
            const s = evalBoardSimple(test.board(), test.turn());
            if (s > bestScore) {
              bestScore = s;
              best = mv;
            }
          }
          return best;
        }

        function fallbackComputerMove() {
          if (!gameActive) return;

          const isUsersTurn = game.turn() === currentUserColor;
          if (isUsersTurn) {
            isComputerThinking = false;
            waitingForStockfish = false;
            return;
          }

          const mv = getBestSimple();
          if (mv) {
            game.move(mv);
            renderBoard();
            updateStats();
            if (checkGameOver()) return;

            const nextIsUsersTurn = game.turn() === currentUserColor;
            if (!nextIsUsersTurn && gameActive) {
              setTimeout(() => requestComputerMove(), 200);
            }
          }
          isComputerThinking = false;
          waitingForStockfish = false;
        }

        // ============================================
        // 🎯 حرکت کاربر
        // ============================================
        async function tryMove(from, to) {
          if (!gameActive) {
            showMessage("بازی تمام شده!", "error");
            return false;
          }

          const isUsersTurn = game.turn() === currentUserColor;
          if (!isUsersTurn) {
            showMessage("نوبت شما نیست!", "error");
            return false;
          }

          if (isComputerThinking || waitingForStockfish) {
            showMessage("کامپیوتر در حال فکر...", "info");
            return false;
          }

          const piece = game.get(from);
          const isPawnPromotion =
            piece &&
            piece.type === "p" &&
            ((piece.color === "w" && to[1] === "8") ||
              (piece.color === "b" && to[1] === "1"));

          let promotion = "q";
          if (isPawnPromotion) {
            promotion = await new Promise((resolve) => {
              showPromotionBar(resolve);
            });
          }

          try {
            const result = game.move({ from, to, promotion });
            if (result) {
              selectedSquare = null;
              renderBoard();
              updateStats();

              if (checkGameOver()) return true;

              const nextIsUsersTurn = game.turn() === currentUserColor;
              if (!nextIsUsersTurn && gameActive) {
                setTimeout(() => requestComputerMove(), 300);
              }
              return true;
            } else {
              showMessage("حرکت غیرمجاز", "error");
              return false;
            }
          } catch (e) {
            showMessage("خطا در حرکت", "error");
            return false;
          }
        }

        // ============================================
        // 🎨 نوار ترفیع
        // ============================================
        function showPromotionBar(callback) {
          promotionBar.classList.remove("hidden");
          promotionBar.innerHTML = "";

          const pieces = [
            { type: "q", name: "وزیر", file: "pieces/classic/wQ.png" },
            { type: "r", name: "رخ", file: "pieces/classic/wR.png" },
            { type: "b", name: "فیل", file: "pieces/classic/wB.png" },
            { type: "n", name: "اسب", file: "pieces/classic/wN.png" },
          ];

          const pieceSet = getCurrentPieceSet();

          pieces.forEach((p) => {
            const btn = document.createElement("div");
            btn.className = "promo-piece";
            const img = document.createElement("img");
            img.src = `pieces/${pieceSet}/${p.file}`;
            img.alt = p.name;
            const label = document.createElement("span");
            label.textContent = p.name;
            btn.appendChild(img);
            btn.appendChild(label);
            btn.onclick = () => {
              promotionBar.classList.add("hidden");
              callback(p.type);
            };
            promotionBar.appendChild(btn);
          });
        }

        // ============================================
        // 📂 Drag & Drop
        // ============================================
        let dragStartSquare = null;
        let isDragging = false;
        let dragClone = null;

        function getSquareFromXY(clientX, clientY) {
          const rect = boardDiv.getBoundingClientRect();
          const cellSize = rect.width / 8;
          const scaleX = 8 / (rect.width / cellSize);
          const scaleY = 8 / (rect.height / cellSize);
          let x = (clientX - rect.left) * scaleX;
          let y = (clientY - rect.top) * scaleY;

          const isFlipped = currentUserColor === "b";
          let col = isFlipped ? 7 - Math.floor(x) : Math.floor(x);
          let row = isFlipped ? Math.floor(y) : 7 - Math.floor(y);

          if (row < 0 || row >= 8 || col < 0 || col >= 8) return null;
          return String.fromCharCode(97 + col) + (row + 1);
        }

        function createDragClone(square) {
          if (dragClone) dragClone.remove();
          const squareEl = document.querySelector(
            `.square[data-square="${square}"]`,
          );
          if (!squareEl) return null;
          const img = squareEl.querySelector(".piece-img");
          if (!img) return null;
          const rect = squareEl.getBoundingClientRect();
          const clone = img.cloneNode(true);
          const size = Math.min(rect.width, rect.height);
          clone.style.cssText = `
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: ${size}px;
            height: ${size}px;
            transform: translate(-50%, -50%) scale(1.08);
            filter: drop-shadow(0 8px 25px rgba(0,0,0,0.3));
            transition: none;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
          `;
          document.body.appendChild(clone);
          return clone;
        }

        function updateDragClone(clientX, clientY) {
          if (!dragClone) return;
          dragClone.style.left = clientX + "px";
          dragClone.style.top = clientY + "px";
        }

        function removeDragClone() {
          if (dragClone) {
            dragClone.remove();
            dragClone = null;
          }
        }

        function cleanupDrag() {
          dragStartSquare = null;
          isDragging = false;
          document.body.style.userSelect = "";
          boardDiv.style.touchAction = "";
          removeDragClone();
        }

        function onPointerDown(e) {
          e.preventDefault();

          const isUsersTurn = game.turn() === currentUserColor;
          if (!gameActive || !isUsersTurn) {
            if (!isUsersTurn) showMessage("نوبت شما نیست!", "error");
            return;
          }

          if (isComputerThinking || waitingForStockfish) {
            showMessage("کامپیوتر در حال فکر...", "info");
            return;
          }

          let clientX, clientY;
          if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
          } else {
            clientX = e.clientX;
            clientY = e.clientY;
          }

          const elem = document.elementFromPoint(clientX, clientY);
          const squareDiv = elem?.closest?.(".square");
          if (!squareDiv) return;
          const square = squareDiv.dataset.square;
          if (!square) return;
          const piece = game.get(square);

          if (piece && piece.color === currentUserColor) {
            dragStartSquare = square;
            isDragging = true;
            dragClone = createDragClone(square);
            if (dragClone) updateDragClone(clientX, clientY);
            document.body.style.userSelect = "none";
            boardDiv.style.touchAction = "none";
          } else {
            const colorName = currentUserColor === "w" ? "سفید" : "سیاه";
            showMessage(`مهره ${colorName} خود را انتخاب کنید`, "error");
          }
        }

        function onPointerMove(e) {
          if (!isDragging) return;
          e.preventDefault();
          let clientX, clientY;
          if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
          } else {
            clientX = e.clientX;
            clientY = e.clientY;
          }
          if (dragClone) updateDragClone(clientX, clientY);
        }

        function onPointerUp(e) {
          if (!isDragging || !dragStartSquare) {
            cleanupDrag();
            return;
          }
          e.preventDefault();
          let clientX, clientY;
          if (e.changedTouches) {
            clientX = e.changedTouches[0].clientX;
            clientY = e.changedTouches[0].clientY;
          } else {
            clientX = e.clientX;
            clientY = e.clientY;
          }
          removeDragClone();

          const elem = document.elementFromPoint(clientX, clientY);
          const targetSquareDiv = elem?.closest?.(".square");
          let targetSquare = targetSquareDiv
            ? targetSquareDiv.dataset.square
            : null;

          if (targetSquare && targetSquare !== dragStartSquare) {
            tryMove(dragStartSquare, targetSquare);
          }
          cleanupDrag();
        }

        function onClickFallback(e) {
          if (isDragging) return;

          const isUsersTurn = game.turn() === currentUserColor;
          if (!gameActive || !isUsersTurn) {
            if (!isUsersTurn) showMessage("نوبت شما نیست!", "error");
            return;
          }

          if (isComputerThinking || waitingForStockfish) {
            showMessage("کامپیوتر در حال فکر...", "info");
            return;
          }

          const squareDiv = e.target.closest(".square");
          if (!squareDiv) return;
          const square = squareDiv.dataset.square;
          if (!square) return;

          if (selectedSquare === null) {
            const piece = game.get(square);
            if (piece && piece.color === currentUserColor) {
              selectedSquare = square;
              renderBoard();
            } else {
              const colorName = currentUserColor === "w" ? "سفید" : "سیاه";
              showMessage(`مهره ${colorName} خود را انتخاب کنید`, "error");
            }
          } else {
            tryMove(selectedSquare, square);
            selectedSquare = null;
          }
        }

        // ============================================
        // 📂 بارگذاری آخربازی‌ها
        // ============================================
        async function loadEndgamesFromFile() {
          try {
            const resp = await fetch("data/endgames.txt");
            if (!resp.ok) throw new Error();
            const text = await resp.text();
            const lines = text.split(/\r?\n/);
            endgames = [];

            for (let line of lines) {
              line = line.trim();
              if (!line || line.startsWith("#")) continue;
              const parts = line.split("|");
              if (parts.length >= 4) {
                const fen = parts[0].trim();
                const name = parts[1].trim();
                const userColor = parts[2].trim();
                const result = parts[3].trim();
                endgames.push({ fen, name, userColor, result });
              } else if (parts.length >= 2) {
                const fen = parts[0].trim();
                const name = parts[1].trim();
                const userColor = "w";
                const result = "1-0";
                endgames.push({ fen, name, userColor, result });
              }
            }

            if (!endgames.length) {
              endgames.push({
                fen: "start",
                name: "موقعیت پیش‌فرض",
                userColor: "w",
                result: "1-0",
              });
            }

            populateSelect();

            const saved = localStorage.getItem("chesshub_endgame_index");
            let idx = saved && !isNaN(parseInt(saved)) ? parseInt(saved) : 0;
            if (idx >= endgames.length) idx = 0;

            loadPosition(idx);
          } catch (e) {
            console.error(e);
            endgames = [
              {
                fen: "start",
                name: "خطا در بارگذاری",
                userColor: "w",
                result: "1-0",
              },
            ];
            populateSelect();
            loadPosition(0);
          }
        }

        function populateSelect() {
          endgameSelect.innerHTML = "";
          endgames.forEach((eg, i) => {
            const opt = document.createElement("option");
            opt.value = i;
            const colorName = eg.userColor === "w" ? "⚪ سفید" : "⚫ سیاه";
            const resultMap = {
              "1-0": "🏆 برد سفید",
              "0-1": "🏆 برد سیاه",
              "1/2-1/2": "🤝 مساوی",
            };
            opt.textContent = `${eg.name} | ${colorName} | ${resultMap[eg.result] || eg.result}`;
            endgameSelect.appendChild(opt);
          });
          endgameSelect.onchange = (e) => {
            if (autoNextTimer) {
              clearTimeout(autoNextTimer);
              autoNextTimer = null;
            }
            stopCountdown();
            loadPosition(parseInt(e.target.value));
          };
        }

        // ============================================
        // 🎮 عملیات دکمه‌ها
        // ============================================
        function resetGame() {
          if (autoNextTimer) {
            clearTimeout(autoNextTimer);
            autoNextTimer = null;
          }
          stopCountdown();
          loadPosition(currentIndex);
        }

        function nextPuzzle() {
          if (autoNextTimer) {
            clearTimeout(autoNextTimer);
            autoNextTimer = null;
          }
          stopCountdown();
          const nextIndex = (currentIndex + 1) % endgames.length;
          loadPosition(nextIndex);
        }

        function undoMove() {
          if (!gameActive) return;

          const hist = game.history({ verbose: true });
          if (hist.length === 0) {
            showMessage("هیچ حرکتی برای برگشت وجود ندارد", "info");
            return;
          }

          if (hist.length >= 2) {
            game.undo();
            game.undo();
          } else {
            game.undo();
          }
          selectedSquare = null;
          renderBoard();
          updateStats();
          showMessage("↩️ حرکت برگشت داده شد", "info");

          const isUsersTurn = game.turn() === currentUserColor;
          if (!isUsersTurn && gameActive) {
            setTimeout(() => requestComputerMove(), 300);
          }
        }

        // ============================================
        // 🚀 راه‌اندازی
        // ============================================
        loadPieces().then(() => {
          initStockfish();
          loadEndgamesFromFile();

          boardDiv.addEventListener("mousedown", onPointerDown);
          window.addEventListener("mousemove", onPointerMove);
          window.addEventListener("mouseup", onPointerUp);
          boardDiv.addEventListener("touchstart", onPointerDown, {
            passive: false,
          });
          boardDiv.addEventListener("touchmove", onPointerMove, {
            passive: false,
          });
          boardDiv.addEventListener("touchend", onPointerUp);
          boardDiv.addEventListener("click", onClickFallback);

          document
            .getElementById("undoBtn")
            .addEventListener("click", undoMove);
          document
            .getElementById("resetBtn")
            .addEventListener("click", resetGame);
          document
            .getElementById("nextBtn")
            .addEventListener("click", nextPuzzle);

          document.addEventListener("themeChanged", function () {
            if (game) renderBoard();
          });

          setTimeout(() => {
            isGameActive = false;
          }, 1000);

          console.log("✅ ChessHub Endgames loaded successfully");
        });
      })();
    </script>
  </body>
</html>
