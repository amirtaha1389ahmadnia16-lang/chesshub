<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="تمرین آخر بازی‌های شطرنج - یادگیری تکنیک‌های پایان بازی"
    />
    <title>ChessHub | آخربازی‌ها</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/endgames.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div id="header-placeholder"></div>

      <!-- بنر یکپارچه -->
      <section class="app-hero">
        <h1><i class="fas fa-flag-checkered"></i> تمرین آخربازی</h1>
        <p>تسلط بر تکنیک‌های پایان بازی برای پیروزی قطعی</p>
      </section>

      <div class="game-area">
        <div class="position-selector">
          <select id="endgameSelect"></select>
        </div>

        <div class="stats">
          <span id="positionCounter"
            ><i class="fas fa-map-marker-alt"></i> 1</span
          >
          <span id="moveCount"><i class="fas fa-exchange-alt"></i> 0</span>
          <span id="userColorDisplay" class="user-color-badge"
            ><i class="fas fa-user"></i> سفید</span
          >
          <span id="resultDisplay" class="result-badge"
            ><i class="fas fa-flag"></i> برد سفید</span
          >
          <span id="turnDisplay" class="turn-indicator"
            ><i class="fas fa-user"></i> شما</span
          >
          <span id="timerBadge" class="timer-badge" style="display: none">
            <i class="fas fa-hourglass-half"></i>
            <span id="timerCount">10</span>
          </span>
        </div>

        <div id="chessboard"></div>

        <div class="btn-group">
          <button id="undoBtn" class="btn">
            <i class="fas fa-undo"></i> برگشت
          </button>
          <button id="resetBtn" class="btn">
            <i class="fas fa-redo"></i> از نو
          </button>
          <button id="nextBtn" class="btn btn-primary">
            <i class="fas fa-forward"></i> بعدی
          </button>
        </div>

        <div id="message" class="message"></div>
      </div>

      <div id="footer-placeholder"></div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/endgames.js"></script>
  </body>
</html>
